# Compila el APK de Manga Traductor (con el OCR incluido, ~150 MB) y lo publica
# en GitHub Releases con un enlace fijo que siempre apunta a la última versión:
#   https://github.com/<usuario>/<repo>/releases/download/manga-traductor/MangaTraductor-arm64-v8a.apk
name: APK Manga Traductor

on:
  push:
    paths:
      - "manga-translator-android/**"
      - "manga-translator/examples/sample_page.png"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # para publicar la versión en Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manga-translator-android
    env:
      # Donde la tarea de Gradle guarda el modelo manga-ocr descargado.
      MANGA_OCR_DIR: /home/runner/.gradle/caches/manga-ocr/f9023406bb2f6b17df67bc4a327c56ecd20611f0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # El runner ya trae el SDK de Android: sólo se añaden las versiones que usa el proyecto.
      - name: SDK de Android
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Descargar manga-ocr (va dentro del APK)
        run: ./gradlew :app:downloadMangaOcrRelease

      - name: Pruebas
        run: ./gradlew :core:test :app:testReleaseUnitTest

      - name: Compilar el APK
        run: ./gradlew :app:assembleRelease

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk MangaTraductor-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk MangaTraductor-armeabi-v7a.apk
          gh release delete manga-traductor --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create manga-traductor MangaTraductor-arm64-v8a.apk MangaTraductor-armeabi-v7a.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Manga Traductor (compilación ${GITHUB_RUN_NUMBER})" \
            --notes "APK de Android con el OCR ya incluido.
          - MangaTraductor-arm64-v8a.apk: casi todos los móviles (64 bits).
          - MangaTraductor-armeabi-v7a.apk: móviles antiguos de 32 bits.
          Compilado desde ${GITHUB_SHA} (rama ${GITHUB_REF_NAME})."
