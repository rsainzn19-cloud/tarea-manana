        <text x="112" y="382" class="t-hd" text-anchor="middle">Inguinales</text>
        <text x="112" y="396" class="t-hd" text-anchor="middle">superficiales</text>

        <path d="M378 180 C428 148 424 92 382 66" class="st a-hi" stroke-width="2.4" fill="none" marker-end="url(#ar-e1)"/>
        <text x="440" y="106" class="t-sm">Desde el fondo,</text>
        <text x="440" y="121" class="t-sm">por los vasos ováricos</text>
        <text x="440" y="136" class="t-sm">(lig. infundibulopélvico)</text>

        <path d="M392 236 L562 206" class="st a-hi" stroke-width="2.4" fill="none" marker-end="url(#ar-e1)"/>
        <text x="452" y="256" class="t-sm">Desde el cuerpo,</text>
        <text x="452" y="271" class="t-sm">por el parametrio</text>

        <path d="M372 320 Q470 336 562 326" class="st a-hi" stroke-width="2.4" fill="none" marker-end="url(#ar-e1)"/>
        <text x="452" y="366" class="t-sm">Desde el cuello y el</text>
        <text x="452" y="381" class="t-sm">segmento inferior</text>

        <path d="M310 210 Q232 268 140 336" class="st a-hi" stroke-width="2.4" fill="none" marker-end="url(#ar-e1)"/>
        <text x="176" y="360" class="t-sm">Desde el cuerno, a lo largo</text>
        <text x="176" y="375" class="t-sm">del ligamento redondo</text>
      </svg>
      </div>
      <figcaption><b>El útero drena en cuatro direcciones a la vez, y dos de ellas sorprenden.</b> El fondo puede ir <b>directo a los paraaórticos</b> siguiendo los vasos ováricos, saltándose la pelvis — por eso existen las metástasis paraaórticas aisladas. Y el trayecto por el <b>ligamento redondo</b> explica la afectación <b>inguinal</b>, que de otro modo parecería inexplicable en un tumor pélvico. El ganglio centinela se inyecta en el <b>cuello</b>, no en el fondo, y mapea sobre todo las cadenas obturatriz e ilíaca externa.</figcaption>
    </figure>

    <h4 class="sub">Trayecto del uréter — los tres puntos de lesión</h4>
    <ol>
      <li><strong>Al ligar el ligamento infundibulopélvico</strong>: el uréter cruza los vasos ilíacos justo por debajo, en el estrecho pélvico.</li>
      <li><strong>Al ligar la arteria uterina</strong>: pasa por debajo de ella, a 1.5–2 cm del cuello.</li>
      <li><strong>Al cerrar la cúpula vaginal</strong>: el uréter entra en el túnel del ligamento cardinal camino del trígono.</li>
    </ol>`},

  {titulo:"Fisiología del ciclo endometrial", kicker:"Fisiología", html:`
    <h3>Estrógeno prolifera, progesterona frena</h3>
    <div class="tw"><table>
      <thead><tr><th>Fase</th><th>Hormona</th><th>Histología</th></tr></thead>
      <tbody>
        <tr><td><strong>Proliferativa</strong></td><td><strong>Estradiol</strong> (granulosa)</td><td>Glándulas rectas y estrechas, mitosis abundantes, estroma denso, crecimiento de las arterias espirales</td></tr>
        <tr><td><strong>Ovulación</strong></td><td>Pico de <strong>LH</strong></td><td>—</td></tr>
        <tr><td><strong>Secretora</strong></td><td><strong>Progesterona</strong> (cuerpo lúteo)</td><td>Vacuolas <strong>subnucleares</strong> (día 17) → secreción luminal → <strong>decidualización</strong> del estroma; glándulas tortuosas "en dientes de sierra"</td></tr>
        <tr><td><strong>Menstruación</strong></td><td>Caída de progesterona</td><td>Prostaglandina F2α → <strong>vasoespasmo de las arterias espirales</strong> → isquemia → metaloproteinasas → descamación de la capa funcional</td></tr>
      </tbody>
    </table></div>

    <div class="box acc"><span class="lbl">Cómo frena exactamente la progesterona — la respuesta completa</span>
      <p>No basta con decir "se opone al estrógeno". La progesterona:</p>
      <ul>
        <li><strong>Reduce la expresión de receptores de estrógeno</strong> en el endometrio.</li>
        <li>Induce la <strong>17β-hidroxiesteroide-deshidrogenasa tipo 2</strong>, que convierte el estradiol (potente) en <strong>estrona</strong> (débil).</li>
        <li>Induce <strong>sulfotransferasas</strong> que inactivan los estrógenos.</li>
        <li><strong>Detiene las mitosis</strong> y promueve la diferenciación secretora.</li>
      </ul>
      <p>Ésa es exactamente la base de por qué el tratamiento conservador de la hiperplasia y del cáncer de bajo grado es un <strong>progestágeno</strong>.</p>
    </div>

    <h4 class="sub">La aromatasa y la obesidad</h4>
    <p>El <strong>tejido adiposo contiene aromatasa</strong>, que convierte la androstenediona suprarrenal en <strong>estrona</strong>. En la posmenopáusica, en la que el ovario ya no produce estradiol, ésta es la <strong>principal fuente de estrógeno</strong> — y es un estrógeno <strong>sin oposición</strong>, porque no hay cuerpo lúteo. Además, la obesidad <strong>reduce la SHBG</strong>, aumentando la fracción libre.</p>
    <p>Por eso la obesidad es el <strong>factor de riesgo modificable dominante</strong>, y por eso la recomendación de pérdida de peso forma parte del tratamiento, no del consejo general.</p>`},

  {titulo:"Clasificación y factores de riesgo", kicker:"Fisiopatología", html:`
    <h3>Factores de riesgo — todos son la misma idea</h3>
    <p><strong>Estrógeno sin oposición:</strong> obesidad (riesgo relativo 2–5), <strong>anovulación crónica / síndrome de ovario poliquístico</strong>, <strong>nuliparidad</strong>, menarquia precoz y menopausia tardía (&gt;52 años), <strong>terapia hormonal con estrógeno sin progestágeno</strong>, <strong>tamoxifeno</strong> (agonista en endometrio, antagonista en mama), tumores de células de la granulosa, diabetes tipo 2, hipertensión, edad, hiperplasia con atipia previa, y <strong>síndrome de Lynch</strong>.</p>
    <p><strong>Protectores:</strong> anticonceptivos combinados, <strong>DIU con levonorgestrel</strong>, multiparidad, actividad física — y, curiosamente, el tabaquismo, por su efecto antiestrogénico (que obviamente no se recomienda).</p>

    <h3>Clasificación clásica de Bokhman</h3>
    <div class="tw"><table>
      <thead><tr><th>&nbsp;</th><th>Tipo I (80%)</th><th>Tipo II (10–20%)</th></tr></thead>
      <tbody>
        <tr><td><strong>Histología</strong></td><td>Endometrioide, grado 1–2</td><td><strong>Seroso</strong>, células claras, carcinosarcoma</td></tr>
        <tr><td><strong>Hormonodependencia</strong></td><td>Sí, estrógeno-dependiente</td><td><strong>No</strong></td></tr>
        <tr><td><strong>Endometrio de fondo</strong></td><td>Hiperplasia</td><td><strong>Atrofia</strong></td></tr>
        <tr><td><strong>Paciente</strong></td><td>Perimenopáusica, obesa</td><td>Mayor, delgada</td></tr>
        <tr><td><strong>Genética</strong></td><td>PTEN, PIK3CA, ARID1A, KRAS, CTNNB1, MSI</td><td><strong>TP53</strong>, HER2 (seroso)</td></tr>
        <tr><td><strong>Precursor</strong></td><td>Hiperplasia atípica / NIE</td><td>Carcinoma intraepitelial endometrial seroso</td></tr>
        <tr><td><strong>Diseminación</strong></td><td>Local, linfática</td><td><strong>Peritoneal, como el ovario</strong></td></tr>
        <tr><td><strong>Pronóstico</strong></td><td>Bueno</td><td>Malo</td></tr>
      </tbody>
    </table></div>

    <h3>Clasificación molecular (TCGA / ProMisE) — lo que se pregunta hoy</h3>
    <figure>
      <div class="svg-scroll">
      <svg viewBox="0 0 720 340" role="img" aria-label="Algoritmo ProMisE de clasificación molecular del carcinoma de endometrio y la conducta adyuvante que corresponde a cada uno de los cuatro grupos">
        <defs>
          <marker id="ar-e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
          </marker>
        </defs>

        <rect x="20" y="28" width="180" height="44" rx="7" class="fill-s2 st" stroke-width="1.5"/>
        <text x="110" y="47" class="t-lbl" text-anchor="middle">1 · Inmunohistoquímica</text>
        <text x="110" y="63" class="t-lbl" text-anchor="middle">de MMR</text>
        <path d="M110 72 L110 106" class="st" stroke-width="1.3" marker-end="url(#ar-e2)"/>
        <text x="120" y="94" class="t-sm">conservado</text>

        <rect x="20" y="108" width="180" height="44" rx="7" class="fill-s2 st" stroke-width="1.5"/>
        <text x="110" y="127" class="t-lbl" text-anchor="middle">2 · Secuenciación</text>
        <text x="110" y="143" class="t-lbl" text-anchor="middle">de POLE</text>
        <path d="M110 152 L110 186" class="st" stroke-width="1.3" marker-end="url(#ar-e2)"/>
        <text x="120" y="174" class="t-sm">nativo</text>

        <rect x="20" y="188" width="180" height="44" rx="7" class="fill-s2 st" stroke-width="1.5"/>
        <text x="110" y="207" class="t-lbl" text-anchor="middle">3 · Inmunohistoquímica</text>
        <text x="110" y="223" class="t-lbl" text-anchor="middle">de p53</text>

        <path d="M200 50 L254 50" class="st" stroke-width="1.4" marker-end="url(#ar-e2)"/>
        <path d="M200 130 L254 130" class="st" stroke-width="1.4" marker-end="url(#ar-e2)"/>
        <path d="M200 210 L254 210" class="st" stroke-width="1.4" marker-end="url(#ar-e2)"/>
        <path d="M212 232 L212 288 L254 288" class="st" stroke-width="1.4" fill="none" marker-end="url(#ar-e2)"/>

        <rect x="258" y="22" width="432" height="58" rx="7" class="fill-s st" stroke-width="1.6"/>
        <text x="274" y="44" class="t-hd">MMRd · hipermutado · 28%</text>
        <text x="274" y="64" class="t-sm">Pronóstico intermedio. Identifica Lynch. Inmunoterapia si es avanzado.</text>

        <rect x="258" y="102" width="432" height="58" rx="7" class="fill-s r-lo" stroke-width="2"/>
        <text x="274" y="124" class="t-hd r-lo-t">POLE ultramutado · 7%</text>
        <text x="274" y="144" class="t-sm">Excelente pronóstico. DESESCALAR: omitir adyuvancia en estadio I–II.</text>

        <rect x="258" y="182" width="432" height="58" rx="7" class="fill-s r-hi" stroke-width="2"/>
        <text x="274" y="204" class="t-hd r-hi-t">p53 anormal · 26%</text>
        <text x="274" y="224" class="t-sm">Peor pronóstico. ESCALAR: quimioterapia ± radioterapia aunque el estadio sea bajo.</text>

        <rect x="258" y="260" width="432" height="58" rx="7" class="fill-s st" stroke-width="1.6"/>
        <text x="274" y="282" class="t-hd">NSMP · sin perfil específico · 39%</text>
        <text x="274" y="302" class="t-sm">Pronóstico intermedio. Decidir por factores clásicos y receptores hormonales.</text>
      </svg>
      </div>
      <figcaption><b>El grupo molecular puede pesar más que el estadio.</b> Dos tumores con la misma FIGO y el mismo grado reciben tratamientos opuestos según el resultado: el <b>POLE ultramutado</b> se observa y el <b>p53 anormal</b> recibe quimioterapia. Cuando coexiste más de una alteración, el orden de prioridad es <b>POLE → p53 anormal → MMRd</b>. Este algoritmo ya está incorporado a la estadificación FIGO 2023.</figcaption>
    </figure>

    <p><strong>Cómo describir cada grupo si te pide detalle:</strong></p>
    <ul>
      <li><strong>POLE ultramutado:</strong> mutación en el dominio <strong>exonucleasa</strong> (corrector de pruebas) de la polimerasa ε. Carga mutacional altísima, respuesta inmune intensa, <strong>supervivencia excelente incluso con grado 3</strong>.</li>
      <li><strong>MMRd:</strong> pérdida de MLH1, PMS2, MSH2 o MSH6 en la inmunohistoquímica. Puede ser esporádico (metilación de MLH1) o <strong>Lynch</strong>.</li>
      <li><strong>NSMP:</strong> el grupo por descarte. Suele ser endometrioide de bajo grado con receptores hormonales positivos; <strong>CTNNB1</strong> mutado identifica un subgrupo de peor comportamiento.</li>
      <li><strong>p53 anormal:</strong> incluye casi todos los serosos y muchos endometrioides de grado 3. Es el grupo que concentra las recaídas y las muertes.</li>
    </ul>`},

  {titulo:"Hiperplasia endometrial", kicker:"Precursor", html:`
    <h3>Clasificación OMS 2014 — sólo dos categorías</h3>
    <div class="tw"><table>
      <thead><tr><th>&nbsp;</th><th>Riesgo de progresión</th><th>Tratamiento</th></tr></thead>
      <tbody>
        <tr><td><strong>Hiperplasia sin atipia</strong></td><td class="num">1–3%</td><td><strong>Progestágenos</strong> — el <strong>DIU con levonorgestrel</strong> es de elección (mayor tasa de regresión y menos efectos sistémicos); alternativas orales: medroxiprogesterona o megestrol. Biopsia de control a los <strong>6 meses</strong>.</td></tr>
        <tr><td><strong>Hiperplasia atípica / neoplasia intraepitelial endometrial (NIE)</strong></td><td class="num">~30%</td><td><strong>Histerectomía total</strong> con salpingooforectomía bilateral (conservar ovarios es razonable en premenopáusicas). <strong>Sin morcelación.</strong></td></tr>
      </tbody>
    </table></div>

    <div class="box warn"><span class="lbl">El dato que decide la conducta</span>
      <p>En la hiperplasia atípica, <strong>hasta un 40% de las pacientes ya tienen un carcinoma concurrente</strong> en la pieza de histerectomía. Por eso no basta con "vigilar": el tratamiento estándar es quirúrgico, y por eso <strong>no se hace ablación endometrial</strong> (destruiría el tejido sin diagnóstico) ni morcelación (dispersaría el tumor).</p>
    </div>

    <p><strong>Si desea conservar la fertilidad</strong> en hiperplasia atípica: DIU con levonorgestrel (preferido) o progestágeno oral en dosis alta, con <strong>biopsia endometrial cada 3–6 meses</strong>. Se busca embarazo cuanto antes, con apoyo de reproducción asistida, y se hace <strong>histerectomía al completar la paridad</strong>.</p>`},

  {titulo:"Clínica, diagnóstico y FIGO", kicker:"Diagnóstico", html:`
    <h3>El síntoma</h3>
    <p><strong>Sangrado uterino anormal.</strong> El <strong>90%</strong> debutan con sangrado posmenopáusico. Como es un síntoma precoz y alarmante, el <strong>75% se diagnostican en estadio I</strong>.</p>
    <p>Sólo un <strong>9–10%</strong> de los sangrados posmenopáusicos resultan ser cáncer — la causa más frecuente es la <strong>atrofia</strong> — pero <strong>todos se estudian</strong>.</p>

    <h4 class="sub">Secuencia diagnóstica</h4>
    <ol>
      <li><strong>Ecografía transvaginal.</strong> En posmenopáusica con sangrado, un grosor endometrial <strong>≤4 mm</strong> tiene un valor predictivo negativo cercano al <strong>99%</strong>.</li>
      <li><strong>Biopsia endometrial ambulatoria</strong> (cánula de Pipelle) si el endometrio es &gt;4 mm o el sangrado persiste. Sensibilidad del 90–98% en posmenopáusicas.</li>
      <li><strong>Histeroscopia con biopsia dirigida y legrado fraccionado</strong> si la biopsia es insuficiente, negativa con sangrado persistente, o hay sospecha de lesión focal.</li>
    </ol>

    <div class="box warn"><span class="lbl">Tres límites del corte de 4 mm</span>
      <ul>
        <li><strong>Sólo vale en posmenopáusicas CON sangrado.</strong> En una posmenopáusica asintomática con endometrio engrosado hallado por casualidad, el umbral no aplica y se individualiza.</li>
        <li><strong>No vale en premenopáusicas</strong>, cuyo endometrio varía a lo largo del ciclo.</li>
        <li><strong>No vale con tamoxifeno</strong>: produce cambios quísticos subendometriales que engrosan la imagen sin ser patología. En estas pacientes se va directo a <strong>histeroscopia</strong>.</li>
      </ul>
      <p>Y la regla de oro: <strong>una biopsia negativa con sangrado persistente no cierra el caso</strong>. La Pipelle toma muestra ciega y se pierde lesiones focales — hay que hacer histeroscopia.</p>
    </div>

    <h4 class="sub">Estudio de extensión</h4>
    <p><strong>RM de pelvis</strong> (invasión miometrial y afectación cervical), <strong>TC de tórax, abdomen y pelvis</strong>, y <strong>CA-125</strong> útil en histologías serosas o enfermedad avanzada. Inmunohistoquímica de <strong>MMR en todas</strong> las pacientes, más <strong>p53</strong>, receptores hormonales y <strong>POLE</strong> si está disponible.</p>

    <h3>FIGO 2023 — estadificación quirúrgica</h3>
    <div class="tw"><table>
      <thead><tr><th>Estadio</th><th>Definición</th></tr></thead>
      <tbody>
        <tr><td><strong>IA</strong></td><td>IA1 limitado a pólipo o sin invasión · IA2 invasión miometrial &lt;50% · IA3 endometrioide de bajo grado con afectación simultánea de ovario y trompa de buen pronóstico</td></tr>
        <tr><td><strong>IB</strong></td><td>Invasión miometrial ≥50%, endometrioide de bajo grado</td></tr>
        <tr><td><strong>IC</strong></td><td>Histología agresiva limitada a un pólipo o al endometrio, sin invasión</td></tr>
        <tr><td><strong>IIA</strong></td><td>Invasión del <strong>estroma cervical</strong></td></tr>
        <tr><td><strong>IIB</strong></td><td><strong>Invasión linfovascular sustancial</strong></td></tr>
        <tr><td><strong>IIC</strong></td><td>Histología agresiva con cualquier invasión miometrial</td></tr>
        <tr><td><strong>IIIA</strong></td><td>Anexos o serosa uterina</td></tr>
        <tr><td><strong>IIIB</strong></td><td>Vagina o parametrio</td></tr>
        <tr><td><strong>IIIC</strong></td><td>Ganglios: <strong>C1 pélvicos · C2 paraaórticos</strong> (se distingue micrometástasis)</td></tr>
        <tr><td><strong>IVA / IVB / IVC</strong></td><td>Mucosa de vejiga o recto · peritoneo abdominal · metástasis a distancia</td></tr>
      </tbody>
    </table></div>

    <div class="box acc"><span class="lbl">Las dos novedades de FIGO 2023 que te pueden preguntar</span>
      <ul>
        <li><strong>La clasificación molecular modifica el estadio</strong> en enfermedad limitada al útero (estadios I–II): un <strong>POLE mutado</strong> se reclasifica como <span class="k">IAmPOLEmut</span> (con desescalada del tratamiento), y un <strong>p53 anormal</strong> con cualquier invasión miometrial sube a <span class="k">IICmp53abn</span>.</li>
        <li><strong>La invasión linfovascular sustancial ya estadifica</strong> por sí sola (IIB), reconociéndola como factor pronóstico independiente.</li>
      </ul>
      <p>Y un recordatorio: <strong>la citología peritoneal positiva NO modifica el estadio</strong> desde FIGO 2009. Se sigue tomando porque tiene valor pronóstico, pero no sube a la paciente de estadio.</p>
    </div>`},

  {titulo:"Tratamiento quirúrgico", kicker:"Tratamiento", html:`
    <h3>La operación estándar</h3>
    <div class="box tx"><span class="lbl">Enfermedad aparentemente confinada al útero</span>
      <p><strong>Histerectomía total extrafascial + salpingooforectomía bilateral + estadificación ganglionar</strong>, por <strong>vía mínimamente invasiva</strong>, <strong>sin morcelación</strong>, con extracción de la pieza en bolsa.</p>
    </div>
    <p><strong>No es una histerectomía radical.</strong> En el cáncer de endometrio basta la histerectomía simple, incluso en estadio II con invasión del estroma cervical: la histerectomía radical no ha mostrado ventaja de supervivencia y añade morbilidad urinaria. Esto contrasta con el cáncer de cérvix.</p>

    <div class="box acc"><span class="lbl">Contraste clásico de examen — endometrio contra cérvix</span>
      <p>En <strong>endometrio</strong>, la <strong>vía mínimamente invasiva es preferida</strong>: los ensayos <strong>LAP2</strong> y <strong>LACE</strong> demostraron equivalencia oncológica con menos morbilidad, menos estancia y mejor calidad de vida.</p>
      <p>En <strong>cáncer de cérvix</strong> estadio IB1 o superior ocurre lo contrario: tras el ensayo <strong>LACC</strong>, la vía mínimamente invasiva se <strong>abandonó</strong> por peor supervivencia, y la histerectomía radical se hace <strong>abierta</strong>.</p>
      <p>Si mezclas estos dos, es de los errores que más se notan.</p>
    </div>

    <h4 class="sub">Ovarios</h4>
    <p>Se pueden <strong>conservar</strong> en premenopáusicas <strong>menores de 45 años</strong> con endometrioide <strong>grado 1</strong>, estadio I, sin invasión miometrial profunda, sin factores de riesgo y <strong>sin síndrome de Lynch ni mutación BRCA</strong>. La <strong>salpinguectomía siempre se hace</strong>, aunque se conserven los ovarios.</p>

    <h3>Estadificación ganglionar — ganglio centinela</h3>
    <ul>
      <li><strong>Inyección cervical</strong> (a las 3 y a las 9 horas, superficial y profunda) con <strong>verde de indocianina</strong>. La inyección es <strong>cervical, no fúndica</strong> — es más reproducible y da mejores tasas de mapeo.</li>
      <li>Ensayo <strong>FIRES</strong>: sensibilidad del <strong>97%</strong> y valor predictivo negativo del <strong>99.6%</strong>.</li>
      <li>Requiere <strong>ultraestadificación patológica</strong> (cortes seriados e inmunohistoquímica) para detectar micrometástasis y células tumorales aisladas.</li>
      <li><strong>Si no mapea de un lado, hay que hacer linfadenectomía de esa hemipelvis.</strong> Ésta es la regla que más se olvida.</li>
    </ul>
    <p><strong>La linfadenectomía pélvica y paraaórtica sistemática ya no se hace de rutina:</strong> el ensayo <strong>ASTEC</strong> y el estudio italiano no mostraron beneficio en supervivencia, y sí más <strong>linfedema</strong> y morbilidad. Se reserva para histologías agresivas o enfermedad avanzada.</p>

    <h3>Preservación de la fertilidad</h3>
    <div class="box tx"><span class="lbl">Criterios — todos deben cumplirse</span>
      <ul>
        <li>Endometrioide <strong>grado 1</strong>.</li>
        <li><strong>Estadio IA sin invasión miometrial</strong>, confirmado por <strong>RM</strong>.</li>
        <li>Sin invasión linfovascular ni enfermedad extrauterina.</li>
        <li>Deseo genésico activo y paciente informada de que es un tratamiento no estándar.</li>
      </ul>
      <p><strong>Tratamiento:</strong> <strong>DIU con levonorgestrel</strong> ± progestágeno oral en dosis alta (megestrol o medroxiprogesterona). <strong>Reevaluación histológica cada 3–6 meses.</strong> Si no hay respuesta a los 6–12 meses, cirugía.</p>
      <p><strong>Buscar el embarazo cuanto antes</strong> con apoyo de reproducción asistida, y <strong>histerectomía al completar la paridad</strong>. Hay que evaluar los ovarios: entre el 5 y el 29% de las mujeres jóvenes tienen un <strong>tumor ovárico sincrónico</strong>.</p>
    </div>`},

  {titulo:"Adyuvancia y enfermedad avanzada", kicker:"Tratamiento", html:`
    <h3>Adyuvancia por grupo de riesgo</h3>
    <div class="tw"><table>
      <thead><tr><th>Riesgo</th><th>Definición</th><th>Conducta</th></tr></thead>
      <tbody>
        <tr><td><strong>Bajo</strong></td><td>IA endometrioide grado 1–2 sin invasión linfovascular · <strong>POLEmut estadio I–II</strong></td><td><strong>Observación</strong></td></tr>
        <tr><td><strong>Intermedio</strong></td><td>IA grado 3 sin ILV · IB grado 1–2 sin ILV</td><td><strong>Braquiterapia vaginal</strong></td></tr>
        <tr><td><strong>Intermedio-alto</strong></td><td>IB grado 3 · invasión linfovascular sustancial · estadio II</td><td>Braquiterapia o <strong>radioterapia pélvica externa</strong>; añadir quimioterapia si hay ILV sustancial o p53 anormal</td></tr>
        <tr><td><strong>Alto</strong></td><td>Estadio III · histología no endometrioide (seroso, células claras, carcinosarcoma) · <strong>p53 anormal</strong> con invasión</td><td><strong>Quimioterapia ± radioterapia</strong></td></tr>
      </tbody>
    </table></div>

    <h4 class="sub">Los ensayos que hay que poder citar</h4>
    <div class="tw"><table>
      <thead><tr><th>Ensayo</th><th>Qué demostró</th></tr></thead>
      <tbody>
        <tr><td><strong>PORTEC-1</strong> y <strong>GOG-99</strong></td><td>La radioterapia pélvica <strong>reduce la recurrencia locorregional pero NO mejora la supervivencia global</strong>. Dato clásico de examen.</td></tr>
        <tr><td><strong>PORTEC-2</strong></td><td>La <strong>braquiterapia vaginal es equivalente</strong> a la radioterapia pélvica para el control vaginal, con <strong>mucha menos toxicidad</strong>. Por eso es el estándar en riesgo intermedio.</td></tr>
        <tr><td><strong>PORTEC-3</strong></td><td>La <strong>quimiorradioterapia mejora la supervivencia global</strong> frente a radioterapia sola en estadio III y en serosos. El beneficio se concentró en el grupo <strong>p53 anormal</strong>; los <strong>POLEmut</strong> tuvieron excelente evolución en ambos brazos.</td></tr>
        <tr><td><strong>GOG-258</strong></td><td>La quimiorradioterapia <strong>no superó a la quimioterapia sola</strong> en supervivencia libre de recurrencia, aunque redujo las recaídas locales y ganglionares.</td></tr>
        <tr><td><strong>GOG-209</strong></td><td><strong>Carboplatino + paclitaxel</strong> es no inferior al esquema TAP y mucho menos tóxico → es el estándar en enfermedad avanzada.</td></tr>
      </tbody>
    </table></div>

    <div class="box acc"><span class="lbl">Cómo lo integra la molecular</span>
      <ul>
        <li><strong>POLEmut → desescalar.</strong> Se puede <strong>omitir la adyuvancia</strong> en estadio I–II, incluso con grado 3.</li>
        <li><strong>MMRd →</strong> tratamiento estándar según estadio; abre la puerta a la <strong>inmunoterapia</strong> si es avanzado, y obliga a estudiar <strong>Lynch</strong>.</li>
        <li><strong>NSMP →</strong> decidir por los factores clásicos; los receptores hormonales positivos permiten hormonoterapia.</li>
        <li><strong>p53 anormal → escalar.</strong> <strong>Quimioterapia</strong> ± radioterapia incluso en estadio I con invasión miometrial.</li>
      </ul>
    </div>

    <h3>Enfermedad avanzada o recurrente — lo más nuevo</h3>
    <ul>
      <li><strong>Base:</strong> <strong>carboplatino + paclitaxel</strong>.</li>
      <li><strong>dMMR / MSI-H:</strong> <strong>quimioterapia + inmunoterapia en primera línea</strong>. El ensayo <strong>RUBY</strong> (dostarlimab + carbo-taxol seguido de dostarlimab de mantenimiento) mostró una reducción muy marcada del riesgo de progresión en dMMR y beneficio en supervivencia global; <strong>NRG-GY018</strong> mostró lo mismo con pembrolizumab. <strong>Es el cambio de práctica más importante de los últimos años en este tumor.</strong></li>
      <li><strong>pMMR / MSS, tras platino:</strong> <strong>lenvatinib + pembrolizumab</strong> (ensayo <strong>KEYNOTE-775</strong>), que mejoró supervivencia frente a quimioterapia. Toxicidad del lenvatinib: <strong>hipertensión</strong>, diarrea, hipotiroidismo, proteinuria, fatiga y anorexia — requiere manejo activo de dosis.</li>
      <li><strong>Endometrioide de bajo grado con receptores hormonales positivos</strong> y enfermedad indolente: <strong>hormonoterapia</strong> — progestágenos (megestrol, medroxiprogesterona), inhibidores de aromatasa, o combinaciones como <strong>letrozol + everolimus</strong> o letrozol + abemaciclib.</li>
      <li><strong>Seroso HER2 positivo:</strong> añadir <strong>trastuzumab</strong> a carboplatino-paclitaxel mejora la supervivencia libre de progresión.</li>
      <li><strong>Recurrencia vaginal aislada en paciente que no recibió radioterapia previa:</strong> <strong>radioterapia de rescate con intención curativa</strong>, con control en torno al 70%. La exenteración pélvica se reserva a la recurrencia central tras radioterapia.</li>
    </ul>

    <h3>Seguimiento</h3>
    <ul>
      <li>Exploración con especuloscopia y tacto <strong>cada 3–6 meses durante 2–3 años</strong>, luego cada 6–12 meses hasta los 5 años.</li>
      <li><strong>La citología vaginal de rutina no aporta valor</strong> — la mayoría de las recurrencias vaginales son visibles o sintomáticas.</li>
      <li>Imagen y CA-125 según síntomas e histología, no de forma protocolizada en bajo riesgo.</li>
      <li><strong>Consejo de pérdida de peso y actividad física</strong> — reduce la recurrencia y la mortalidad por otras causas, que en esta población es alta.</li>
      <li><strong>Cribado de Lynch en todas</strong>, con las implicaciones familiares correspondientes.</li>
    </ul>`},

  {titulo:"Perlas y trampas", kicker:"Trampas", html:`
    <div class="box warn"><span class="lbl">Errores que se notan mucho</span>
      <ul>
        <li><strong>Hacer histerectomía radical en cáncer de endometrio.</strong> No es el estándar; la simple basta, incluso en estadio II.</li>
        <li><strong>Confundir la vía de abordaje con la del cáncer de cérvix.</strong> En endometrio la mínimamente invasiva es preferida (LAP2, LACE); en cérvix se abandonó (LACC).</li>
        <li><strong>Inyectar el trazador del ganglio centinela en el fondo.</strong> La inyección es <strong>cervical</strong>.</li>
        <li><strong>Decir que la citología peritoneal positiva sube de estadio.</strong> Ya no lo hace desde 2009.</li>
        <li><strong>Aplicar el corte de 4 mm a una premenopáusica o a una paciente con tamoxifeno.</strong></li>
        <li><strong>Cerrar el caso con una biopsia negativa</strong> en una paciente que sigue sangrando.</li>
        <li><strong>Tratar el carcinosarcoma como un sarcoma.</strong> Es un <strong>carcinoma metaplásico</strong> de alto grado y se trata como carcinoma: cirugía + carboplatino-paclitaxel.</li>
        <li><strong>Hacer ablación endometrial o morcelación</strong> ante una hiperplasia atípica.</li>
      </ul>
    </div>

    <h3>Perlas de alto rendimiento</h3>
    <ul>
      <li>El sangrado posmenopáusico es cáncer <strong>hasta demostrar lo contrario</strong>, pero su causa <strong>más frecuente es la atrofia</strong>. Ambas frases son verdaderas y hay que decir las dos.</li>
      <li>En el <strong>síndrome de Lynch</strong>, el cáncer de endometrio es el <strong>tumor centinela en aproximadamente la mitad</strong> de las mujeres: aparece <em>antes</em> que el de colon. En portadoras de <strong>MSH6</strong> es el cáncer más frecuente, por delante del colorrectal.</li>
      <li>El <strong>tamoxifeno</strong> es antagonista en mama y <strong>agonista en endometrio</strong> — de ahí el riesgo. Los <strong>inhibidores de aromatasa</strong> no lo tienen.</li>
      <li>La <strong>obesidad</strong> es el factor de riesgo modificable dominante, por la <strong>aromatasa del tejido adiposo</strong> y por la reducción de SHBG.</li>
      <li>Las metástasis <strong>inguinales</strong> se explican por el <strong>ligamento redondo</strong>; las <strong>paraaórticas aisladas</strong>, por los <strong>vasos ováricos</strong>.</li>
      <li>Un <strong>POLE mutado grado 3</strong> tiene mejor pronóstico que un <strong>p53 anormal grado 1</strong>. La biología pesa más que el grado.</li>
    </ul>`}
  ],
  preguntas:[
  {dom:"anat",niv:1,q:"¿Qué relación tiene el uréter con la arteria uterina y por qué importa?",
   a:`<p>El <strong>uréter pasa POR DEBAJO de la arteria uterina</strong>, a unos <strong>1.5–2 cm laterales al cuello uterino</strong>.</p>
      <p><strong>Regla:</strong> "el agua pasa por debajo del puente".</p>
      <p><strong>Importa porque</strong> es <strong>el punto donde más se lesiona el uréter</strong> en cirugía ginecológica, justo al ligar la arteria uterina.</p>`,
   re:{q:"¿En qué otros dos puntos se lesiona el uréter?",a:`<strong>(1)</strong> Al ligar el <strong>ligamento infundibulopélvico</strong>: el uréter cruza los vasos ilíacos en el estrecho pélvico, justo por debajo. <strong>(2)</strong> Al cerrar la <strong>cúpula vaginal</strong>, donde el uréter entra en el túnel del ligamento cardinal camino del trígono. Con el cruce con la uterina, son los tres puntos clásicos.`}},

  {dom:"anat",niv:2,q:"¿De dónde nace la arteria uterina y con quién se anastomosa?",
   a:`<p>Es rama de la <strong>división anterior de la arteria ilíaca interna (hipogástrica)</strong>. Llega por la base del ligamento ancho.</p>
      <p>Se anastomosa arriba con la <strong>arteria ovárica</strong>, que es rama <strong>directa de la aorta</strong> a nivel de L2 y viaja en el <strong>ligamento infundibulopélvico</strong>.</p>`,
   re:{q:"¿Qué consecuencia clínica tiene esa doble irrigación?",a:`Que el útero es muy resistente a la isquemia, lo que hace posible la <strong>embolización de arterias uterinas</strong> para miomas o hemorragia posparto sin necrosis uterina. También explica que la ligadura de hipogástricas controle la hemorragia obstétrica sin devascularizar el útero.`}},

  {dom:"anat",niv:3,q:"¿Hacia dónde drena linfáticamente el útero?",
   a:`<p>En <strong>cuatro direcciones</strong>:</p>
      <ul><li><strong>Fondo</strong> → <strong>paraaórticos</strong>, siguiendo los vasos ováricos por el <strong>ligamento infundibulopélvico</strong>.</li>
      <li><strong>Cuerpo</strong> → <strong>ilíacos externos y obturadores</strong>, por el parametrio y el ligamento ancho.</li>
      <li><strong>Cuello y segmento inferior</strong> → <strong>ilíacos internos, parametriales y presacros</strong>.</li>
      <li><strong>A lo largo del ligamento redondo</strong> → <strong>inguinales superficiales</strong>.</li></ul>`,
   re:{q:"¿Por qué puede haber metástasis paraaórticas sin afectación pélvica?",a:`Porque el drenaje del <strong>fondo uterino</strong> puede ir <strong>directo a los paraaórticos</strong> por los vasos ováricos, <strong>saltándose la cadena pélvica</strong>. Por eso en tumores fúndicos, de alto grado o con invasión profunda, la estadificación ganglionar debe contemplar el territorio paraaórtico y no sólo el pélvico.`}},

  {dom:"anat",niv:2,q:"¿Qué contiene el ligamento cardinal y el infundibulopélvico?",
   a:`<p><strong>Cardinal (de Mackenrodt):</strong> <strong>arteria uterina</strong> y el <strong>uréter</strong>. Es el <strong>soporte principal</strong> del útero y el que se secciona en la histerectomía radical.</p>
      <p><strong>Infundibulopélvico (suspensorio del ovario):</strong> <strong>vasos ováricos</strong> y linfáticos hacia los paraaórticos. El uréter corre justo por debajo.</p>`,
   re:{q:"¿Y el ligamento redondo?",a:`Va del cuerno uterino al labio mayor atravesando el <strong>conducto inguinal</strong>. Contiene la <strong>arteria de Sampson</strong>. Su importancia oncológica es que explica el <strong>drenaje linfático a los ganglios inguinales superficiales</strong> — una vía que de otro modo parecería inexplicable en un tumor pélvico. No es un soporte real del útero.`}},

  {dom:"fisio",niv:1,q:"Describe las fases del ciclo endometrial.",
   a:`<ul><li><strong>Proliferativa</strong> — <strong>estradiol</strong>: glándulas rectas y estrechas, mitosis abundantes, crecimiento de las arterias espirales.</li>
      <li><strong>Ovulación</strong> — pico de <strong>LH</strong>.</li>
      <li><strong>Secretora</strong> — <strong>progesterona</strong> del cuerpo lúteo: vacuolas <strong>subnucleares</strong>, luego secreción luminal, glándulas tortuosas "en dientes de sierra" y <strong>decidualización</strong> del estroma.</li>
      <li><strong>Menstruación</strong> — al caer la progesterona: prostaglandina F2α → <strong>vasoespasmo de las arterias espirales</strong> → isquemia → descamación de la capa funcional.</li></ul>`,
   re:{q:"¿Por qué se descama sólo la capa funcional?",a:`Porque las dos capas tienen irrigación distinta. La <strong>funcional</strong> depende de las <strong>arterias espirales</strong>, que son <strong>sensibles a hormonas</strong> y sufren el vasoespasmo. La <strong>basal</strong> la irrigan las <strong>arterias basales rectas</strong>, que no responden a las hormonas — por eso sobrevive y regenera el endometrio en cada ciclo.`}},

  {dom:"fisio",niv:2,q:"¿Cómo protege exactamente la progesterona al endometrio?",
   a:`<p>No sólo "se opone al estrógeno". Hace cuatro cosas concretas:</p>
      <ul><li><strong>Reduce la expresión de receptores de estrógeno.</strong></li>
      <li>Induce la <strong>17β-hidroxiesteroide-deshidrogenasa tipo 2</strong>, que convierte estradiol (potente) en <strong>estrona</strong> (débil).</li>
      <li>Induce <strong>sulfotransferasas</strong> que inactivan los estrógenos.</li>
      <li><strong>Detiene las mitosis</strong> y promueve la diferenciación secretora.</li></ul>`,
   re:{q:"¿Y de ahí qué tratamiento se deduce?",a:`El <strong>tratamiento conservador con progestágenos</strong>: el <strong>DIU con levonorgestrel</strong> —de elección por su alta concentración local y baja exposición sistémica— o progestágenos orales en dosis alta. Es la base del tratamiento de la <strong>hiperplasia</strong> y de la <strong>preservación de fertilidad</strong> en el carcinoma endometrioide grado 1 estadio IA.`}},

  {dom:"fisio",niv:2,q:"¿Por qué la obesidad es el factor de riesgo modificable más importante?",
   a:`<p>Por <strong>dos mecanismos que suman</strong>:</p>
      <ul><li>El <strong>tejido adiposo contiene aromatasa</strong>, que convierte androstenediona suprarrenal en <strong>estrona</strong>. En la posmenopáusica, en la que el ovario ya no produce estradiol, ésta es la principal fuente de estrógeno — y es <strong>estrógeno sin oposición</strong>, porque no hay cuerpo lúteo que produzca progesterona.</li>
      <li>La obesidad <strong>reduce la SHBG</strong>, lo que aumenta la <strong>fracción libre</strong> y biológicamente activa.</li></ul>`,
   re:{q:"¿Y en una mujer premenopáusica obesa, cuál es el mecanismo?",a:`Ahí el mecanismo dominante es la <strong>anovulación crónica</strong>, típicamente en el contexto de un <strong>síndrome de ovario poliquístico</strong>. Sin ovulación no hay cuerpo lúteo, y sin cuerpo lúteo no hay progesterona: el endometrio queda expuesto a estrógeno continuo <strong>sin oposición cíclica</strong>. Es el mismo principio, por otra vía.`}},

  {dom:"fisiopat",niv:1,q:"Diferencia el tipo I del tipo II de cáncer de endometrio.",
   a:`<p><strong>Tipo I (80%):</strong> endometrioide grado 1–2, <strong>estrógeno-dependiente</strong>, sobre endometrio <strong>hiperplásico</strong>, en mujer perimenopáusica y obesa. Genética: <strong>PTEN</strong>, PIK3CA, ARID1A, KRAS, CTNNB1, MSI. <strong>Buen pronóstico.</strong></p>
      <p><strong>Tipo II (10–20%):</strong> <strong>seroso</strong>, células claras, carcinosarcoma. <strong>No hormonodependiente</strong>, sobre endometrio <strong>atrófico</strong>, en mujer mayor y delgada. Genética: <strong>TP53</strong>, HER2. Disemina por <strong>vía peritoneal, como el ovario</strong>. <strong>Mal pronóstico.</strong></p>`,
   re:{q:"¿Esa clasificación sigue vigente?",a:`Sigue siendo útil como marco conceptual, pero <strong>ha quedado subordinada a la clasificación molecular</strong> (TCGA/ProMisE), que separa mejor el pronóstico y decide el tratamiento. Un endometrioide grado 3 "tipo I" puede ser p53 anormal y comportarse como un tipo II, y un seroso puede ser POLE mutado con excelente evolución. <strong>La molecular gana a la histológica.</strong>`}},

  {dom:"fisiopat",niv:3,q:"¿Cuáles son los cuatro grupos moleculares del cáncer de endometrio?",
   a:`<ol><li><strong>POLE ultramutado (7%)</strong> — mutación en el dominio <strong>exonucleasa</strong> de la polimerasa ε. <strong>Excelente pronóstico</strong> incluso con grado alto.</li>
      <li><strong>MMRd / hipermutado (28%)</strong> — pérdida de MLH1, PMS2, MSH2 o MSH6. Pronóstico intermedio. Identifica <strong>Lynch</strong> y predice respuesta a <strong>inmunoterapia</strong>.</li>
      <li><strong>NSMP, sin perfil molecular específico (39%)</strong> — grupo por descarte; pronóstico intermedio-bueno.</li>
      <li><strong>p53 anormal / copy-number high (26%)</strong> — serosos y muchos grado 3. <strong>Peor pronóstico.</strong></li></ol>
      <p>El algoritmo práctico (<strong>ProMisE</strong>) es: <strong>inmunohistoquímica de MMR → secuenciación de POLE → inmunohistoquímica de p53</strong>.</p>`,
   re:{q:"¿Y cómo cambia el tratamiento cada grupo?",a:`<strong>POLEmut → desescalar</strong> (se puede omitir la adyuvancia en estadio I–II, incluso con grado 3). <strong>p53 anormal → escalar</strong> a quimioterapia ± radioterapia aunque el estadio sea bajo. <strong>MMRd →</strong> estándar por estadio, con inmunoterapia si es avanzado. <strong>NSMP →</strong> por factores clásicos y receptores hormonales. Si coexiste más de una alteración, el orden de prioridad es <strong>POLE → p53 → MMRd</strong>.`}},

  {dom:"fisiopat",niv:2,q:"Hiperplasia endometrial: clasificación actual y riesgo de progresión.",
   a:`<p><strong>OMS 2014 — sólo dos categorías:</strong></p>
      <ul><li><strong>Hiperplasia sin atipia</strong> — progresión del <strong>1–3%</strong>.</li>
      <li><strong>Hiperplasia atípica / neoplasia intraepitelial endometrial (NIE)</strong> — progresión de aproximadamente el <strong>30%</strong>.</li></ul>
      <p>Y el dato que decide la conducta: en la hiperplasia atípica, <strong>hasta un 40% ya tienen un carcinoma concurrente</strong> en la pieza de histerectomía.</p>`,
   re:{q:"¿Cómo tratas cada una?",a:`<strong>Sin atipia:</strong> <strong>progestágenos</strong> — el <strong>DIU con levonorgestrel</strong> es de elección — con biopsia de control a los 6 meses. <strong>Con atipia:</strong> <strong>histerectomía total con salpingooforectomía bilateral</strong>, sin morcelación. Si desea fertilidad: DIU-levonorgestrel o progestágeno oral en dosis alta con biopsia cada 3–6 meses, e histerectomía al completar la paridad. <strong>Nunca ablación endometrial</strong>: destruye el tejido sin diagnóstico.`}},

  {dom:"fisiopat",niv:2,q:"¿Qué relación tiene el síndrome de Lynch con el cáncer de endometrio?",
   a:`<p>Riesgo de por vida del <strong>40–60%</strong> — comparable al de colon.</p>
      <p>Y el dato de alto rendimiento: <strong>en aproximadamente la mitad de las mujeres con Lynch, el cáncer de endometrio es el tumor centinela</strong>, es decir, aparece <em>antes</em> que el colorrectal. En portadoras de <strong>MSH6</strong> es el cáncer más frecuente del síndrome.</p>
      <p>Por eso se hace <strong>estudio de MMR en toda pieza de cáncer de endometrio</strong>.</p>`,
   re:{q:"¿Qué le ofreces a una portadora de Lynch sin cáncer?",a:`<strong>Histerectomía con salpingooforectomía bilateral profiláctica</strong> al completar la paridad, o hacia los 40–45 años. Mientras tanto: vigilancia con biopsia endometrial y ecografía transvaginal anual desde los 30–35 años (de valor limitado, pero razonable), y educación sobre el <strong>sangrado uterino anormal como signo de alarma</strong>, que es la herramienta más eficaz.`}},

  {dom:"dx",niv:1,q:"Mujer de 62 años con sangrado posmenopáusico. ¿Cómo la estudias?",
   a:`<ol><li><strong>Ecografía transvaginal.</strong> Endometrio <strong>≤4 mm</strong> tiene un valor predictivo negativo cercano al <strong>99%</strong>.</li>
      <li><strong>Biopsia endometrial ambulatoria</strong> (Pipelle) si es &gt;4 mm o el sangrado persiste.</li>
      <li><strong>Histeroscopia con biopsia dirigida y legrado fraccionado</strong> si la muestra es insuficiente, es negativa con sangrado persistente, o hay sospecha de lesión focal.</li></ol>
      <p>Sólo un <strong>9–10%</strong> de los sangrados posmenopáusicos son cáncer — la causa más frecuente es la <strong>atrofia</strong> — pero <strong>todos se estudian</strong>.</p>`,
   re:{q:"La biopsia sale negativa y sigue sangrando. ¿Qué haces?",a:`<strong>Histeroscopia con biopsia dirigida.</strong> Una biopsia negativa <strong>no cierra el caso</strong>: la Pipelle toma muestra a ciegas y puede pasar por alto <strong>lesiones focales</strong> —pólipos, focos aislados de carcinoma— sobre todo si el endometrio es irregular. El sangrado persistente manda sobre la biopsia negativa.`}},

  {dom:"dx",niv:2,q:"¿Cuándo NO sirve el corte de 4 mm de grosor endometrial?",
   a:`<ul><li><strong>En premenopáusicas</strong>: el endometrio varía fisiológicamente a lo largo del ciclo.</li>
      <li><strong>En posmenopáusicas asintomáticas</strong> con engrosamiento hallado por casualidad: el umbral se validó en pacientes <em>con sangrado</em>; en ausencia de síntomas se individualiza.</li>
      <li><strong>En pacientes con tamoxifeno</strong>: produce cambios quísticos subendometriales que engrosan la imagen sin ser patología. Aquí se va <strong>directo a histeroscopia</strong>.</li></ul>`,
   re:{q:"¿Por qué el tamoxifeno aumenta el riesgo si es un antiestrógeno?",a:`Porque es un <strong>modulador selectivo</strong>: <strong>antagonista en la mama</strong> pero <strong>agonista en el endometrio</strong>, donde estimula la proliferación. Por eso se asocia a pólipos, hiperplasia y carcinoma —incluidos serosos—. Los <strong>inhibidores de aromatasa</strong>, en cambio, no tienen ese efecto, porque bloquean la síntesis de estrógeno en vez de modular el receptor.`}},

  {dom:"dx",niv:3,q:"¿Qué introdujo de nuevo la estadificación FIGO 2023?",
   a:`<ul><li><strong>La clasificación molecular modifica el estadio</strong> en enfermedad limitada al útero: <strong>POLE mutado</strong> se reclasifica como <span class="k">IAmPOLEmut</span> (desescalada), y <strong>p53 anormal</strong> con cualquier invasión miometrial sube a <span class="k">IICmp53abn</span>.</li>
      <li><strong>La invasión linfovascular sustancial estadifica por sí sola</strong> (IIB).</li>
      <li>Se incorpora la <strong>histología agresiva</strong> como criterio (IC y IIC).</li>
      <li>Se distinguen <strong>micrometástasis</strong> en los ganglios (IIIC).</li></ul>`,
   re:{q:"¿La citología peritoneal positiva sube el estadio?",a:`<strong>No</strong>, y no lo hace desde <strong>FIGO 2009</strong>. Se sigue tomando porque conserva <strong>valor pronóstico</strong> —sobre todo en histologías serosas—, pero <strong>no modifica el estadio</strong> por sí sola. Es una de las preguntas trampa más frecuentes del tema.`}},

  {dom:"tx",niv:1,q:"¿Cuál es la cirugía estándar del cáncer de endometrio?",
   a:`<p><strong>Histerectomía total extrafascial + salpingooforectomía bilateral + estadificación ganglionar</strong>, por <strong>vía mínimamente invasiva</strong>, <strong>sin morcelación</strong> y con extracción en bolsa.</p>
      <p><strong>No</strong> es una histerectomía radical: la simple basta, <strong>incluso en estadio II</strong> con invasión del estroma cervical, porque la radical no ha mostrado ventaja de supervivencia y añade morbilidad urinaria.</p>`,
   re:{q:"¿Por qué mínimamente invasiva aquí y abierta en el cáncer de cérvix?",a:`Porque los ensayos dicen cosas opuestas. En <strong>endometrio</strong>, <strong>LAP2</strong> y <strong>LACE</strong> demostraron <strong>equivalencia oncológica</strong> con menos morbilidad. En <strong>cérvix</strong> IB1 o superior, el ensayo <strong>LACC</strong> mostró <strong>peor supervivencia</strong> con la vía mínimamente invasiva, y se volvió a la histerectomía radical <strong>abierta</strong>. Mezclarlos es un error muy visible.`}},

  {dom:"tx",niv:2,q:"Explica el ganglio centinela en cáncer de endometrio.",
   a:`<ul><li><strong>Inyección cervical</strong> (3 y 9 horas, superficial y profunda) con <strong>verde de indocianina</strong>. Es <strong>cervical, no fúndica</strong>: más reproducible y con mejores tasas de mapeo.</li>
      <li>Ensayo <strong>FIRES</strong>: sensibilidad <strong>97%</strong>, valor predictivo negativo <strong>99.6%</strong>.</li>
      <li>Requiere <strong>ultraestadificación patológica</strong> — cortes seriados e inmunohistoquímica — para detectar micrometástasis.</li>
      <li><strong>Si no mapea de un lado, se hace linfadenectomía de esa hemipelvis.</strong></li></ul>`,
   re:{q:"¿Por qué ya no se hace linfadenectomía sistemática?",a:`Porque el ensayo <strong>ASTEC</strong> y el estudio italiano <strong>no mostraron beneficio en supervivencia</strong>, y sí <strong>más morbilidad</strong>: linfedema, linfoceles y lesiones vasculares o nerviosas. Con el centinela se obtiene la misma información estadificadora con una fracción de la morbilidad. Se reserva la linfadenectomía para histologías agresivas o enfermedad avanzada.`}},

  {dom:"tx",niv:3,q:"Mujer de 32 años, endometrioide grado 1, quiere embarazarse. ¿Qué le ofreces?",
   a:`<p><strong>Preservación de fertilidad</strong>, si cumple <em>todos</em> los criterios: endometrioide <strong>grado 1</strong>, <strong>estadio IA sin invasión miometrial</strong> confirmado por <strong>RM</strong>, sin invasión linfovascular, sin enfermedad extrauterina, y paciente informada de que es un tratamiento no estándar.</p>
      <p><strong>Tratamiento:</strong> <strong>DIU con levonorgestrel</strong> ± progestágeno oral en dosis alta (megestrol o medroxiprogesterona), con <strong>reevaluación histológica cada 3–6 meses</strong>. Si no responde a los 6–12 meses → cirugía.</p>`,
   re:{q:"¿Qué más tienes que descartar en una mujer joven?",a:`Un <strong>tumor ovárico sincrónico</strong>: aparece en el <strong>5–29%</strong> de las mujeres jóvenes con cáncer de endometrio. Hay que evaluar los ovarios por imagen. Y también hay que <strong>descartar síndrome de Lynch</strong>, que contraindicaría la conservación. Tras completar la paridad, <strong>histerectomía</strong>.`}},

  {dom:"tx",niv:2,q:"¿Cuándo puedes conservar los ovarios?",
   a:`<p>En premenopáusicas <strong>menores de 45 años</strong> con endometrioide <strong>grado 1</strong>, <strong>estadio I</strong>, sin invasión miometrial profunda, sin factores de riesgo y <strong>sin síndrome de Lynch ni mutación BRCA</strong>.</p>
      <p><strong>La salpinguectomía se hace siempre</strong>, aunque se conserven los ovarios.</p>`,
   re:{q:"¿Por qué siempre la trompa?",a:`Por dos razones: es una vía de diseminación del tumor, y porque hoy se acepta que <strong>muchos carcinomas serosos "ováricos" se originan en realidad en la fimbria de la trompa</strong> (a partir del carcinoma intraepitelial tubárico seroso). Quitar la trompa reduce ese riesgo futuro sin ninguno de los costes de la ooforectomía —menopausia precoz, riesgo cardiovascular y óseo— en una mujer joven.`}},

  {dom:"tx",niv:2,q:"Estadio IB grado 2 sin invasión linfovascular. ¿Adyuvancia?",
   a:`<p><strong>Braquiterapia vaginal.</strong> Es riesgo intermedio.</p>
      <p><strong>Base:</strong> el ensayo <strong>PORTEC-2</strong> demostró que la braquiterapia vaginal es <strong>equivalente a la radioterapia pélvica externa</strong> en control vaginal, con <strong>mucha menos toxicidad</strong> gastrointestinal y genitourinaria.</p>
      <p>Pero <strong>antes de decidir hay que ver el grupo molecular</strong>: si es POLE mutado, se puede observar; si es p53 anormal, se escala a quimioterapia.</p>`,
   re:{q:"¿Qué demostraron PORTEC-1 y GOG-99?",a:`Que la <strong>radioterapia pélvica reduce la recurrencia locorregional pero NO mejora la supervivencia global</strong>. Es el dato clásico del tema y la razón de que hoy se busque el tratamiento menos tóxico que consiga el mismo control local — de ahí el paso a la braquiterapia vaginal en riesgo intermedio.`}},

  {dom:"tx",niv:3,q:"Estadio III o histología serosa. ¿Qué adyuvancia?",
   a:`<p><strong>Quimioterapia (carboplatino + paclitaxel) ± radioterapia.</strong></p>
      <ul><li><strong>PORTEC-3:</strong> la quimiorradioterapia <strong>mejoró la supervivencia global</strong> frente a radioterapia sola en estadio III y en serosos. El beneficio se concentró en el grupo <strong>p53 anormal</strong>; los <strong>POLEmut</strong> evolucionaron excelentemente en ambos brazos.</li>
      <li><strong>GOG-258:</strong> la quimiorradioterapia <strong>no superó a la quimioterapia sola</strong> en supervivencia libre de recurrencia, aunque sí redujo las recaídas locales y ganglionares.</li></ul>
      <p>En la práctica se individualiza combinando ambos resultados con el perfil molecular.</p>`,
   re:{q:"¿Y si además es dMMR y ya hay enfermedad avanzada?",a:`Entra la <strong>inmunoterapia en primera línea</strong>: quimioterapia + <strong>dostarlimab</strong> (ensayo <strong>RUBY</strong>) o + <strong>pembrolizumab</strong> (<strong>NRG-GY018</strong>), con mantenimiento. En dMMR la reducción del riesgo de progresión es muy marcada y hay beneficio en supervivencia global. <strong>Es el cambio de práctica más importante de los últimos años en este tumor.</strong>`}},

  {dom:"tx",niv:2,q:"Enfermedad avanzada, pMMR, progresa tras platino. ¿Qué le das?",
   a:`<p><strong>Lenvatinib + pembrolizumab</strong> — ensayo <strong>KEYNOTE-775</strong>, que mostró mejoría de supervivencia global y libre de progresión frente a quimioterapia en segunda línea.</p>
      <p><strong>Toxicidad del lenvatinib</strong>, que hay que saber manejar: <strong>hipertensión</strong> (la más frecuente y precoz), diarrea, <strong>hipotiroidismo</strong>, proteinuria, fatiga y anorexia. Requiere ajuste activo de dosis y control tensional.</p>`,
   re:{q:"¿Y si el tumor es de bajo grado con receptores hormonales positivos?",a:`Se puede usar <strong>hormonoterapia</strong>, sobre todo si la enfermedad es indolente y de bajo volumen: <strong>progestágenos</strong> (megestrol, medroxiprogesterona), <strong>inhibidores de aromatasa</strong>, o combinaciones como <strong>letrozol + everolimus</strong> o letrozol + abemaciclib. Es mejor tolerada que la quimioterapia y muy razonable como primera opción en ese perfil.`}},

  {dom:"trampa",niv:2,q:"¿Cómo se trata el carcinosarcoma uterino?",
   a:`<p><strong>Como un carcinoma de alto grado, no como un sarcoma.</strong></p>
      <p>Hoy se sabe que el carcinosarcoma es un <strong>carcinoma metaplásico</strong> (desdiferenciado), no un tumor mesenquimatoso verdadero: el componente sarcomatoso deriva del epitelial.</p>
      <p><strong>Tratamiento:</strong> cirugía de estadificación completa + <strong>carboplatino-paclitaxel</strong> ± radioterapia. Se clasifica dentro de las <strong>histologías agresivas</strong> de FIGO 2023.</p>`,
   re:{q:"¿Y qué diferencia hay con un leiomiosarcoma?",a:`El <strong>leiomiosarcoma</strong> sí es un sarcoma verdadero, de músculo liso. No responde a carboplatino-paclitaxel: se usan esquemas de sarcoma (doxorrubicina, gemcitabina-docetaxel). No se hace linfadenectomía de rutina, y sobre todo <strong>no se debe morcelar</strong>, porque disemina el tumor por la cavidad y empeora dramáticamente el pronóstico.`}},

  {dom:"trampa",niv:2,q:"¿Qué seguimiento haces tras el tratamiento?",
   a:`<ul><li>Exploración con <strong>especuloscopia y tacto cada 3–6 meses durante 2–3 años</strong>, luego cada 6–12 meses hasta los 5 años.</li>
      <li><strong>La citología vaginal de rutina no aporta valor</strong>: la mayoría de las recurrencias vaginales son visibles o sintomáticas.</li>
      <li>Imagen y CA-125 <strong>según síntomas e histología</strong>, no protocolizados en bajo riesgo.</li>
      <li><strong>Pérdida de peso y actividad física</strong> — reduce recurrencia y mortalidad por otras causas.</li>
      <li><strong>Cribado de Lynch en todas.</strong></li></ul>`,
   re:{q:"Recurrencia vaginal aislada en una paciente que no recibió radioterapia. ¿Qué haces?",a:`<strong>Radioterapia de rescate con intención curativa</strong> —radioterapia externa + braquiterapia—, con tasas de control en torno al <strong>70%</strong>. Es una de las pocas recurrencias oncológicas realmente rescatables. Si la paciente <em>sí</em> recibió radioterapia previa y la recurrencia es central, se plantea <strong>exenteración pélvica</strong>.`}},

  {dom:"trampa",niv:3,q:"Un POLE mutado grado 3 y un p53 anormal grado 1. ¿Cuál tiene peor pronóstico?",
   a:`<p><strong>El p53 anormal grado 1</strong>, con diferencia.</p>
      <p>Es la demostración de que <strong>la biología molecular pesa más que el grado histológico</strong>. El <strong>POLE ultramutado</strong> tiene supervivencia excelente incluso con grado 3 y se puede <strong>desescalar</strong> el tratamiento; el <strong>p53 anormal</strong> concentra las recaídas y las muertes, y se <strong>escala</strong> a quimioterapia aunque el estadio y el grado sean bajos.</p>`,
   re:{q:"¿Y por qué el POLE mutado va tan bien si tiene tantísimas mutaciones?",a:`Precisamente <em>por eso</em>. La mutación en el dominio <strong>exonucleasa</strong> (corrector de pruebas) de la polimerasa ε genera una <strong>carga mutacional altísima</strong> → muchísimos <strong>neoantígenos</strong> → una <strong>respuesta inmunitaria antitumoral intensa</strong>, con abundantes linfocitos infiltrantes. El sistema inmune hace gran parte del trabajo, y por eso se puede tratar menos.`}}
  ]
},

};

/* =====================================================================
   ESTADO
   ===================================================================== */
const ORDEN = ["bilis","colon","endo"];
let S = {
  tema:"bilis",
  modo:"rep",
  filtro:"todos",
  drill:null,
  stats:{}
};
try{
  const raw = localStorage.getItem("pasevisita.stats");
  if(raw) S.stats = JSON.parse(raw);
}catch(e){}
function guarda(){ try{ localStorage.setItem("pasevisita.stats", JSON.stringify(S.stats)); }catch(e){} }

function statKey(t,i){ return t+":"+i; }
function reg(t,i,g){
  S.stats[statKey(t,i)] = g;
  guarda();
}

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const el = (h)=>{ const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = (s)=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const root = document.getElementById("root");

function baraja(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

/* =====================================================================
   VISTA: REPASO
   ===================================================================== */
function vistaRepaso(){
  const T = TEMAS[S.tema];
  const nav = T.secciones.map((s,i)=>`<a href="#s${i}" data-i="${i}">${esc(s.titulo)}</a>`).join("");
  const secs = T.secciones.map((s,i)=>`
    <section id="s${i}">
      <h2>${esc(s.kicker||s.titulo)}</h2>
      ${s.html}
    </section>`).join("");

  root.innerHTML = `
    <div class="cols">
      <aside class="rail">
        <div>
          <h4>Índice</h4>
          <nav class="railnav" id="railnav">${nav}</nav>
        </div>
        <div>
          <h4>Dominio por área</h4>
          <div class="meters" id="meters"></div>
        </div>
        <div>
          <h4>Atajo</h4>
          <button class="ghost" id="go-drill" style="width:100%">Interrogarme</button>
        </div>
      </aside>
      <article>
        <div class="hero">
          <p class="eyebrow">${esc(T.eyebrow)}</p>
          <h1>${esc(T.titulo)}</h1>
          <p class="dek">${T.dek}</p>
        </div>
        ${secs}
      </article>
    </div>`;

  document.getElementById("go-drill").onclick = ()=>setModo("drill");
  pintaMeters();
  scrollSpy();
}

function scrollSpy(){
  const links=[...document.querySelectorAll("#railnav a")];
  const secs=[...document.querySelectorAll("article section")];
  if(!links.length) return;
  const io=new IntersectionObserver((ents)=>{
    ents.forEach(e=>{
      if(e.isIntersecting){
        const i=secs.indexOf(e.target);
        links.forEach(l=>l.classList.toggle("on", +l.dataset.i===i));
      }
    });
  },{rootMargin:"-76px 0px -66% 0px",threshold:0});
  secs.forEach(s=>io.observe(s));
}

function pintaMeters(){
  const cont=document.getElementById("meters");
  if(!cont) return;
  const T=TEMAS[S.tema];
  const grupos={};
  T.preguntas.forEach((p,i)=>{
    (grupos[p.dom] ||= []).push(i);
  });
  cont.innerHTML = Object.entries(grupos).map(([d,idxs])=>{
    let ok=0,mid=0,bad=0;
    idxs.forEach(i=>{
      const g=S.stats[statKey(S.tema,i)];
      if(g===1)ok++; else if(g===2)mid++; else if(g===3)bad++;
    });
    const n=idxs.length, vistos=ok+mid+bad;
    const pc=(x)=>(x/n*100).toFixed(1)+"%";
    return `<div class="meter">
      <span>${esc(DOM[d]||d)}</span><b>${vistos}/${n}</b>
      <span class="track">
        <i class="s-ok" style="width:${pc(ok)}"></i><i class="s-mid" style="width:${pc(mid)}"></i><i class="s-bad" style="width:${pc(bad)}"></i>
      </span>
    </div>`;
  }).join("");
}

/* =====================================================================
   VISTA: INTERROGATORIO
   ===================================================================== */
function nuevaCola(){
  const T=TEMAS[S.tema];
  let idxs = T.preguntas.map((p,i)=>i);
  if(S.filtro!=="todos") idxs = idxs.filter(i=>T.preguntas[i].dom===S.filtro);
  return { cola:baraja(idxs), pos:0, mostrar:false, repre:false, t0:Date.now(), tally:{1:0,2:0,3:0}, hechas:0 };
}

function vistaDrill(){
  const T=TEMAS[S.tema];
  if(!S.drill) S.drill = nuevaCola();
  const D = S.drill;

  const doms = ["todos", ...Object.keys(DOM).filter(d=>T.preguntas.some(p=>p.dom===d))];
  const filtros = doms.map(d=>`<button class="fbtn" data-f="${d}" aria-pressed="${S.filtro===d}">${d==="todos"?"Todo":esc(DOM[d])}</button>`).join("");

  if(D.pos>=D.cola.length){
    root.innerHTML = `<div class="drill">
      <div class="drill-top"><div class="filters">${filtros}</div></div>
      ${resumenHTML()}
    </div>`;
    enlazaFiltros();
    const r=document.getElementById("reiniciar"); if(r) r.onclick=()=>{ S.drill=nuevaCola(); render(); };
    const sig=document.getElementById("sig-tema"); if(sig) sig.onclick=()=>{
      const i=ORDEN.indexOf(S.tema); setTema(ORDEN[(i+1)%ORDEN.length]); S.drill=nuevaCola(); render();
    };
    return;
  }

  const i = D.cola[D.pos];
  const p = T.preguntas[i];
  const niv = [1,2,3].map(n=>`<i class="${n<=(p.niv||1)?"on":""}"></i>`).join("");

  root.innerHTML = `
  <div class="drill">
    <div class="drill-top">
      <div class="filters">${filtros}</div>
      <span class="clock" id="clock">00:00</span>
    </div>

    <div class="card">
      <div class="card-hd">
        <span class="dom">${esc(DOM[p.dom]||p.dom)}</span>
        <span class="sep">/</span>
        <span class="meta">${D.pos+1} de ${D.cola.length}</span>
        <span class="nivel" title="Dificultad">${niv}</span>
      </div>

      <p class="q">${p.q}</p>

      <div class="a ${D.mostrar?"":"hidden"}" id="resp">
        <div class="a-in">${p.a}</div>
      </div>

      ${p.re ? `<div class="repre ${D.repre?"":"hidden"}" id="repre">
        <span class="lbl">Y entonces te va a repreguntar</span>
        <p class="rq">${p.re.q}</p>
        <p class="ra">${p.re.a}</p>
      </div>` : ``}

      <div class="card-ft" id="ft"></div>
    </div>

    <div class="tally">
      <span class="t1"><b>Lo tenía</b> <span class="n">${D.tally[1]}</span></span>
      <span class="t2"><b>Dudé</b> <span class="n">${D.tally[2]}</span></span>
      <span class="t3"><b>Fallé</b> <span class="n">${D.tally[3]}</span></span>
      <button id="reiniciar2">Reiniciar mazo</button>
    </div>
  </div>`;

  const ft=document.getElementById("ft");
  if(!D.mostrar){
    ft.innerHTML = `<button class="big" id="ver">Responder / Ver</button>
      <span class="hint"><kbd>espacio</kbd> revela · <kbd>←</kbd><kbd>→</kbd> navega</span>`;
    document.getElementById("ver").onclick=revelar;
  }else{
    ft.innerHTML = `
      <div class="grades">
        <button class="g g1" data-g="1">Lo tenía <kbd>1</kbd></button>
        <button class="g g2" data-g="2">Dudé <kbd>2</kbd></button>
        <button class="g g3" data-g="3">Fallé <kbd>3</kbd></button>
      </div>
      ${p.re && !D.repre ? `<button class="ghost" id="verre">Repregunta <kbd style="font-family:var(--f-data);font-size:10px">R</kbd></button>`:``}
      <span class="hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> califica</span>`;
    ft.querySelectorAll(".g").forEach(b=>b.onclick=()=>califica(+b.dataset.g));
    const vr=document.getElementById("verre"); if(vr) vr.onclick=verRepre;
  }
  document.getElementById("reiniciar2").onclick=()=>{ S.drill=nuevaCola(); render(); };
  enlazaFiltros();
  tick();
}

function enlazaFiltros(){
  document.querySelectorAll(".fbtn").forEach(b=>{
    b.onclick=()=>{ S.filtro=b.dataset.f; S.drill=nuevaCola(); render(); };
  });
}

function revelar(){
  if(!S.drill||S.drill.mostrar) return;
  S.drill.mostrar=true; vistaDrill();
}
function verRepre(){
  if(!S.drill) return;
  S.drill.repre=true; vistaDrill();
}
function califica(g){
  const D=S.drill; if(!D||!D.mostrar) return;
  const i=D.cola[D.pos];
  reg(S.tema,i,g);
  D.tally[g]++; D.hechas++;
  // repetición espaciada simple: lo fallado vuelve pronto, lo dudado más tarde
  if(g===3) D.cola.splice(Math.min(D.pos+4,D.cola.length),0,i);
  else if(g===2) D.cola.splice(Math.min(D.pos+9,D.cola.length),0,i);
  D.pos++; D.mostrar=false; D.repre=false; D.t0=Date.now();
  vistaDrill();
}
function mueve(d){
  const D=S.drill; if(!D) return;
  D.pos=Math.max(0,Math.min(D.cola.length,D.pos+d));
  D.mostrar=false; D.repre=false; D.t0=Date.now();
  vistaDrill();
}

let timerId=null;
function tick(){
  clearInterval(timerId);
  const c=document.getElementById("clock");
  if(!c||!S.drill) return;
  const upd=()=>{
    const s=Math.floor((Date.now()-S.drill.t0)/1000);
    c.textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    c.style.color = s>45 ? "var(--bad)" : (s>20 ? "var(--mid)" : "");
  };
  upd(); timerId=setInterval(upd,1000);
}

function resumenHTML(){
  const T=TEMAS[S.tema];
  const flojas = T.preguntas.map((p,i)=>({p,i,g:S.stats[statKey(S.tema,i)]}))
    .filter(x=>x.g===3||x.g===2)
    .sort((a,b)=>b.g-a.g);
  const D=S.drill;
  const total=D.tally[1]+D.tally[2]+D.tally[3];
  const pct = total? Math.round(D.tally[1]/total*100):0;
  return `<div class="done">
    <p class="eyebrow">Fin del mazo</p>
    <h3>${D.tally[1]} de ${total} sin titubear · ${pct}%</h3>
    <p>${pct>=80?"Vas sobrado en este tema. Pasa al siguiente y vuelve mañana temprano a repasar sólo lo marcado.":
        pct>=55?"Base sólida, pero hay huecos que la doctora va a encontrar. Repite el mazo filtrando por el área más floja.":
        "Todavía no. Vuelve al repaso de este tema, léelo entero, y repite el mazo antes de dormir."}</p>
    ${flojas.length?`<h4 class="sub">Lo que tienes que repasar antes de entrar</h4>
      <ol>${flojas.slice(0,10).map(x=>`<li>${x.p.q} <span class="k">${esc(DOM[x.p.dom]||x.p.dom)}</span></li>`).join("")}</ol>`:
      `<p><strong>No dejaste nada marcado.</strong> Eso o fuiste generoso contigo.</p>`}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
      <button class="big" id="reiniciar">Repetir mazo</button>
      <button class="ghost" id="sig-tema">Siguiente tema</button>
    </div>
  </div>`;
}

/* =====================================================================
   CONTROL
   ===================================================================== */
function setTema(t){
  S.tema=t; S.drill=null;
  document.documentElement.dataset.tema=t;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.t===t)));
  render();
}
function setModo(m){
  S.modo=m;
  document.getElementById("m-rep").setAttribute("aria-pressed", String(m==="rep"));
  document.getElementById("m-drill").setAttribute("aria-pressed", String(m==="drill"));
  render();
}
function render(){
  clearInterval(timerId);
  if(S.modo==="rep"){ vistaRepaso(); window.scrollTo(0,0); }
  else vistaDrill();
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTema(b.dataset.t));
document.getElementById("m-rep").onclick=()=>setModo("rep");
document.getElementById("m-drill").onclick=()=>setModo("drill");

const themeBtn=document.getElementById("theme");
themeBtn.onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const sysDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("pasevisita.theme",next); }catch(e){}
};
try{
  const th=localStorage.getItem("pasevisita.theme");
  if(th) document.documentElement.setAttribute("data-theme",th);
}catch(e){}
document.documentElement.dataset.tema = S.tema;

document.addEventListener("keydown",(e)=>{
  if(e.target.matches("input,textarea")) return;
  if(S.modo!=="drill"){
    if(e.key==="i"||e.key==="I"){ setModo("drill"); }
    return;
  }
  const D=S.drill; if(!D) return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!D.mostrar) revelar(); else if(!D.repre) verRepre(); }
  else if(e.key==="1"||e.key==="2"||e.key==="3"){ if(D.mostrar) califica(+e.key); }
  else if(e.key==="r"||e.key==="R"){ if(D.mostrar) verRepre(); }
  else if(e.key==="ArrowRight"){ mueve(1); }
  else if(e.key==="ArrowLeft"){ mueve(-1); }
  else if(e.key==="Escape"){ setModo("rep"); }
});

render();
</script>
