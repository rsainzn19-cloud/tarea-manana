      <figcaption><b>La diferencia no es académica: cambia el fármaco.</b> El tumor MSI-H no se beneficia de 5-FU en monoterapia en estadio II, y en cambio es el que responde a inmunoterapia en enfermedad avanzada. El test de <b>BRAF V600E</b> es lo que separa un MSI esporádico (BRAF mutado, metilación de MLH1) de un <b>Lynch</b> (BRAF nativo) — por eso se pide como reflejo cuando la inmunohistoquímica muestra pérdida de MLH1.</figcaption>
    </figure>

    <h4 class="sub">La secuencia de Vogelstein, en orden</h4>
    <p><strong>APC</strong> (gen <em>gatekeeper</em>; su pérdida activa la vía <strong>Wnt/β-catenina</strong>) → <strong>KRAS</strong> → pérdida de <strong>18q (SMAD4/DCC)</strong> → <strong>TP53</strong>. Unos 10 años desde el epitelio normal hasta el carcinoma: ésa es la ventana que aprovecha el tamizaje.</p>

    <h4 class="sub">El fenotipo MSI — cómo reconocerlo en el reporte</h4>
    <ul>
      <li>Localización en <strong>colon derecho</strong>.</li>
      <li>Histología <strong>mucinosa</strong> o de células en anillo de sello, poco diferenciada.</li>
      <li><strong>Infiltrado linfocitario intratumoral</strong> y reacción linfoide peritumoral tipo Crohn.</li>
      <li><strong>Mejor pronóstico</strong> estadio por estadio, pese al aspecto histológico agresivo.</li>
      <li>La inmunohistoquímica muestra <strong>pérdida de expresión</strong> de MLH1, MSH2, MSH6 o PMS2.</li>
    </ul>
    <p>Hoy se recomienda <strong>estudio universal de MMR/MSI en todo cáncer colorrectal</strong>, por tres motivos: detectar Lynch, decidir la adyuvancia en estadio II y seleccionar inmunoterapia en enfermedad avanzada.</p>

    <h4 class="sub">Factores de riesgo</h4>
    <p>Carne roja y procesada, obesidad, alcohol, tabaco, sedentarismo, diabetes tipo 2, <strong>enfermedad inflamatoria intestinal</strong> (más colitis ulcerosa que Crohn; el riesgo depende de <strong>duración y extensión</strong>), acromegalia, ureterosigmoidostomía, y la <strong>bacteriemia por <em>Streptococcus gallolyticus</em></strong> (antes <em>bovis</em>), que <strong>obliga a hacer colonoscopia</strong>.</p>
    <p><strong>Protectores:</strong> aspirina y AINE, fibra, calcio, actividad física.</p>`},

  {titulo:"Síndromes hereditarios", kicker:"Genética", html:`
    <h3>Lynch — el más preguntado</h3>
    <p>Autosómico <strong>dominante</strong>, por mutación germinal en un gen de reparación de errores de apareamiento: <strong>MLH1, MSH2, MSH6, PMS2</strong> o deleción de <strong>EPCAM</strong>. Es la causa hereditaria más frecuente de cáncer colorrectal (2–4% del total).</p>
    <div class="tw"><table>
      <thead><tr><th>Riesgo de por vida</th><th>&nbsp;</th></tr></thead>
      <tbody>
        <tr><td>Colon</td><td class="num">50–80%</td></tr>
        <tr><td><strong>Endometrio</strong></td><td class="num">40–60%</td></tr>
        <tr><td>Ovario</td><td class="num">10–15%</td></tr>
        <tr><td>Estómago, urotelio, vía biliar, intestino delgado, páncreas, cerebro</td><td class="num">menor</td></tr>
      </tbody>
    </table></div>
    <p><strong>Criterios de Amsterdam II — la regla 3-2-1:</strong> <strong>3</strong> familiares con cáncer asociado a Lynch, uno de ellos familiar de primer grado de los otros dos; en <strong>2</strong> generaciones sucesivas; <strong>1</strong> diagnosticado antes de los 50 años; y exclusión de poliposis adenomatosa familiar.</p>
    <p>Los criterios clínicos hoy son un complemento: el estándar es el <strong>estudio universal de MMR/MSI</strong> en la pieza.</p>

    <div class="box tx"><span class="lbl">Manejo del paciente con Lynch</span>
      <ul>
        <li><strong>Vigilancia:</strong> colonoscopia cada <strong>1–2 años desde los 20–25 años</strong> (o 2–5 años antes del caso índice más joven).</li>
        <li><strong>Si desarrolla cáncer de colon: colectomía total con anastomosis ileorrectal</strong>, no segmentaria — por el alto riesgo de tumor metacrónico. Se discute con el paciente el impacto funcional.</li>
        <li><strong>Histerectomía con salpingooforectomía bilateral profiláctica</strong> al completar la paridad, o hacia los 40–45 años.</li>
        <li><strong>Aspirina</strong> a largo plazo: el ensayo <strong>CAPP2</strong> mostró reducción de la incidencia de cáncer colorrectal.</li>
        <li>Vigilancia endometrial, gástrica y urinaria según el gen y la historia familiar.</li>
      </ul>
    </div>

    <h3>Otros síndromes</h3>
    <div class="tw"><table>
      <thead><tr><th>Síndrome</th><th>Gen · herencia</th><th>Clave</th></tr></thead>
      <tbody>
        <tr><td><strong>PAF</strong></td><td>APC · dominante</td><td>&gt;100 adenomas, penetrancia ~100% a los 40 años. <strong>Proctocolectomía con reservorio ileoanal</strong> o colectomía total con ileorrectal si el recto está poco afectado.</td></tr>
        <tr><td><strong>Gardner</strong></td><td>APC</td><td>PAF + osteomas, <strong>tumores desmoides</strong>, quistes epidermoides, dientes supernumerarios, hipertrofia congénita del epitelio pigmentario retiniano.</td></tr>
        <tr><td><strong>Turcot</strong></td><td>APC o MMR</td><td>Poliposis + tumor del sistema nervioso central (meduloblastoma con APC, glioma con MMR).</td></tr>
        <tr><td><strong>MAP</strong></td><td>MUTYH · <strong>recesivo</strong></td><td>10–100 adenomas. Es el que se olvida: pedigrí <em>horizontal</em>, hermanos afectados sin padres afectados.</td></tr>
        <tr><td><strong>Peutz-Jeghers</strong></td><td>STK11/LKB1 · dominante</td><td>Pólipos <strong>hamartomatosos</strong> + máculas mucocutáneas. Riesgo de cáncer gastrointestinal, mama, páncreas y tumor ovárico de cordones sexuales con túbulos anulares. Causa de invaginación en el adulto joven.</td></tr>
        <tr><td><strong>Poliposis juvenil</strong></td><td>SMAD4 o BMPR1A</td><td>Con SMAD4 se asocia a <strong>telangiectasia hemorrágica hereditaria</strong>.</td></tr>
      </tbody>
    </table></div>
    <p><strong>En la PAF, tras la colectomía la principal causa de muerte deja de ser el colon:</strong> pasan a serlo el <strong>adenocarcinoma duodenal/ampular</strong> (por eso la duodenoscopia periódica con clasificación de <strong>Spigelman</strong>) y los <strong>tumores desmoides</strong>.</p>`},

  {titulo:"Tamizaje, clínica y estadificación", kicker:"Diagnóstico", html:`
    <h3>Tamizaje en riesgo promedio — desde los 45 años</h3>
    <div class="tw"><table>
      <thead><tr><th>Prueba</th><th>Intervalo</th></tr></thead>
      <tbody>
        <tr><td><strong>Colonoscopia</strong></td><td class="num">cada 10 años</td></tr>
        <tr><td>Prueba inmunoquímica fecal (SOMFi)</td><td class="num">anual</td></tr>
        <tr><td>ADN fecal multiobjetivo</td><td class="num">cada 3 años</td></tr>
        <tr><td>Colonografía por TC</td><td class="num">cada 5 años</td></tr>
        <tr><td>Sigmoidoscopia flexible</td><td class="num">cada 5 años</td></tr>
      </tbody>
    </table></div>
    <p>Hasta los <strong>75 años</strong>; entre 76 y 85 se individualiza. <strong>Cualquier prueba no colonoscópica positiva obliga a colonoscopia.</strong></p>
    <p><strong>Antecedente familiar</strong> de un familiar de primer grado con cáncer o adenoma avanzado antes de los 60 años, o dos de primer grado a cualquier edad: colonoscopia <strong>desde los 40 años o 10 años antes del caso índice</strong>, cada 5 años.</p>

    <h3>Lateralidad clínica</h3>
    <div class="tw"><table>
      <thead><tr><th>&nbsp;</th><th>Colon derecho</th><th>Colon izquierdo</th></tr></thead>
      <tbody>
        <tr><td><strong>Presentación</strong></td><td><strong>Anemia ferropénica</strong>, astenia, masa palpable, sangre oculta</td><td><strong>Cambio del hábito intestinal</strong>, obstrucción, hematoquecia, heces acintadas</td></tr>
        <tr><td><strong>Por qué</strong></td><td>Lumen amplio y heces líquidas: crece mucho antes de obstruir</td><td>Lumen estrecho y heces formadas: obstruye antes</td></tr>
        <tr><td><strong>Biología</strong></td><td>Más MSI-H, BRAF, CIMP, mucinoso</td><td>Más CIN, HER2, RAS nativo</td></tr>
        <tr><td><strong>Pronóstico</strong></td><td>Peor en enfermedad metastásica</td><td>Mejor; responde a anti-EGFR</td></tr>
      </tbody>
    </table></div>
    <div class="box warn"><span class="lbl">Regla que no debes fallar</span>
      <p><strong>Anemia ferropénica en un varón o en una mujer posmenopáusica es cáncer de colon derecho hasta que se demuestre lo contrario.</strong> Obliga a colonoscopia, no a tratar con hierro y esperar.</p>
    </div>

    <h3>Estudio de extensión y estadificación</h3>
    <ul>
      <li><strong>Colonoscopia completa con biopsia</strong>; si el tumor obstruye y no se puede pasar, completar el estudio del resto del colon en los 3–6 meses posteriores a la cirugía.</li>
      <li><strong>TC de tórax, abdomen y pelvis</strong> con contraste.</li>
      <li><strong>CEA preoperatorio:</strong> valor pronóstico y basal para el seguimiento. <strong>No sirve para diagnóstico ni para tamizaje.</strong></li>
      <li>En cáncer de <strong>recto</strong>, además: <strong>RM de pelvis</strong> (define el margen circunferencial) y ecoendoscopia en tumores precoces.</li>
    </ul>

    <div class="tw"><table>
      <thead><tr><th>T</th><th>Definición</th><th>&nbsp;</th><th>N</th><th>Definición</th></tr></thead>
      <tbody>
        <tr><td><strong>Tis</strong></td><td>Intramucoso (no pasa la muscularis mucosae)</td><td></td><td><strong>N1a</strong></td><td>1 ganglio</td></tr>
        <tr><td><strong>T1</strong></td><td>Invade submucosa</td><td></td><td><strong>N1b</strong></td><td>2–3 ganglios</td></tr>
        <tr><td><strong>T2</strong></td><td>Invade muscular propia</td><td></td><td><strong>N1c</strong></td><td>Depósitos tumorales sin ganglio</td></tr>
        <tr><td><strong>T3</strong></td><td>Atraviesa la muscular hacia el tejido pericólico</td><td></td><td><strong>N2a</strong></td><td>4–6 ganglios</td></tr>
        <tr><td><strong>T4a</strong></td><td><strong>Perfora el peritoneo visceral</strong></td><td></td><td><strong>N2b</strong></td><td>≥7 ganglios</td></tr>
        <tr><td><strong>T4b</strong></td><td>Invade órganos adyacentes</td><td></td><td><strong>M1a/b/c</strong></td><td>Un órgano · más de uno · <strong>peritoneo</strong></td></tr>
      </tbody>
    </table></div>
    <p><strong>Agrupación:</strong> I = T1-2 N0 · II = T3-4 N0 (IIA T3, IIB T4a, IIC T4b) · <strong>III = cualquier N positivo</strong> · IV = M1.</p>
    <p><strong>Mínimo 12 ganglios examinados.</strong> Si salen menos, el estadio II queda infraestadificado y eso mismo se convierte en un factor de alto riesgo que justifica adyuvancia.</p>

    <h4 class="sub">Pólipo maligno resecado por endoscopia</h4>
    <p>Hay que decidir si basta la polipectomía o hace falta colectomía. <strong>Indican cirugía:</strong> margen &lt;1 mm o indeterminado, tumor <strong>poco diferenciado</strong>, <strong>invasión linfovascular</strong>, <em>budding</em> tumoral de alto grado, <strong>Haggitt 4</strong> (pediculados) o <strong>sm3</strong> (sésiles, Kikuchi).</p>`},

  {titulo:"Tratamiento quirúrgico", kicker:"Tratamiento", html:`
    <h3>El principio: la resección la define el vaso</h3>
    <p>Como el drenaje linfático acompaña a la arteria, resecar el tumor con su territorio linfático significa <strong>ligar la arteria en su origen</strong> y llevarse el mesocolon correspondiente. De ahí se deduce cada operación:</p>

    <div class="tw"><table>
      <thead><tr><th>Localización</th><th>Operación</th><th>Vasos que se ligan en el origen</th></tr></thead>
      <tbody>
        <tr><td>Ciego, ascendente, ángulo hepático</td><td><strong>Hemicolectomía derecha</strong></td><td>Ileocólica, cólica derecha y <strong>rama derecha de la cólica media</strong></td></tr>
        <tr><td>Transverso proximal y medio</td><td><strong>Hemicolectomía derecha ampliada</strong></td><td>Lo anterior + <strong>cólica media completa</strong></td></tr>
        <tr><td>Ángulo esplénico</td><td>Hemicolectomía izquierda ampliada o colectomía subtotal</td><td>Rama izquierda de la cólica media + cólica izquierda</td></tr>
        <tr><td>Descendente</td><td><strong>Hemicolectomía izquierda</strong></td><td>Cólica izquierda ± AMI</td></tr>
        <tr><td>Sigmoides</td><td><strong>Sigmoidectomía</strong></td><td>Sigmoideas ± <strong>AMI en su origen aórtico</strong></td></tr>
      </tbody>
    </table></div>

    <div class="box tx"><span class="lbl">Escisión mesocólica completa (CME) con ligadura vascular central</span>
      <p>Disección en el <strong>plano embriológico avascular</strong> entre la fascia mesocólica y la fascia parietal, extrayendo el mesocolon <strong>íntegro</strong>, con ligadura del vaso en su origen. Es el equivalente colónico de la <strong>escisión total del mesorrecto</strong> del cáncer de recto. Aumenta la cosecha ganglionar y la calidad del espécimen, con probable beneficio en supervivencia.</p>
    </div>

    <h4 class="sub">Ligadura alta o baja de la mesentérica inferior</h4>
    <p><strong>Alta</strong> (en el origen aórtico): más ganglios apicales, estadificación más precisa. Riesgos: lesión del <strong>plexo hipogástrico superior</strong> (disfunción eyaculatoria y vesical) y compromiso de la irrigación del colon descendente — obliga a <strong>movilizar el ángulo esplénico</strong> para que la anastomosis llegue sin tensión y bien vascularizada.</p>
    <p><strong>Baja</strong> (distal al nacimiento de la cólica izquierda): oncológicamente aceptable, preserva mejor la irrigación. Los ensayos no han mostrado diferencia clara en supervivencia; la elección es del cirujano.</p>

    <h4 class="sub">Cáncer de colon obstruido</h4>
    <ul>
      <li><strong>Colon derecho:</strong> resección con <strong>anastomosis primaria</strong> — es segura porque el contenido es líquido y la irrigación es buena.</li>
      <li><strong>Colon izquierdo:</strong> cuatro opciones —
        <ol>
          <li><strong>Prótesis metálica autoexpandible como puente a la cirugía</strong>: descomprime, permite estadificar, preparar al paciente y operar de forma electiva y laparoscópica. <strong>Contraindicada si hay perforación</strong> y en pacientes que van a recibir <strong>bevacizumab</strong> (riesgo de perforación).</li>
          <li><strong>Procedimiento de Hartmann</strong>: resección + colostomía terminal. El más seguro en el paciente inestable o con peritonitis.</li>
          <li>Resección con <strong>anastomosis primaria</strong> ± lavado colónico intraoperatorio ± <strong>ileostomía de protección</strong>.</li>
          <li><strong>Colectomía subtotal</strong> con ileorrectal: útil si hay sufrimiento del colon proximal o tumores sincrónicos.</li>
        </ol>
      </li>
      <li><strong>Perforación:</strong> es una urgencia oncológica y un factor de mal pronóstico (<span class="k">T4a</span>). Resección con márgenes, lavado abundante y, en general, estoma.</li>
    </ul>

    <div class="box warn"><span class="lbl">T4b — el error que cuesta la supervivencia</span>
      <p>Si el tumor está adherido a un órgano vecino, <strong>hay que resecarlo en bloque</strong>, sin intentar separar el plano. En más de un tercio de los casos la adherencia es inflamatoria y no tumoral, pero <strong>no se puede saber intraoperatoriamente</strong>, y separar el plano siembra el campo y empeora la supervivencia de forma significativa.</p>
    </div>

    <p><strong>Abordaje laparoscópico:</strong> equivalente oncológicamente al abierto (ensayos COST, COLOR, CLASICC) con menos dolor, menor estancia e igual supervivencia. Es el estándar en enfermedad no complicada.</p>`},

  {titulo:"Tratamiento sistémico", kicker:"Tratamiento", html:`
    <h3>Adyuvancia — a quién sí</h3>
    <div class="tw"><table>
      <thead><tr><th>Estadio</th><th>Conducta</th></tr></thead>
      <tbody>
        <tr><td><strong>I</strong></td><td>Cirugía sola. <strong>Sin adyuvancia.</strong></td></tr>
        <tr><td><strong>II bajo riesgo</strong></td><td>Observación.</td></tr>
        <tr><td><strong>II alto riesgo</strong></td><td>Considerar fluoropirimidina ± oxaliplatino, individualizado.</td></tr>
        <tr><td><strong>III</strong></td><td><strong>FOLFOX o CAPOX</strong> siempre, iniciando en 6–8 semanas.</td></tr>
      </tbody>
    </table></div>

    <div class="box acc"><span class="lbl">Factores de alto riesgo en estadio II — la lista que te va a pedir</span>
      <ul>
        <li><span class="k">T4</span> (estadio IIB o IIC)</li>
        <li><strong>Menos de 12 ganglios</strong> examinados</li>
        <li>Tumor <strong>poco diferenciado</strong> — <em>salvo que sea MSI-H</em></li>
        <li><strong>Invasión linfovascular o perineural</strong></li>
        <li><strong>Obstrucción o perforación</strong> al debut</li>
        <li>Márgenes positivos o indeterminados</li>
        <li>CEA preoperatorio elevado que no normaliza tras la cirugía</li>
      </ul>
    </div>

    <div class="box warn"><span class="lbl">La excepción que separa al que estudió del que no</span>
      <p><strong>En estadio II con MSI-H / dMMR no se da 5-FU en monoterapia.</strong> No hay beneficio y hay señales de posible perjuicio. Además, estos tumores tienen <strong>mejor pronóstico de base</strong>, así que la mayoría se observan. Por eso hay que pedir MMR/MSI en <em>todo</em> estadio II antes de decidir.</p>
    </div>

    <h4 class="sub">Ensayo IDEA — duración de la adyuvancia</h4>
    <ul>
      <li><strong>Riesgo bajo</strong> (T1-3 N1): <strong>3 meses de CAPOX</strong> no es inferior a 6, con mucha menos neuropatía. Es la opción preferida.</li>
      <li><strong>Riesgo alto</strong> (T4 o N2): <strong>6 meses</strong>, preferentemente FOLFOX.</li>
    </ul>

    <h4 class="sub">Toxicidades — casi seguro que te las pregunta</h4>
    <div class="tw"><table>
      <thead><tr><th>Fármaco</th><th>Toxicidad característica</th><th>Farmacogenética</th></tr></thead>
      <tbody>
        <tr><td><strong>Oxaliplatino</strong></td><td><strong>Neuropatía sensitiva acumulativa</strong>, exacerbada por el frío; neuropatía aguda al infundir</td><td>—</td></tr>
        <tr><td><strong>5-FU / capecitabina</strong></td><td>Mucositis, diarrea, <strong>síndrome mano-pie</strong> (más con capecitabina), vasoespasmo coronario</td><td><strong>Deficiencia de DPD (DPYD)</strong> → toxicidad grave o mortal. Se recomienda genotipificar antes.</td></tr>
        <tr><td><strong>Irinotecán</strong></td><td>Diarrea <strong>temprana colinérgica</strong> (atropina) y <strong>tardía</strong> (loperamida); mielosupresión, alopecia</td><td><strong>UGT1A1*28</strong> (Gilbert) → más neutropenia y diarrea</td></tr>
      </tbody>
    </table></div>

    <h3>Enfermedad metastásica</h3>
    <p><strong>Antes de tratar hay que tener el perfil molecular:</strong> <strong>RAS</strong> (KRAS y NRAS), <strong>BRAF</strong>, <strong>MMR/MSI</strong>, <strong>HER2</strong> — y saber la <strong>lateralidad</strong>.</p>
    <div class="tw"><table>
      <thead><tr><th>Perfil</th><th>Primera línea</th><th>Por qué</th></tr></thead>
      <tbody>
        <tr><td><strong>dMMR / MSI-H</strong></td><td><strong>Pembrolizumab</strong></td><td>KEYNOTE-177: supera a la quimioterapia. También nivolumab ± ipilimumab.</td></tr>
        <tr><td>RAS nativo · <strong>tumor izquierdo</strong></td><td>Doblete + <strong>anti-EGFR</strong> (cetuximab o panitumumab)</td><td>Mejor respuesta y supervivencia que bevacizumab en este subgrupo</td></tr>
        <tr><td><strong>RAS mutado</strong> o <strong>tumor derecho</strong></td><td>Doblete + <strong>bevacizumab</strong></td><td>El anti-EGFR <strong>no funciona</strong> con RAS mutado, y rinde mal en tumores derechos</td></tr>
        <tr><td><strong>BRAF V600E</strong></td><td>Doblete ± bevacizumab; en segunda línea <strong>encorafenib + cetuximab</strong></td><td>Ensayo BEACON. Es el subgrupo de peor pronóstico.</td></tr>
        <tr><td><strong>HER2 amplificado</strong> (RAS nativo)</td><td>Trastuzumab + tucatinib, pertuzumab o lapatinib</td><td>Tras progresión a las líneas estándar</td></tr>
      </tbody>
    </table></div>

    <div class="box warn"><span class="lbl">Pregunta casi garantizada</span>
      <p><strong>¿Por qué no das cetuximab si el RAS está mutado?</strong> Porque el anti-EGFR bloquea el receptor <em>por encima</em> de RAS en la cascada. Si RAS tiene una mutación activadora, la vía está encendida <strong>corriente abajo</strong> del punto de bloqueo y la señal sigue llegando al núcleo. Es un <strong>biomarcador predictivo negativo</strong>: no es que funcione menos, es que no funciona.</p>
      <p><strong>Toxicidades:</strong> anti-EGFR → <strong>rash acneiforme</strong> (que correlaciona con la respuesta) e <strong>hipomagnesemia</strong>. Bevacizumab → <strong>hipertensión, proteinuria, sangrado, perforación intestinal y mala cicatrización</strong>: hay que suspenderlo <strong>6 semanas antes</strong> de una cirugía electiva.</p>
    </div>

    <h4 class="sub">Metástasis hepáticas</h4>
    <p><strong>Son resecables con intención curativa</strong>: la metastasectomía completa alcanza <strong>40–50% de supervivencia a 5 años</strong>. El criterio moderno no es el número de lesiones, sino que se pueda lograr una <strong>resección R0</strong> dejando un <strong>remanente hepático funcional suficiente</strong> (20–30%) con entrada vascular, salida venosa y drenaje biliar intactos.</p>
    <p>Herramientas para llegar ahí: <strong>quimioterapia de conversión</strong>, <strong>embolización portal</strong>, hepatectomía en dos tiempos, ALPPS y ablación por radiofrecuencia o microondas.</p>

    <h4 class="sub">Carcinomatosis peritoneal</h4>
    <p>En enfermedad peritoneal limitada (índice de carcinomatosis bajo), la <strong>citorreducción completa</strong> en centros expertos ofrece supervivencia prolongada. El ensayo <strong>PRODIGE-7</strong> cuestionó el aporte adicional del <strong>HIPEC con oxaliplatino</strong>: el beneficio parece venir de la <strong>citorreducción</strong> en sí, no de la quimioterapia intraperitoneal.</p>

    <h3>Seguimiento tras resección con intención curativa (estadios II–III)</h3>
    <ul>
      <li><strong>Historia, exploración y CEA cada 3–6 meses durante 3 años</strong>, luego cada 6 meses hasta completar 5.</li>
      <li><strong>TC de tórax, abdomen y pelvis</strong> anual durante 5 años (cada 6–12 meses los primeros 3 en alto riesgo).</li>
      <li><strong>Colonoscopia al año</strong> de la cirugía — o a los <strong>3–6 meses</strong> si la preoperatoria fue incompleta por obstrucción. Si es normal, se repite a los 3 años y después cada 5.</li>
    </ul>`}
  ],
  preguntas:[
  {dom:"anat",niv:1,q:"¿Qué arterias irrigan el colon y hasta dónde llega cada una?",
   a:`<p><strong>Arteria mesentérica superior</strong> (intestino medio) → ileocólica, cólica derecha (inconstante, ausente en 20–40%) y cólica media. Irriga ciego, ascendente y los <strong>dos tercios proximales del transverso</strong>.</p>
      <p><strong>Arteria mesentérica inferior</strong> (intestino posterior) → cólica izquierda, sigmoideas y rectal superior. Irriga el tercio distal del transverso, descendente, sigmoides y recto proximal.</p>`,
   re:{q:"¿Y qué las conecta?",a:`La <strong>arteria marginal de Drummond</strong>, una arcada continua paracólica que recorre todo el colon. El <strong>arco de Riolano</strong> es una conexión más central e inconstante entre la cólica media y la cólica izquierda; se hace prominente y visible cuando hay estenosis de la AMI o la AMS ("mesentérica serpenteante").`}},

  {dom:"anat",niv:2,q:"¿Qué son los puntos de Griffith y de Sudeck?",
   a:`<p>Son las dos <strong>zonas divisorias (watershed)</strong> del colon, donde la anastomosis marginal es más débil o inconstante:</p>
      <ul><li><strong>Punto de Griffith:</strong> en el <strong>ángulo esplénico</strong>, unión de los territorios de la cólica media (AMS) y la cólica izquierda (AMI).</li>
      <li><strong>Punto de Sudeck:</strong> en la <strong>unión rectosigmoidea</strong>, entre la última sigmoidea y la rectal superior.</li></ul>
      <p>Son las localizaciones típicas de la <strong>colitis isquémica</strong>.</p>`,
   re:{q:"¿Qué implicación quirúrgica tiene?",a:`Que una anastomosis situada en esas zonas tiene más riesgo de <strong>dehiscencia por isquemia</strong>. Es una de las razones por las que, tras una ligadura alta de la AMI, hay que <strong>movilizar el ángulo esplénico</strong>: para poder llevar colon bien vascularizado y sin tensión hasta la anastomosis.`}},

  {dom:"anat",niv:2,q:"¿Qué porciones del colon son retroperitoneales y por qué importa?",
   a:`<p><strong>Retroperitoneales:</strong> colon <strong>ascendente</strong>, <strong>descendente</strong> y los dos tercios distales del recto. <strong>Intraperitoneales:</strong> ciego, transverso, sigmoides y tercio superior del recto.</p>
      <p><strong>Importa porque cambia la presentación de la perforación:</strong> un tumor del ascendente que perfora hacia atrás da un <strong>absceso retroperitoneal</strong> y puede invadir duodeno, uréter o riñón sin peritonitis; uno del sigmoides perfora libre y da <strong>peritonitis fecaloidea</strong>.</p>`,
   re:{q:"¿Y qué significa T4a exactamente?",a:`<span class="k">T4a</span> es <strong>perforación del peritoneo visceral</strong> por el tumor. Ojo con la lógica: en un segmento retroperitoneal, el tumor puede invadir tejidos vecinos sin haber atravesado peritoneo visceral — ahí lo que aplica es <span class="k">T4b</span> (invasión de órgano adyacente) o T3, según el caso.`}},

  {dom:"anat",niv:2,q:"Describe las estaciones del drenaje linfático del colon.",
   a:`<p><strong>Epicólicos</strong> (sobre la pared) → <strong>paracólicos</strong> (a lo largo de la arteria marginal) → <strong>intermedios</strong> (siguiendo las arterias principales) → <strong>principales o apicales</strong> (en el origen del vaso desde la aorta).</p>
      <p><strong>El linfático sigue a la arteria.</strong> Por eso la ligadura vascular en el origen no es una preferencia técnica: es lo que permite llevarse la cadena ganglionar completa.</p>`,
   re:{q:"¿Cuántos ganglios hay que examinar y por qué?",a:`<strong>Mínimo 12.</strong> Es un estándar de calidad tanto quirúrgica como patológica: con menos, aumenta la probabilidad de <strong>infraestadificar</strong> un estadio III como II. Por eso, si en un estadio II se examinaron menos de 12 ganglios, eso mismo se convierte en un <strong>factor de alto riesgo</strong> que justifica considerar adyuvancia.`}},

  {dom:"anat",niv:3,q:"¿Por qué el carcinoma intramucoso de colon no metastatiza?",
   a:`<p>Porque <strong>la lámina propia del colon carece de vasos linfáticos</strong>. Mientras la neoplasia no atraviese la <strong>muscularis mucosae</strong>, no tiene acceso a la vía linfática. Por eso se clasifica como <span class="k">Tis</span> y la polipectomía completa es curativa.</p>
      <p>En cuanto invade la <strong>submucosa</strong> (<span class="k">T1</span>) aparece riesgo ganglionar del <strong>6 al 15%</strong>.</p>`,
   re:{q:"¿Se puede decir lo mismo del esófago y del estómago?",a:`<strong>No</strong> — y ésa es la trampa. En esófago y estómago la lámina propia <strong>sí tiene linfáticos</strong>, de modo que el carcinoma intramucoso ya puede dar metástasis ganglionares. Es una diferencia anatómica específica del colon.`}},

  {dom:"fisio",niv:2,q:"¿Cuál es el combustible principal del colonocito?",
   a:`<p>El <strong>butirato</strong>, un ácido graso de cadena corta producido por la <strong>fermentación bacteriana de la fibra</strong>. (El enterocito del intestino delgado, en cambio, usa <strong>glutamina</strong>.)</p>
      <p>Además de nutrir, el butirato es <strong>inhibidor de histona-desacetilasas</strong>, lo que promueve diferenciación y apoptosis — un efecto <strong>antitumoral</strong> que da base fisiológica al papel protector de la fibra.</p>`,
   re:{q:"¿Qué es la colitis de derivación?",a:`Inflamación de un segmento de colon <strong>excluido del tránsito</strong> (por ejemplo, el muñón rectal tras un Hartmann). Al no llegar contenido, no hay sustrato para fermentar y el colonocito se queda <strong>sin butirato</strong>. Se resuelve <strong>reconstituyendo el tránsito</strong>; como puente pueden usarse enemas de ácidos grasos de cadena corta.`}},

  {dom:"fisio",niv:1,q:"¿Cuánta agua maneja el colon y cómo la absorbe?",
   a:`<p>Recibe <strong>1–2 L al día</strong> de contenido ileal y elimina <strong>100–200 mL</strong> en heces; su capacidad máxima de absorción es de unos <strong>5 L/día</strong> — margen que explica que una diarrea de intestino delgado deba ser muy voluminosa para desbordarlo.</p>
      <p>El mecanismo es la absorción de <strong>sodio por canales ENaC</strong>, regulada por <strong>aldosterona</strong>, con arrastre osmótico de agua e intercambio por potasio y bicarbonato.</p>`,
   re:{q:"¿Por qué un adenoma velloso grande puede dar hipopotasemia?",a:`Porque los adenomas vellosos, sobre todo los grandes y distales, <strong>secretan moco rico en potasio</strong>. Producen una diarrea secretora con pérdida de potasio y bicarbonato: es el <strong>síndrome de McKittrick-Wheelock</strong>, con hipopotasemia, deshidratación y fracaso renal prerrenal.`}},

  {dom:"fisiopat",niv:2,q:"Describe la secuencia adenoma-carcinoma.",
   a:`<p><strong>Modelo de Vogelstein:</strong> epitelio normal → pérdida de <strong>APC</strong> (5q, gen <em>gatekeeper</em>; activa la vía <strong>Wnt/β-catenina</strong>) → <strong>KRAS</strong> (12p) en el adenoma intermedio → pérdida de <strong>18q (SMAD4/DCC)</strong> → <strong>TP53</strong> (17p) → carcinoma invasor.</p>
      <p>Es la vía de <strong>inestabilidad cromosómica (CIN)</strong>, el 65–70% de los casos. Tarda alrededor de <strong>10 años</strong>: ésa es la ventana que hace viable el tamizaje.</p>`,
   re:{q:"¿Y la vía serrada?",a:`Empieza distinta: <strong>BRAF V600E</strong> → pólipo <strong>serrado sésil</strong> → fenotipo metilador <strong>CIMP</strong> → <strong>metilación del promotor de MLH1</strong> → pérdida de reparación de errores de apareamiento → carcinoma <strong>MSI-H</strong>. Predomina en <strong>colon derecho</strong> y explica la mayoría de los MSI esporádicos.`}},

  {dom:"fisiopat",niv:3,q:"¿Cómo diferencias un tumor MSI esporádico de un síndrome de Lynch?",
   a:`<p>Ambos muestran <strong>pérdida de expresión de MLH1/PMS2</strong> en la inmunohistoquímica. La distinción se hace con dos pruebas de reflejo:</p>
      <ul><li><strong>BRAF V600E mutado</strong> → prácticamente descarta Lynch: apunta a MSI <strong>esporádico</strong> de la vía serrada.</li>
      <li><strong>Metilación del promotor de MLH1</strong> presente → esporádico.</li>
      <li><strong>BRAF nativo y sin metilación</strong> → sospecha de <strong>Lynch</strong>: hay que hacer estudio germinal.</li></ul>
      <p>Si la pérdida es de <strong>MSH2, MSH6 o PMS2</strong> aislada, se va directo a estudio germinal (esos no se silencian por metilación).</p>`,
   re:{q:"¿Y por qué importa detectarlo?",a:`Por tres decisiones concretas: <strong>(1)</strong> cambia la cirugía —en Lynch se plantea <strong>colectomía total con ileorrectal</strong> por el riesgo metacrónico—; <strong>(2)</strong> obliga a vigilancia y a <strong>histerectomía profiláctica</strong> al completar la paridad; <strong>(3)</strong> tiene implicaciones para toda la familia. Además, en estadio II modifica la adyuvancia y en metastásico abre la inmunoterapia.`}},

  {dom:"fisiopat",niv:2,q:"¿Qué características tiene el fenotipo MSI-H en la pieza?",
   a:`<ul><li><strong>Colon derecho.</strong></li>
      <li>Histología <strong>mucinosa</strong> o de células en anillo de sello, <strong>poco diferenciada</strong>.</li>
      <li><strong>Infiltrado linfocitario intratumoral</strong> y reacción linfoide peritumoral tipo Crohn.</li>
      <li>Pese al aspecto agresivo, <strong>mejor pronóstico estadio por estadio</strong>.</li></ul>`,
   re:{q:"¿Y qué consecuencia terapéutica tiene?",a:`Dos, y son opuestas según el escenario: en <strong>estadio II no se da 5-FU en monoterapia</strong> (sin beneficio, posible perjuicio); en <strong>enfermedad metastásica</strong>, en cambio, es el subgrupo que responde a <strong>inmunoterapia</strong> —pembrolizumab en primera línea, según KEYNOTE-177—, porque la alta carga mutacional genera muchos neoantígenos.`}},

  {dom:"fisiopat",niv:2,q:"Criterios de Amsterdam II para síndrome de Lynch.",
   a:`<p><strong>La regla 3-2-1:</strong></p>
      <ul><li><strong>3</strong> familiares con cáncer asociado a Lynch (colon, endometrio, intestino delgado, urotelio), uno de ellos <strong>familiar de primer grado</strong> de los otros dos.</li>
      <li>Afectando al menos <strong>2</strong> generaciones sucesivas.</li>
      <li>Al menos <strong>1</strong> diagnosticado <strong>antes de los 50 años</strong>.</li>
      <li>Exclusión de poliposis adenomatosa familiar y confirmación histológica.</li></ul>`,
   re:{q:"¿Se sigue usando en la práctica?",a:`Como herramienta de sospecha clínica, sí, pero <strong>ya no es la puerta de entrada</strong>: el estándar actual es el <strong>estudio universal de MMR/MSI en toda pieza de cáncer colorrectal y de endometrio</strong>, porque los criterios clínicos dejan escapar una proporción importante de casos —sobre todo familias pequeñas o mutaciones en MSH6, que dan cánceres más tardíos.`}},

  {dom:"fisiopat",niv:2,q:"Poliposis adenomatosa familiar: gen, riesgo y manejo.",
   a:`<p><strong>Gen APC</strong>, autosómico <strong>dominante</strong>. Más de 100 adenomas colorrectales, con <strong>penetrancia cercana al 100% a los 40 años</strong>.</p>
      <p><strong>Manejo:</strong> <strong>proctocolectomía con reservorio ileoanal</strong>, o colectomía total con anastomosis ileorrectal si el recto está poco afectado —en ese caso, <strong>rectoscopia de vigilancia anual</strong> del recto remanente de por vida.</p>`,
   re:{q:"Tras la colectomía, ¿de qué se mueren estos pacientes?",a:`Ya no del colon. Las dos causas principales pasan a ser el <strong>adenocarcinoma duodenal o ampular</strong> —por eso se hace duodenoscopia periódica con estadificación de <strong>Spigelman</strong>— y los <strong>tumores desmoides</strong>, que en el síndrome de Gardner pueden ser intraabdominales e irresecables.`}},

  {dom:"dx",niv:1,q:"¿A qué edad y con qué pruebas se hace el tamizaje en riesgo promedio?",
   a:`<p>Desde los <strong>45 años</strong> hasta los <strong>75</strong> (76–85 individualizado).</p>
      <ul><li><strong>Colonoscopia cada 10 años</strong> — el estándar de referencia, diagnóstica y terapéutica.</li>
      <li>Prueba inmunoquímica fecal <strong>anual</strong>.</li>
      <li>ADN fecal multiobjetivo cada 3 años.</li>
      <li>Colonografía por TC o sigmoidoscopia cada 5 años.</li></ul>
      <p><strong>Cualquier prueba no colonoscópica positiva obliga a colonoscopia.</strong></p>`,
   re:{q:"¿Y si el padre tuvo cáncer de colon a los 52?",a:`Deja de ser riesgo promedio. Con un familiar de <strong>primer grado</strong> diagnosticado <strong>antes de los 60 años</strong> (o dos de primer grado a cualquier edad): <strong>colonoscopia desde los 40 años, o 10 años antes de la edad del caso índice</strong> —lo que ocurra primero—, y repetir <strong>cada 5 años</strong>.`}},

  {dom:"dx",niv:2,q:"Varón de 68 años con anemia ferropénica y sin síntomas digestivos. ¿Qué piensas?",
   a:`<p><strong>Cáncer de colon derecho hasta que se demuestre lo contrario.</strong> El ciego y el ascendente tienen lumen amplio y contenido líquido, así que el tumor crece y sangra crónicamente sin obstruir ni cambiar el hábito intestinal.</p>
      <p><strong>Conducta: colonoscopia</strong> —no tratar con hierro y esperar—. Si es negativa, endoscopia alta y estudio del intestino delgado.</p>`,
   re:{q:"¿Y si además tiene una bacteriemia por Streptococcus gallolyticus?",a:`Refuerza la sospecha de forma importante. La bacteriemia o endocarditis por <strong><em>Streptococcus gallolyticus</em></strong> (antes <em>S. bovis</em>) se asocia a neoplasia colorrectal en una proporción alta de casos y <strong>obliga a hacer colonoscopia</strong>, aunque el paciente esté asintomático.`}},

  {dom:"dx",niv:2,q:"¿Para qué sirve y para qué NO sirve el CEA?",
   a:`<p><strong>Sirve para:</strong> valor <strong>pronóstico</strong> preoperatorio (un CEA alto se asocia a peor pronóstico), establecer un <strong>basal</strong> y <strong>vigilar la recurrencia</strong> en el seguimiento.</p>
      <p><strong>No sirve para:</strong> <strong>diagnóstico</strong> ni <strong>tamizaje</strong> — carece de sensibilidad y especificidad suficientes; sube también en tabaquismo, hepatopatía, pancreatitis, EPOC y otras neoplasias.</p>`,
   re:{q:"El CEA sube en el seguimiento pero la TC es normal. ¿Qué haces?",a:`Primero <strong>confirmar con una segunda determinación</strong>. Si se confirma la elevación sostenida: repetir la TC, hacer <strong>colonoscopia</strong>, y si sigue sin verse el origen, considerar un <strong>PET-TC</strong>. Lo que no se debe hacer es iniciar quimioterapia "a ciegas" por un CEA aislado.`}},

  {dom:"dx",niv:3,q:"Define los estadios T y la agrupación por estadios.",
   a:`<p><strong>Tis</strong> intramucoso · <strong>T1</strong> submucosa · <strong>T2</strong> muscular propia · <strong>T3</strong> atraviesa la muscular hacia el tejido pericólico · <strong>T4a</strong> perfora el <strong>peritoneo visceral</strong> · <strong>T4b</strong> invade órganos adyacentes.</p>
      <p><strong>N1a</strong> 1 ganglio · <strong>N1b</strong> 2–3 · <strong>N1c</strong> depósitos tumorales sin ganglio · <strong>N2a</strong> 4–6 · <strong>N2b</strong> ≥7.</p>
      <p><strong>Estadio I</strong> = T1-2 N0 · <strong>II</strong> = T3-4 N0 (IIA T3, IIB T4a, IIC T4b) · <strong>III</strong> = <em>cualquier</em> N positivo · <strong>IV</strong> = M1 (a: un órgano; b: más de uno; c: <strong>peritoneo</strong>).</p>`,
   re:{q:"¿Un T4a N0 es peor que un T2 N1?",a:`Por estadio, el <strong>T2 N1 es estadio III</strong> y el <strong>T4a N0 es estadio IIB</strong>, así que formalmente el III es más avanzado. Pero en la práctica el <strong>T4 N0 tiene un pronóstico comparable o peor</strong> que algunos estadios III de bajo riesgo — por eso el T4 es uno de los factores de alto riesgo que justifican adyuvancia en estadio II.`}},

  {dom:"tx",niv:1,q:"Tumor en colon ascendente. ¿Qué operación y qué vasos ligas?",
   a:`<p><strong>Hemicolectomía derecha.</strong> Se ligan en su origen: <strong>arteria ileocólica</strong>, <strong>arteria cólica derecha</strong> (cuando existe) y la <strong>rama derecha de la arteria cólica media</strong>.</p>
      <p>Resección de los últimos 10–15 cm de íleon terminal hasta el colon transverso proximal, con <strong>anastomosis ileocólica</strong>, y escisión del mesocolon derecho íntegro.</p>`,
   re:{q:"¿Y si el tumor está en el transverso medio?",a:`<strong>Hemicolectomía derecha ampliada</strong>, ligando la <strong>cólica media completa</strong> en su origen. Se prefiere a la colectomía transversa aislada porque la anastomosis ileocólica queda mucho mejor vascularizada que una anastomosis colo-cólica en pleno territorio <em>watershed</em>.`}},

  {dom:"tx",niv:2,q:"¿Qué es la escisión mesocólica completa y por qué se hace?",
   a:`<p>Disección en el <strong>plano embriológico avascular</strong> entre la fascia mesocólica visceral y la fascia parietal, extrayendo el <strong>mesocolon íntegro</strong>, envuelto en su fascia, junto con la <strong>ligadura vascular central</strong> (en el origen del vaso).</p>
      <p><strong>Por qué:</strong> el drenaje linfático sigue a la arteria; un mesocolon íntegro con ligadura en el origen se lleva toda la cadena, incluidos los ganglios apicales. Aumenta la cosecha ganglionar y la calidad del espécimen.</p>
      <p>Es el equivalente colónico de la <strong>escisión total del mesorrecto</strong>.</p>`,
   re:{q:"¿Ligadura alta o baja de la mesentérica inferior?",a:`<strong>Alta</strong> (origen aórtico): más ganglios apicales y mejor estadificación, pero riesgo de lesionar el <strong>plexo hipogástrico superior</strong> —disfunción eyaculatoria y vesical— y de comprometer la irrigación del descendente, lo que obliga a <strong>movilizar el ángulo esplénico</strong>. <strong>Baja</strong> (distal a la cólica izquierda): oncológicamente aceptable y preserva mejor la perfusión. Los ensayos no muestran diferencia clara en supervivencia.`}},

  {dom:"tx",niv:3,q:"Cáncer de sigmoides obstruido, paciente estable. ¿Opciones?",
   a:`<ol><li><strong>Prótesis metálica autoexpandible como puente a la cirugía:</strong> descomprime, permite completar la colonoscopia, preparar al paciente y operar de forma <strong>electiva y laparoscópica con anastomosis primaria</strong>. Reduce estomas.</li>
      <li><strong>Hartmann:</strong> resección con colostomía terminal. El más seguro si hay inestabilidad o peritonitis.</li>
      <li><strong>Resección con anastomosis primaria</strong> ± lavado colónico intraoperatorio ± <strong>ileostomía de protección</strong>.</li>
      <li><strong>Colectomía subtotal</strong> con ileorrectal si el colon proximal está sufriendo o hay tumores sincrónicos.</li></ol>`,
   re:{q:"¿Cuándo NO pones la prótesis?",a:`Si hay <strong>perforación</strong> o signos de perforación inminente, si el tumor es muy distal (a menos de 5 cm del margen anal, por el tenesmo), y en pacientes que van a recibir <strong>bevacizumab</strong> —aumenta mucho el riesgo de perforación—. En un candidato a cirugía curativa también se debate el riesgo teórico de diseminación por la manipulación, por lo que su uso como puente se reserva a situaciones seleccionadas.`}},

  {dom:"tx",niv:2,q:"El tumor está adherido a la pared abdominal. ¿Qué haces?",
   a:`<p><strong>Resección en bloque</strong>, sin separar el plano de adherencia. Se trata como <span class="k">T4b</span>.</p>
      <p><strong>Razón:</strong> aunque en más de un tercio de los casos la adherencia resulta ser inflamatoria y no tumoral, <strong>eso no se puede saber en el quirófano</strong>. Separar el plano abre el tumor, siembra el campo y <strong>empeora significativamente la supervivencia</strong>.</p>`,
   re:{q:"¿Y si son varios órganos?",a:`El principio no cambia: <strong>resección multivisceral en bloque</strong> siempre que se pueda lograr un <strong>R0</strong> y el paciente lo tolere. Si la resección R0 no es factible, es preferible no hacer una resección R2 heroica: se biopsia, se marca con clips y se plantea tratamiento sistémico neoadyuvante para reevaluar.`}},

  {dom:"tx",niv:2,q:"¿A quién le das adyuvancia en estadio II?",
   a:`<p>No a todos — sólo a los de <strong>alto riesgo</strong>, y siempre individualizando:</p>
      <ul><li><span class="k">T4</span> (IIB o IIC)</li>
      <li><strong>Menos de 12 ganglios</strong> examinados</li>
      <li>Tumor <strong>poco diferenciado</strong> (salvo MSI-H)</li>
      <li><strong>Invasión linfovascular o perineural</strong></li>
      <li><strong>Obstrucción o perforación</strong> al debut</li>
      <li>Márgenes positivos o indeterminados</li>
      <li>CEA que no normaliza tras la cirugía</li></ul>`,
   re:{q:"¿Y si ese estadio II es MSI-H?",a:`<strong>No se da 5-FU en monoterapia:</strong> no hay beneficio y hay señales de posible perjuicio. Además, el MSI-H de estadio II tiene <strong>mejor pronóstico de base</strong>, así que la mayoría se observan. Por eso hay que pedir <strong>MMR/MSI en todo estadio II</strong> antes de decidir la adyuvancia.`}},

  {dom:"tx",niv:2,q:"Estadio III. ¿Qué esquema y por cuánto tiempo?",
   a:`<p><strong>FOLFOX o CAPOX</strong> (fluoropirimidina + oxaliplatino), iniciando en <strong>6–8 semanas</strong> tras la cirugía.</p>
      <p><strong>Duración según el ensayo IDEA:</strong></p>
      <ul><li><strong>Riesgo bajo</strong> (T1-3 N1): <strong>3 meses de CAPOX</strong> — no inferior a 6 meses y con mucha menos neuropatía.</li>
      <li><strong>Riesgo alto</strong> (T4 o N2): <strong>6 meses</strong>, preferentemente FOLFOX.</li></ul>`,
   re:{q:"¿Qué toxicidad limita el oxaliplatino y cómo la vigilas?",a:`La <strong>neuropatía sensitiva periférica acumulativa</strong>, que puede ser permanente. Hay una forma <strong>aguda</strong> desencadenada por el frío (disestesia faringolaríngea, calambres) durante o poco después de la infusión, y una <strong>crónica</strong> dependiente de la dosis acumulada. Se vigila en cada ciclo con escalas de neurotoxicidad y se reduce o suspende el oxaliplatino manteniendo la fluoropirimidina. Ésa es justamente la lógica de los 3 meses del IDEA.`}},

  {dom:"tx",niv:3,q:"Metastásico, RAS mutado, tumor de colon derecho. ¿Qué le das y por qué no cetuximab?",
   a:`<p><strong>Doblete (FOLFOX o FOLFIRI) + bevacizumab.</strong></p>
      <p><strong>Por qué no cetuximab:</strong> el anti-EGFR bloquea el receptor <strong>por encima de RAS</strong> en la cascada de señalización. Si RAS porta una mutación activadora, la vía está encendida <strong>corriente abajo</strong> del punto de bloqueo y la señal llega al núcleo igual. Es un <strong>biomarcador predictivo negativo</strong>: no funciona menos, simplemente <strong>no funciona</strong>.</p>
      <p>Además, incluso con RAS nativo, los tumores <strong>derechos</strong> responden mal al anti-EGFR.</p>`,
   re:{q:"¿Qué toxicidades vigilas con bevacizumab?",a:`<strong>Hipertensión</strong> y <strong>proteinuria</strong> (control periódico), <strong>sangrado</strong>, <strong>tromboembolismo</strong>, <strong>perforación intestinal</strong> y <strong>mala cicatrización</strong>. Por esto último hay que <strong>suspenderlo al menos 6 semanas antes</strong> de una cirugía electiva y no reiniciarlo hasta 4 semanas después.`}},

  {dom:"tx",niv:2,q:"Metastásico dMMR/MSI-H. ¿Primera línea?",
   a:`<p><strong>Inmunoterapia: pembrolizumab.</strong> El ensayo <strong>KEYNOTE-177</strong> mostró que <strong>supera a la quimioterapia estándar</strong> en supervivencia libre de progresión, con mejor perfil de toxicidad. Alternativa: <strong>nivolumab ± ipilimumab</strong>.</p>
      <p><strong>Mecanismo:</strong> la deficiencia de reparación genera una <strong>carga mutacional altísima</strong> → muchos neoantígenos → el tumor es muy inmunogénico y responde al bloqueo de PD-1.</p>`,
   re:{q:"¿Qué proporción de los metastásicos son MSI-H?",a:`Sólo alrededor del <strong>4–5%</strong> — bastante menos que en enfermedad localizada (~15%), porque el MSI-H tiene menor tendencia a metastatizar. Aun siendo pocos, se pide <strong>en todos</strong>, porque para ese subgrupo cambia el tratamiento por completo.`}},

  {dom:"tx",niv:2,q:"Tres metástasis hepáticas en el lóbulo derecho. ¿Es operable?",
   a:`<p><strong>Sí, potencialmente curable.</strong> La metastasectomía hepática completa alcanza <strong>40–50% de supervivencia a 5 años</strong>.</p>
      <p><strong>El criterio moderno no es el número de lesiones</strong>, sino: que se pueda lograr una <strong>resección R0</strong> dejando un <strong>remanente hepático funcional suficiente</strong> (20–30%, más si hay quimioterapia previa o hepatopatía) con <strong>entrada vascular, drenaje venoso y drenaje biliar intactos</strong>, y que no haya enfermedad extrahepática irresecable.</p>`,
   re:{q:"¿Y si el remanente sería insuficiente?",a:`Se puede aumentar antes de operar: <strong>embolización portal</strong> del lado a resecar para hipertrofiar el remanente, <strong>hepatectomía en dos tiempos</strong>, <strong>ALPPS</strong>, o combinar resección con <strong>ablación</strong> por radiofrecuencia o microondas de las lesiones del lado que se conserva. También cabe <strong>quimioterapia de conversión</strong> para reducir las lesiones y hacerlas resecables.`}},

  {dom:"trampa",niv:2,q:"¿Cómo haces el seguimiento tras una resección curativa?",
   a:`<ul><li><strong>Historia, exploración y CEA cada 3–6 meses durante 3 años</strong>, luego cada 6 meses hasta completar <strong>5 años</strong>.</li>
      <li><strong>TC de tórax, abdomen y pelvis anual</strong> durante 5 años (cada 6–12 meses los primeros 3 años si es de alto riesgo).</li>
      <li><strong>Colonoscopia al año</strong> de la cirugía; si es normal, a los 3 años y luego cada 5.</li></ul>`,
   re:{q:"¿Y si la colonoscopia preoperatoria no se pudo completar por el tumor?",a:`Entonces la colonoscopia de control se adelanta a los <strong>3–6 meses después de la cirugía</strong>, no al año. El motivo es buscar <strong>lesiones sincrónicas</strong> —presentes en un 3–5% de los casos— que quedaron sin explorar por detrás de la obstrucción.`}},

  {dom:"trampa",niv:2,q:"Nombra tres errores conceptuales frecuentes en este tema.",
   a:`<ul><li>Decir que el <strong>CEA sirve para tamizaje</strong>. No sirve: es pronóstico y de seguimiento.</li>
      <li>Dar <strong>anti-EGFR con RAS mutado</strong>, o en un tumor de colon derecho.</li>
      <li>Dar <strong>5-FU en monoterapia a un estadio II MSI-H</strong>.</li>
      <li><strong>Separar el plano</strong> de un tumor adherido en vez de resecarlo en bloque.</li>
      <li>Olvidar la <strong>colonoscopia completa</strong> —preoperatoria o diferida— buscando lesiones sincrónicas.</li>
      <li>Hacer resección <strong>segmentaria</strong> en un paciente con Lynch en lugar de colectomía total.</li></ul>`,
   re:{q:"Y el más caro de todos, ¿cuál sería?",a:`No pedir <strong>MMR/MSI</strong>. Un solo estudio que cambia tres decisiones a la vez: identifica un <strong>Lynch</strong> (con consecuencias para la cirugía y para toda la familia), decide la <strong>adyuvancia del estadio II</strong>, y abre la <strong>inmunoterapia</strong> si hay enfermedad metastásica.`}}
  ]
},
endo:{
  eyebrow:"Tema 3 · Ginecología oncológica",
  titulo:"Cáncer de endometrio",
  dek:"Todo el tema se deduce de una sola frase: <strong>el estrógeno prolifera y la progesterona frena</strong>. Los factores de riesgo son situaciones de estrógeno sin oposición, el tratamiento conservador es progestágeno, y el tipo II es justamente el que se escapa de esa lógica. Encima de eso se ha montado en los últimos años la <strong>clasificación molecular</strong>, que ya forma parte de la estadificación FIGO 2023 y decide la adyuvancia — es lo más preguntable ahora mismo.",
  secciones:[
  {titulo:"Guion de 60 segundos", kicker:"Si sólo te da un minuto", html:`
    <h3>El esqueleto de la respuesta</h3>
    <ul>
      <li><strong>Es el cáncer ginecológico más frecuente</strong> en países desarrollados, y su incidencia sube por la obesidad.</li>
      <li><strong>Mecanismo dominante:</strong> estrógeno sin oposición de progesterona → hiperplasia → carcinoma endometrioide (tipo I).</li>
      <li><strong>Síntoma:</strong> <strong>sangrado uterino anormal</strong>; el 90% debutan con sangrado posmenopáusico. Es lo que permite diagnosticarlo precozmente — el 75% son estadio I.</li>
      <li><strong>Estudio:</strong> ecografía transvaginal (endometrio <strong>≤4 mm</strong> en posmenopáusica con sangrado tiene valor predictivo negativo muy alto) → <strong>biopsia endometrial</strong> → histeroscopia si persiste la duda.</li>
      <li><strong>Estadificación: quirúrgica.</strong> Histerectomía total + salpingooforectomía bilateral + <strong>ganglio centinela</strong>, por vía <strong>mínimamente invasiva</strong>.</li>
      <li><strong>La adyuvancia ya no se decide sólo por estadio y grado, sino por el grupo molecular:</strong> POLE se desescala, p53 anormal se escala.</li>
      <li><strong>Avanzado dMMR:</strong> quimioterapia + <strong>inmunoterapia</strong> en primera línea (RUBY, NRG-GY018). Es el cambio de práctica más importante de los últimos años.</li>
    </ul>
    <div class="box acc"><span class="lbl">Cómo abrir la respuesta</span>
      <p><em>"Es un tumor hormonodependiente en su forma más frecuente, así que los factores de riesgo, el tratamiento conservador y la prevención se explican todos por el balance estrógeno-progesterona. Lo que ha cambiado es que hoy la biología molecular pesa más que el grado histológico para decidir el tratamiento adyuvante."</em></p>
    </div>`},

  {titulo:"Anatomía quirúrgica", kicker:"Anatomía", html:`
    <h3>Irrigación y la relación que hay que saber sí o sí</h3>
    <p>La <strong>arteria uterina</strong> es rama de la división anterior de la <strong>arteria ilíaca interna (hipogástrica)</strong>. Llega por la base del ligamento ancho y <strong>cruza por encima del uréter</strong> a unos <strong>1.5–2 cm laterales al cuello uterino</strong>.</p>
    <div class="box acc"><span class="lbl">El puente y el agua</span>
      <p><strong>"El agua pasa por debajo del puente"</strong> — el <strong>uréter</strong> (agua) pasa <strong>por debajo</strong> de la <strong>arteria uterina</strong> (puente). Si te lo preguntan, añade el dato que lo hace útil: ese cruce está a <strong>1.5–2 cm del cuello</strong>, y es <strong>el punto donde más se lesiona el uréter</strong> al ligar la uterina.</p>
    </div>
    <p>La arteria uterina se anastomosa arriba con la <strong>arteria ovárica</strong>, que es rama <strong>directa de la aorta</strong> a la altura de L2 y viaja dentro del <strong>ligamento infundibulopélvico</strong>. Esa doble irrigación es lo que permite la embolización de miomas y explica la resistencia del útero a la isquemia.</p>

    <h4 class="sub">Dentro del endometrio</h4>
    <p>Arterias arcuatas (miometrio) → radiales → dos tipos terminales: <strong>arterias espirales</strong>, que irrigan la <strong>capa funcional</strong> y son <strong>sensibles a hormonas</strong>, y <strong>arterias basales</strong>, rectas, que irrigan la <strong>capa basal</strong> y no responden. Por eso se descama sólo la funcional: son las <strong>espirales</strong> las que sufren el vasoespasmo al caer la progesterona.</p>

    <h4 class="sub">Ligamentos — qué lleva cada uno</h4>
    <div class="tw"><table>
      <thead><tr><th>Ligamento</th><th>Contenido</th><th>Por qué importa</th></tr></thead>
      <tbody>
        <tr><td><strong>Infundibulopélvico</strong> (suspensorio del ovario)</td><td><strong>Vasos ováricos</strong> y linfáticos</td><td>Vía de drenaje directo a <strong>paraaórticos</strong>. El uréter corre justo debajo: sitio clásico de lesión al ligarlo.</td></tr>
        <tr><td><strong>Cardinal</strong> (Mackenrodt)</td><td><strong>Arteria uterina</strong> y el <strong>uréter</strong></td><td>Soporte principal del útero. Es el que se secciona en la histerectomía radical.</td></tr>
        <tr><td><strong>Redondo</strong></td><td>Arteria de Sampson</td><td>Del cuerno uterino al labio mayor por el conducto inguinal → <strong>drenaje linfático inguinal</strong>.</td></tr>
        <tr><td><strong>Uterosacro</strong></td><td>Fibras autonómicas</td><td>Soporte; sitio típico de implantes endometriósicos.</td></tr>
        <tr><td><strong>Ancho</strong></td><td>Mesometrio, mesosálpinx, mesovario</td><td>Pliegue peritoneal, no es soporte real.</td></tr>
        <tr><td><strong>Útero-ovárico</strong> (propio del ovario)</td><td>—</td><td>Une ovario y cuerno uterino; se secciona si se conservan los ovarios.</td></tr>
      </tbody>
    </table></div>
