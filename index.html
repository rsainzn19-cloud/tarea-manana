<title>Pase de visita — Coledocolitiasis · Colon · Endometrio</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#E7ECEA; --surface:#F8FAF9; --surface-2:#EFF3F1; --surface-3:#E1E8E5;
  --ink:#0E1E1B; --ink-2:#4A625D; --ink-3:#728984;
  --rule:#C6D2CE; --rule-2:#D9E2DF;
  --teal:#0A5B55; --teal-soft:#0a5b5514;
  --bile:#8F6109; --colon:#98263A; --endo:#67336C;
  --ok:#2C6E4E; --mid:#8E6412; --bad:#A5372C;
  --ok-bg:#2c6e4e14; --mid-bg:#8e641214; --bad-bg:#a5372c14;
  --shadow:0 1px 2px #0e1e1b0f, 0 8px 24px -12px #0e1e1b1f;
  --acc:var(--teal);

  --f-display:"Bahnschrift","Avenir Next Condensed","Franklin Gothic Medium","Helvetica Neue","Liberation Sans",Arial,sans-serif;
  --f-ui:"Avenir Next","Segoe UI","Helvetica Neue","Liberation Sans",Arial,sans-serif;
  --f-body:"Charter","Bitstream Charter",Constantia,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-data:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}

  :root:not([data-theme="light"]){
    --bg:#0B1513; --surface:#131F1D; --surface-2:#182724; --surface-3:#1F312D;
    --ink:#DEE8E4; --ink-2:#93ABA5; --ink-3:#6E8781;
    --rule:#263A36; --rule-2:#1E2F2C;
    --teal:#4CC0AE; --teal-soft:#4cc0ae1a;
    --bile:#E3A93A; --colon:#E8798A; --endo:#C495D0;
    --ok:#5FBF8F; --mid:#E0B24A; --bad:#F08475;
    --ok-bg:#5fbf8f1a; --mid-bg:#e0b24a1a; --bad-bg:#f084751a;
    --shadow:0 1px 2px #0006, 0 10px 28px -14px #000a;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1513; --surface:#131F1D; --surface-2:#182724; --surface-3:#1F312D;
  --ink:#DEE8E4; --ink-2:#93ABA5; --ink-3:#6E8781;
  --rule:#263A36; --rule-2:#1E2F2C;
  --teal:#4CC0AE; --teal-soft:#4cc0ae1a;
  --bile:#E3A93A; --colon:#E8798A; --endo:#C495D0;
  --ok:#5FBF8F; --mid:#E0B24A; --bad:#F08475;
  --ok-bg:#5fbf8f1a; --mid-bg:#e0b24a1a; --bad-bg:#f084751a;
  --shadow:0 1px 2px #0006, 0 10px 28px -14px #000a;
}
/* El acento sigue al tema activo, incluida la barra superior. Estos bloques van
   después de los de claro/oscuro para ganar el desempate de especificidad, y
   --acc-bg se deriva solo del acento ya resuelto para el tema en curso. */
:root[data-tema="bilis"]{--acc:var(--bile)}
:root[data-tema="colon"]{--acc:var(--colon)}
:root[data-tema="endo"]{--acc:var(--endo)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2.5px solid var(--acc); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============ BARRA DE COMANDO ============ */
.bar{

  border-bottom:1px solid var(--rule);
}

.tabs{display:flex;gap:0;flex:1;min-width:280px}
.tab{

  color:var(--ink-3);padding:0 15px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:color .15s
}
.tab:hover{color:var(--ink)}

.icobtn{

/* ============ LAYOUT ============ */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

.railnav{display:flex;flex-direction:column;border-left:1px solid var(--rule)}

.meters{display:flex;flex-direction:column;gap:9px}

.meter .track .s-ok{background:var(--ok)} .meter .track .s-mid{background:var(--mid)} .meter .track .s-bad{background:var(--bad)}

/* ============ ARTÍCULO ============ */

article{max-width:none}

section{padding-top:38px;scroll-margin-top:76px}

}

table .num{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Figuras */
figure{margin:22px 0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 18px 14px;box-shadow:var(--shadow)}
figure .svg-scroll{overflow-x:auto}

figcaption{font-family:var(--f-ui);font-size:12.5px;line-height:1.5;color:var(--ink-2);margin-top:12px;padding-top:11px;border-top:1px solid var(--rule-2)}
figcaption b{color:var(--ink)}
svg .fill-s{fill:var(--surface)} svg .fill-s2{fill:var(--surface-2)} svg .fill-acc{fill:var(--acc)}
svg .fill-none{fill:none}
svg .tube-o{stroke:currentColor;fill:none;stroke-width:32;opacity:.5;stroke-linecap:butt}
svg .tube-i{stroke:var(--surface-2);fill:none;stroke-width:29;stroke-linecap:butt}
svg .r-hi{stroke:var(--bad)} svg .r-hi-t{fill:var(--bad)}
svg .r-mid{stroke:var(--mid)} svg .r-mid-t{fill:var(--mid)}
svg .r-lo{stroke:var(--ok)} svg .r-lo-t{fill:var(--ok)}
svg .a-hi{stroke:var(--acc)} svg .dash{stroke-dasharray:5 4}

svg .t-lbl{font-size:13px}
svg .t-sm{font-size:11.5px;fill:var(--ink-3)}
svg .t-hd{font-size:13px;font-weight:700;fill:var(--ink)}
svg .t-acc{fill:var(--acc);font-size:12px;font-weight:700}

}
.pill.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}

.drill{max-width:860px;margin:0 auto;padding:26px 0 80px}

}

.card{
  background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column;min-height:400px
}
.card-hd{
  display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--rule-2);
  background:var(--surface-2);flex-wrap:wrap
}
.card-hd .dom{font-family:var(--f-data);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
.card-hd .sep{color:var(--ink-3);opacity:.5}
.card-hd .meta{font-family:var(--f-data);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}

.a{padding:0 30px 8px;border-top:1px solid var(--rule-2);margin-top:0}

<script>
/* =====================================================================
   DATOS
   ===================================================================== */
const DOM = {
  anat:"Anatomía", fisio:"Fisiología", fisiopat:"Fisiopatología",
  dx:"Diagnóstico", tx:"Tratamiento", trampa:"Trampa"
};

const TEMAS = {
bilis:{
  eyebrow:"Tema 1 · Vía biliar",
  titulo:"Coledocolitiasis",
  dek:"Todo el tema cuelga de una sola idea: <strong>un conducto que se obstruye por dentro</strong>. La anatomía explica por dónde llega el cálculo y por dónde lo sacas; la fisiología explica el patrón de laboratorio; y el tratamiento se decide con dos preguntas — <em>¿hay colangitis?</em> y <em>¿qué probabilidad tengo de que el cálculo siga ahí?</em>",
  secciones:[
  {titulo:"Guion de 60 segundos", kicker:"Si sólo te da un minuto", html:`
    <h3>La respuesta que resuelve el 80% de las preguntas</h3>
    <p>Coledocolitiasis es la presencia de cálculos en la vía biliar principal. En Occidente el <strong>85–90% son secundarios</strong>: cálculos de colesterol formados en la vesícula que migran por el cístico. Los <strong>primarios</strong> se forman <em>de novo</em> en el conducto, son de pigmento marrón, y aparecen donde hay <strong>estasis e infección</strong>.</p>
    <ul>
      <li><strong>Consecuencias posibles:</strong> ictericia obstructiva, <strong>colangitis</strong>, <strong>pancreatitis biliar</strong> y, si se cronifica, cirrosis biliar secundaria.</li>
      <li><strong>Laboratorio:</strong> patrón colestásico — <span class="k">↑FA</span>, <span class="k">↑GGT</span>, <span class="k">↑bilirrubina directa</span>.</li>
      <li><strong>Primer estudio:</strong> ecografía abdominal (buena para dilatación, mala para ver el cálculo).</li>
      <li><strong>Decisión:</strong> estratificar con los predictores <strong>ASGE 2019</strong> → alto riesgo va directo a CPRE; intermedio necesita USE o colangio-RM antes; bajo va a colecistectomía sin más estudio.</li>
      <li><strong>Tratamiento definitivo:</strong> despejar el conducto (CPRE con esfinterotomía, o exploración laparoscópica de la vía biliar) <strong>y quitar la vesícula</strong>, idealmente en el mismo ingreso.</li>
      <li><strong>Si hay colangitis:</strong> antibiótico + <strong>drenaje biliar</strong>. El antibiótico solo no cura una vía obstruida.</li>
    </ul>
    <div class="box acc"><span class="lbl">Cómo abrir la respuesta</span>
      <p>Cuando te pregunte "¿qué es la coledocolitiasis?", no empieces por la definición. Empieza por el marco: <em>"Es un problema de obstrucción de la vía biliar principal, y lo primero que hay que decidir es si hay colangitis, porque eso cambia el tiempo del tratamiento."</em> Eso te posiciona como alguien que piensa clínicamente, no como alguien que recita.</p>
    </div>`},

  {titulo:"Anatomía quirúrgica", kicker:"Anatomía", html:`
    <h3>El árbol biliar, segmento por segmento</h3>
    <p>Los conductos hepáticos derecho e izquierdo se unen en el hilio y forman el <strong>conducto hepático común</strong> (2–4 cm). Al recibir el <strong>conducto cístico</strong> pasa a llamarse <strong>colédoco</strong> (7–11 cm), que desciende por el borde libre del <strong>ligamento hepatoduodenal</strong> y termina en la papila mayor.</p>

    <h4 class="sub">Triángulo de Calot y triángulo hepatocístico</h4>
    <p>No son lo mismo, y ésta es una pregunta de trampa clásica:</p>
    <div class="tw"><table>
      <thead><tr><th>&nbsp;</th><th>Límites</th><th>Uso</th></tr></thead>
      <tbody>
        <tr><td><strong>Calot (original)</strong></td><td>Conducto cístico · conducto hepático común · <strong>arteria cística</strong></td><td>Descripción anatómica de 1891</td></tr>
        <tr><td><strong>Hepatocístico</strong></td><td>Conducto cístico · conducto hepático común · <strong>borde inferior del hígado</strong></td><td>El que se diseca en cirugía</td></tr>
      </tbody>
    </table></div>
    <p>Contenido: <strong>arteria cística</strong>, ganglio de Calot (o de Mascagni) y, en un porcentaje no despreciable, la <strong>arteria hepática derecha</strong> — de ahí el riesgo de lesión vascular.</p>

    <div class="box acc"><span class="lbl">Visión crítica de seguridad (Strasberg) — tres criterios</span>
      <ol>
        <li>Triángulo hepatocístico limpio de grasa y tejido fibroso.</li>
        <li>Tercio inferior de la vesícula separado del lecho hepático.</li>
        <li>Sólo <strong>dos</strong> estructuras entrando en la vesícula.</li>
      </ol>
      <p><strong>No</strong> incluye ver el colédoco. Si te preguntan "¿y el colédoco?", la respuesta correcta es que la visión crítica no exige identificarlo — de hecho intentar disecarlo aumenta el riesgo de lesión.</p>
    </div>

    <h4 class="sub">Irrigación del colédoco — la razón de las estenosis isquémicas</h4>
    <p>El colédoco se irriga por <strong>arterias axiales longitudinales que corren a las 3 y a las 9 del reloj</strong>. Vienen de dos fuentes: por arriba de la <strong>arteria cística</strong> y de la hepática derecha; por abajo de la <strong>pancreatoduodenal superior posterior</strong> y la gastroduodenal.</p>
    <p>El dato que hay que soltar: <strong>alrededor del 60% del flujo asciende desde abajo</strong>. Por eso una disección circunferencial o una ligadura alta desvasculariza el segmento proximal y produce <strong>estenosis isquémica tardía</strong> — el mecanismo detrás de muchas lesiones de vía biliar que se manifiestan meses después.</p>

    <h4 class="sub">Variantes que hay que nombrar</h4>
    <ul>
      <li><strong>Conductos de Luschka</strong> (subvesicales): drenan directo al lecho hepático; causa clásica de fuga biliar postcolecistectomía con colangiografía normal.</li>
      <li><strong>Conducto sectorial posterior derecho aberrante</strong> que desemboca en el cístico o en el hepático común bajo: el que se secciona creyendo que es el cístico.</li>
      <li><strong>Arteria hepática derecha en "joroba de oruga"</strong> (Moynihan): asa que se acerca al cuello vesicular y se confunde con la cística.</li>
      <li><strong>Válvulas espirales de Heister</strong> en el cístico: dificultan el paso del catéter en la colangiografía y de la canastilla en el abordaje transcístico.</li>
    </ul>
    <p><strong>Diámetro normal del colédoco: ≤6 mm.</strong> Se añade <span class="k">1 mm por década después de los 60 años</span>, y tras colecistectomía se acepta hasta <span class="k">10 mm</span>.</p>`},

  {titulo:"Fisiología biliar", kicker:"Fisiología", html:`
    <h3>Producción, reciclaje y concentración</h3>
    <p>El hígado produce <strong>600–1000 mL de bilis al día</strong>. Componentes: agua, sales biliares, fosfolípidos (lecitina), colesterol, bilirrubina conjugada y electrolitos.</p>

    <h4 class="sub">Ácidos biliares</h4>
    <ul>
      <li><strong>Primarios:</strong> cólico y quenodesoxicólico, sintetizados del colesterol. La enzima limitante es la <strong>7α-hidroxilasa (CYP7A1)</strong>.</li>
      <li><strong>Secundarios:</strong> desoxicólico y litocólico, producidos por <strong>7α-deshidroxilación bacteriana</strong> en el colon.</li>
      <li>Se conjugan con glicina y taurina para hacerse más hidrosolubles y formar micelas.</li>
    </ul>

    <div class="box acc"><span class="lbl">Circulación enterohepática — pregunta segura</span>
      <p>El pool de <strong>2–4 g</strong> recircula <strong>6–10 veces al día</strong>. Se reabsorbe el <strong>95%</strong>, sobre todo en el <strong>íleon terminal</strong> por un transportador sodio-dependiente (<span class="k">ASBT/IBAT</span>). Sólo se pierden 0.2–0.6 g/día en heces, que el hígado repone sintetizando. El control es por <strong>FXR → FGF19</strong>, que frena la CYP7A1.</p>
      <p><strong>Corolario clínico:</strong> tras una resección ileal o en la enfermedad de Crohn ileal se rompe el circuito → diarrea por ácidos biliares, malabsorción de grasa y vitaminas liposolubles, y <strong>mayor litogenicidad</strong> (cálculos de colesterol y de pigmento).</p>
    </div>

    <h4 class="sub">La vesícula</h4>
    <p>Capacidad 30–50 mL. <strong>Concentra la bilis 5–10 veces</strong> mediante absorción activa de sodio con arrastre de agua. La <strong>colecistocinina (CCK)</strong>, liberada por las células I del duodeno y yeyuno ante grasas y aminoácidos, produce <strong>contracción vesicular y relajación del esfínter de Oddi</strong>. En ayuno, la <strong>motilina</strong> genera vaciamientos parciales durante la fase III del complejo motor migratorio.</p>

    <h4 class="sub">Metabolismo de la bilirrubina</h4>
    <p>Hemo → <strong>biliverdina</strong> (hemo-oxigenasa) → <strong>bilirrubina no conjugada</strong> (biliverdina reductasa) → viaja unida a albúmina → captación hepática → <strong>conjugación con ácido glucurónico</strong> (UDP-glucuroniltransferasa) → <strong>excreción canalicular por MRP2</strong>, que es el <em>paso limitante</em> → en el intestino, bacterias la convierten en urobilinógeno → estercobilina (heces) y urobilina (orina).</p>
    <p>Porque el paso limitante es la excreción, cualquier obstrucción hace que la <strong>bilirrubina conjugada refluya a la sangre</strong>. Es hidrosoluble, así que se filtra en el riñón: <strong>coluria</strong>. Y como no llega al intestino: <strong>acolia</strong>. El prurito se atribuye a los ácidos biliares retenidos y a la vía autotaxina–ácido lisofosfatídico.</p>`},

  {titulo:"Fisiopatología", kicker:"Fisiopatología", html:`
    <h3>De dónde sale el cálculo</h3>
    <div class="tw"><table>
      <thead><tr><th>Tipo</th><th>Origen</th><th>Composición</th><th>Contexto</th></tr></thead>
      <tbody>
        <tr><td><strong>Secundarios</strong><br><span class="k">85–90%</span></td><td>Migran desde la vesícula</td><td>Colesterol o mixtos</td><td>Colelitiasis previa. Los pequeños son los que migran.</td></tr>
        <tr><td><strong>Primarios</strong></td><td>Se forman en la vía biliar</td><td>Pigmento <strong>marrón</strong> (bilirrubinato cálcico)</td><td><strong>Estasis + infección</strong>: estenosis, divertículo periampular, colangitis piógena recurrente, parásitos (<em>Clonorchis</em>, <em>Ascaris</em>)</td></tr>
        <tr><td><strong>Pigmento negro</strong></td><td>Vesícula</td><td>Bilirrubinato polimerizado</td><td>Hemólisis crónica, cirrosis, Crohn/resección ileal, nutrición parenteral</td></tr>
      </tbody>
    </table></div>

    <div class="box acc"><span class="lbl">El mecanismo que quiere oír</span>
      <p><strong>Cálculos de colesterol:</strong> se explican con el <strong>triángulo de Admirand-Small</strong> — la bilis se sobresatura cuando la relación entre colesterol, sales biliares y lecitina sale de la zona micelar. Se suman nucleación acelerada (mucina, glucoproteínas) e hipomotilidad vesicular.</p>
      <p><strong>Cálculos primarios de pigmento marrón:</strong> las bacterias (<em>E. coli</em>, <em>Klebsiella</em>) producen <strong>β-glucuronidasa</strong>, que <strong>desconjuga</strong> la bilirrubina; la bilirrubina no conjugada precipita con calcio como <strong>bilirrubinato cálcico</strong>. Por eso son cálculos blandos, terrosos, y por eso <strong>recurren</strong> si no corriges la estasis: si sólo sacas el cálculo y dejas la estenosis, vuelve.</p>
    </div>

    <h4 class="sub">Consecuencias — el árbol de complicaciones</h4>
    <ul>
      <li><strong>Ictericia obstructiva</strong> (a menudo fluctuante, porque el cálculo hace válvula).</li>
      <li><strong>Colangitis aguda:</strong> obstrucción + infección → aumento de la presión intraductal → <strong>reflujo colangiovenoso y colangiolinfático</strong> → bacteriemia y sepsis. Esta es la razón fisiopatológica de que el antibiótico solo no baste: si no bajas la presión, la bacteria sigue pasando a la sangre.</li>
      <li><strong>Pancreatitis biliar:</strong> teoría de Opie — obstrucción del canal común y/o reflujo, con activación intraacinar del tripsinógeno.</li>
      <li><strong>Cirrosis biliar secundaria</strong> si la obstrucción se cronifica.</li>
    </ul>`},

  {titulo:"Clínica y laboratorio", kicker:"Clínica", html:`
    <h3>Cómo se presenta</h3>
    <p>Hasta un <strong>10% son asintomáticas</strong>. Lo típico: dolor cólico en hipocondrio derecho o epigastrio, <strong>ictericia</strong>, <strong>coluria</strong> y <strong>acolia</strong>. Cuando se infecta:</p>
    <ul>
      <li><strong>Tríada de Charcot:</strong> fiebre + ictericia + dolor en hipocondrio derecho. Presente en la mitad a dos tercios de las colangitis — <strong>su ausencia no descarta</strong>.</li>
      <li><strong>Péntada de Reynolds:</strong> Charcot + <strong>hipotensión</strong> + <strong>alteración del estado mental</strong>. Indica colangitis supurativa y obliga a drenaje urgente.</li>
    </ul>

    <div class="box warn"><span class="lbl">Las tres trampas de laboratorio</span>
      <ul>
        <li><strong>Transaminasas &gt;1000 no descartan un cálculo.</strong> Durante el paso agudo pueden dispararse y simular una hepatitis viral, y caen en 24–48 h. Es un pico transitorio, mientras que la FA sube más tarde y baja más tarde.</li>
        <li><strong>Bilirrubina total &gt;10 mg/dL es rara en litiasis.</strong> Si la ves, piensa en obstrucción maligna.</li>
        <li><strong>Un colédoco no dilatado no descarta coledocolitiasis</strong> — hasta un tercio de los pacientes con cálculo tienen calibre normal, sobre todo si la obstrucción es aguda y el conducto aún no ha tenido tiempo de dilatarse.</li>
      </ul>
    </div>

    <p>La <strong>GGT</strong> sirve para confirmar que una fosfatasa alcalina elevada es de origen hepatobiliar y no óseo. La amilasa/lipasa elevadas junto a colestasis sugieren paso de cálculo con pancreatitis asociada.</p>

    <div class="box acc"><span class="lbl">Signo de Courvoisier</span>
      <p>Vesícula <strong>palpable y no dolorosa</strong> en un paciente ictérico sugiere obstrucción <strong>maligna</strong>, no litiásica. El razonamiento: en la coledocolitiasis crónica la vesícula está fibrosada por la inflamación de repetición y no puede distenderse. Es una regla con excepciones, no una ley.</p>
    </div>`},

  {titulo:"Diagnóstico y estratificación", kicker:"Diagnóstico", html:`

        <tr><td><strong>Ecografía abdominal</strong></td><td class="num">~20–50%</td><td>Primera línea. Excelente para colelitiasis y dilatación; mala para ver el cálculo en el colédoco distal (gas duodenal).</td></tr>

        <tr><td><strong>CPRE</strong></td><td class="num">&gt;95%</td><td><strong>Terapéutica, no diagnóstica.</strong> No se indica sólo para mirar: tiene 3–10% de pancreatitis.</td></tr>

      <figcaption><b>Predictores ASGE 2019.</b> La decisión no es "¿tiene cálculo?" sino "¿qué probabilidad hay de que siga ahí?" — porque la CPRE tiene un coste (3–10% de pancreatitis) que sólo se justifica con probabilidad alta. En el grupo intermedio, la colangiografía intraoperatoria con exploración laparoscópica es una alternativa igual de válida al USE o la colangio-RM, y resuelve todo en un solo tiempo quirúrgico.</figcaption>
    </figure>

    <div class="box warn"><span class="lbl">Qué cambió en la revisión de 2019</span>
      <ul>
        <li>Se <strong>eliminó la bilirrubina &gt;4 mg/dL como criterio aislado</strong> de alto riesgo: ahora exige <strong>colédoco dilatado además</strong>.</li>
        <li>Se <strong>quitó la pancreatitis biliar</strong> como predictor (paradójicamente indica que el cálculo ya pasó).</li>
        <li>Se eliminó la categoría "muy alto riesgo" y se simplificaron los criterios intermedios.</li>
      </ul>
      <p>Si te pregunta por qué se quitó la pancreatitis: porque la mayoría de los cálculos que la causan <strong>ya migraron al duodeno</strong> cuando el paciente llega, y hacer CPRE de rutina expone sin beneficio.</p>
    </div>`},

  {titulo:"Tratamiento", kicker:"Tratamiento", html:`
    <h3>Despejar el conducto</h3>
    <div class="box tx"><span class="lbl">Estándar</span>
      <p><strong>CPRE con esfinterotomía endoscópica y extracción con balón o canastilla de Dormia.</strong> Éxito del 90–95% en el primer intento. Después, <strong>colecistectomía</strong> — la vía despejada sin quitar la vesícula deja la fuente del problema.</p>
    </div>

    <h4 class="sub">Cuando el cálculo no sale (&gt;15 mm, impactado, en barril)</h4>
    <ol>
      <li><strong>Dilatación papilar con balón grande</strong> tras esfinterotomía (EPLBD).</li>
      <li><strong>Litotricia mecánica</strong> con canastilla reforzada.</li>
      <li><strong>Colangioscopia</strong> (SpyGlass) con <strong>litotricia electrohidráulica o láser</strong> bajo visión directa.</li>
      <li><strong>Prótesis biliar temporal</strong> para descomprimir y reintentar en semanas — el cálculo suele fragmentarse por el roce.</li>
      <li>Si falla el endoscopio: cirugía.</li>
    </ol>

    <h4 class="sub">Exploración quirúrgica de la vía biliar</h4>
    <div class="tw"><table>
      <thead><tr><th>Vía</th><th>Cuándo</th><th>Detalle</th></tr></thead>
      <tbody>
        <tr><td><strong>Transcística</strong></td><td>Cálculos <span class="k">&lt;8–9 mm</span>, distales, pocos, cístico permeable y de calibre suficiente</td><td>Menos invasiva, no requiere cierre del colédoco ni tubo en T.</td></tr>
        <tr><td><strong>Coledocotomía</strong></td><td>Cálculos grandes o proximales, múltiples, colédoco <span class="k">&gt;8 mm</span></td><td>Cierre primario sobre prótesis, o tubo en T (Kehr). Riesgo de estenosis si el conducto es fino.</td></tr>
      </tbody>
    </table></div>
    <p>Los metaanálisis muestran que el <strong>abordaje en un solo tiempo</strong> (colecistectomía + exploración de la vía biliar) tiene <strong>eficacia equivalente a CPRE + colecistectomía</strong> con menor estancia hospitalaria. La elección depende de la disponibilidad de endoscopia experta y de la experiencia del cirujano.</p>

    <h4 class="sub">Derivación biliodigestiva — cuándo ya no basta con vaciar</h4>
    <ul>
      <li><strong>Coledocoduodenostomía:</strong> requiere colédoco de <span class="k">≥1.5–2 cm</span> para que la boca sea amplia. Riesgo de "síndrome del sumidero" (acúmulo de detritus en el fondo de saco distal).</li>
      <li><strong>Hepaticoyeyunostomía en Y de Roux:</strong> de elección en litiasis primaria recurrente, estenosis, lesión de vía biliar y colédoco muy dilatado. Es la reconstrucción más fisiológica a largo plazo.</li>
      <li><strong>Esfinteroplastia transduodenal:</strong> cálculo impactado en la papila que no cede.</li>
    </ul>
    <p><strong>Principio:</strong> si el problema es <em>estasis</em> (no sólo el cálculo), hay que derivar. Vaciar sin corregir la causa garantiza la recidiva.</p>

    <div class="box warn"><span class="lbl">Prevención de la pancreatitis post-CPRE — casi seguro que te lo pregunta</span>
      <ul>
        <li><strong>AINE rectal:</strong> indometacina o diclofenaco <span class="k">100 mg</span> peri-procedimiento. Es la medida con mejor evidencia.</li>
        <li><strong>Hidratación agresiva con Ringer lactato.</strong></li>
        <li><strong>Prótesis pancreática profiláctica</strong> si hubo canulación difícil o pancreatografía inadvertida.</li>
        <li>Canulación guiada por guía, evitando inyecciones repetidas.</li>
      </ul>
      <p><strong>Factores de riesgo:</strong> mujer joven, disfunción del esfínter de Oddi, <strong>bilirrubina normal</strong>, ausencia de pancreatitis crónica, canulación difícil, pancreatografía, esfinterotomía precortada.</p>
    </div>

    <h4 class="sub">Pancreatitis biliar — la pregunta con trampa</h4>
    <p><strong>La CPRE urgente (&lt;24 h) sólo se indica si hay colangitis concomitante u obstrucción biliar persistente.</strong> El ensayo <strong>APEC (2020)</strong> mostró que la CPRE urgente de rutina en pancreatitis biliar predicha grave <em>sin</em> colangitis <strong>no reduce mortalidad ni complicaciones</strong>.</p>
    <p>En cambio, la <strong>colecistectomía en el mismo ingreso</strong> en pancreatitis biliar leve sí está demostrada: el ensayo <strong>PONCHO</strong> mostró reducción significativa de recurrencias frente a diferirla. En pancreatitis grave con colecciones, se difiere hasta que se resuelvan.</p>`},

  {titulo:"Colangitis aguda", kicker:"Urgencia", html:`
    <h3>Tokyo Guidelines 2018 (TG18)</h3>
    <h4 class="sub">Diagnóstico — tres bloques</h4>
    <div class="tw"><table>
      <thead><tr><th>&nbsp;</th><th>Bloque</th><th>Contenido</th></tr></thead>
      <tbody>
        <tr><td><strong>A</strong></td><td>Inflamación sistémica</td><td>Fiebre y/o escalofríos; leucocitosis o leucopenia; PCR elevada</td></tr>
        <tr><td><strong>B</strong></td><td>Colestasis</td><td>Ictericia; pruebas hepáticas alteradas</td></tr>
        <tr><td><strong>C</strong></td><td>Imagen</td><td>Dilatación biliar; evidencia de la causa (cálculo, estenosis, prótesis)</td></tr>
      </tbody>
    </table></div>
    <p><strong>Sospecha</strong> = A + (B o C). &nbsp;<strong>Diagnóstico definitivo</strong> = A + B + C.</p>

    <h4 class="sub">Severidad — determina el tiempo del drenaje</h4>
    <div class="tw"><table>
      <thead><tr><th>Grado</th><th>Definición</th><th>Conducta</th></tr></thead>
      <tbody>
        <tr><td><strong>III · Grave</strong></td><td>Disfunción de <strong>al menos un órgano</strong>: cardiovascular (necesita vasopresores), neurológica, respiratoria (PaO₂/FiO₂ &lt;300), renal (Cr &gt;2 mg/dL u oliguria), hepática (INR &gt;1.5), hematológica (plaquetas &lt;100 000)</td><td><strong>Drenaje urgente</strong> + soporte en UCI + antibiótico</td></tr>
        <tr><td><strong>II · Moderada</strong></td><td><strong>Dos</strong> de: leucocitos &gt;12 000 o &lt;4000 · fiebre ≥39 °C · edad ≥75 años · bilirrubina ≥5 mg/dL · hipoalbuminemia</td><td><strong>Drenaje temprano</strong> (idealmente &lt;24 h, no más de 48 h)</td></tr>
        <tr><td><strong>I · Leve</strong></td><td>No cumple criterios de II ni III</td><td>Antibiótico; drenaje si no responde en 24 h o electivo</td></tr>
      </tbody>
    </table></div>

    <div class="box tx"><span class="lbl">La frase que quiere oír</span>
      <p><strong>"El tratamiento definitivo de la colangitis es el drenaje biliar; el antibiótico es soporte."</strong> Y el razonamiento fisiopatológico: mientras la presión intraductal permanezca elevada, el reflujo colangiovenoso sigue sembrando bacterias en la sangre y el antibiótico no alcanza concentraciones útiles en una bilis estancada.</p>
    </div>

    <h4 class="sub">Cómo drenar, en orden de preferencia</h4>
    <ol>
      <li><strong>CPRE</strong> con esfinterotomía y extracción, o colocación de prótesis/catéter nasobiliar si el paciente está inestable. Es la vía de elección.</li>
      <li><strong>Drenaje transhepático percutáneo (PTBD)</strong> si la CPRE falla o hay anatomía alterada (Y de Roux, gastrectomía).</li>
      <li><strong>Drenaje guiado por USE</strong> en centros con experiencia.</li>
      <li><strong>Cirugía:</strong> último recurso. En el paciente séptico se hace <strong>sólo coledocotomía con tubo en T</strong> — <em>nunca</em> una reconstrucción definitiva en un paciente inestable.</li>
    </ol>

    <h4 class="sub">Antibióticos</h4>
    <p>Cubrir <strong>enterobacterias</strong> (<em>E. coli</em>, <em>Klebsiella</em>, <em>Enterobacter</em>) y, según gravedad y factores de riesgo, enterococo y anaerobios.</p>
    <ul>
      <li><strong>Adquirida en comunidad, leve-moderada:</strong> ceftriaxona + metronidazol, o piperacilina-tazobactam.</li>
      <li><strong>Grave o nosocomial, riesgo de BLEE, prótesis previa:</strong> carbapenémico (meropenem, ertapenem) ± cobertura de enterococo.</li>
      <li><strong>Duración:</strong> 4–7 días desde el control del foco. Si hay bacteriemia por grampositivos (enterococo, estreptococo), <strong>2 semanas</strong>.</li>
      <li>Tomar <strong>hemocultivos y cultivo de bilis</strong> durante el drenaje.</li>
    </ul>`},

  {titulo:"Escenarios especiales", kicker:"Trampas", html:`
    <h3>Síndrome de Mirizzi</h3>
    <p>Compresión extrínseca del conducto hepático común por un <strong>cálculo impactado en el bacinete o en el cístico</strong>, con inflamación crónica que puede erosionar y crear una fístula colecistobiliar.</p>
    <div class="tw"><table>
      <thead><tr><th>Csendes</th><th>Hallazgo</th><th>Manejo</th></tr></thead>
      <tbody>
        <tr><td><strong>I</strong></td><td>Compresión externa, sin fístula</td><td>Colecistectomía (a menudo <strong>subtotal</strong>, dejando la placa posterior)</td></tr>
        <tr><td><strong>II</strong></td><td>Fístula &lt;⅓ de la circunferencia</td><td>Cierre con colgajo de vesícula o sutura sobre tubo en T</td></tr>
        <tr><td><strong>III</strong></td><td>Fístula hasta ⅔</td><td>Coledocoplastia o hepaticoyeyunostomía</td></tr>
        <tr><td><strong>IV</strong></td><td>Destrucción completa de la pared</td><td><strong>Hepaticoyeyunostomía en Y de Roux</strong></td></tr>
        <tr><td><strong>V</strong></td><td>Fístula colecistoentérica (Va sin íleo biliar, Vb con íleo biliar)</td><td>Reparación + tratamiento de la fístula entérica</td></tr>
      </tbody>
    </table></div>
    <p><strong>Lo importante:</strong> es la situación con mayor riesgo de <strong>lesión de vía biliar</strong> y de conversión. La conducta correcta ante la duda es <strong>colecistectomía subtotal</strong> o conversión, no insistir laparoscópicamente. Además, hasta un 5–28% asocian <strong>cáncer de vesícula</strong>.</p>

    <h3>Coledocolitiasis en el embarazo</h3>
    <ul>
      <li>La <strong>CPRE es segura</strong> con protección abdominal, mínima o nula fluoroscopia (canulación guiada por aspiración de bilis o por USE), preferentemente en el segundo trimestre.</li>
      <li>La <strong>colecistectomía laparoscópica</strong> se puede hacer en cualquier trimestre, siendo el segundo el ideal; retrasarla aumenta recurrencias, ingresos y pérdida fetal.</li>
      <li>La <strong>colangio-RM sin gadolinio</strong> es el estudio de imagen de elección para confirmar.</li>
    </ul>

    <h3>Íleo biliar</h3>
    <p>Cálculo grande que erosiona hacia el duodeno por una fístula colecistoentérica y obstruye típicamente en el <strong>íleon terminal</strong>. <strong>Tríada de Rigler</strong> en la imagen: neumobilia + obstrucción intestinal + cálculo ectópico. Tratamiento: <strong>enterolitotomía</strong>; la colecistectomía y el cierre de la fístula se difieren salvo que el paciente esté estable y el campo lo permita.</p>

    <div class="box warn"><span class="lbl">Las frases que te pueden hundir</span>
      <ul>
        <li>Decir que la CPRE es el estudio diagnóstico de elección. <strong>Es terapéutica.</strong></li>
        <li>Decir que la visión crítica de seguridad exige identificar el colédoco. <strong>No lo exige.</strong></li>
        <li>Dar antibiótico y esperar en una colangitis grave. <strong>Se drena.</strong></li>
        <li>Indicar CPRE urgente a toda pancreatitis biliar. <strong>Sólo si hay colangitis u obstrucción persistente.</strong></li>
        <li>Mandar al paciente a casa tras la CPRE sin programar la colecistectomía.</li>
      </ul>
    </div>`}
  ],
  preguntas:[
  {dom:"anat",niv:2,q:"¿Cuáles son los límites del triángulo hepatocístico y qué contiene?",
   a:`<p><strong>Límites:</strong> conducto cístico (lateral), conducto hepático común (medial) y <strong>borde inferior del hígado</strong> (superior).</p>
      <p><strong>Contenido:</strong> arteria cística, ganglio de Calot o de Mascagni, y con frecuencia la <strong>arteria hepática derecha</strong>.</p>
      <p>El <strong>triángulo de Calot original</strong> es distinto: su límite superior es la <strong>arteria cística</strong>, no el hígado. El que se diseca en cirugía es el hepatocístico.</p>`,
   re:{q:"¿Y qué es la visión crítica de seguridad?",a:`Tres criterios de Strasberg: <strong>(1)</strong> triángulo hepatocístico libre de grasa y fibrosis, <strong>(2)</strong> tercio inferior de la vesícula separado del lecho hepático, <strong>(3)</strong> sólo <strong>dos estructuras</strong> entrando en la vesícula. <strong>No incluye ver el colédoco</strong> — buscarlo aumenta el riesgo de lesionarlo.`}},

  {dom:"anat",niv:2,q:"¿Cuáles son las cuatro porciones del colédoco?",
   a:`<ol><li><strong>Supraduodenal</strong> — en el borde libre del ligamento hepatoduodenal.</li>
      <li><strong>Retroduodenal</strong> — por detrás de la primera porción del duodeno.</li>
      <li><strong>Intrapancreática</strong> — en un surco de la cabeza del páncreas.</li>
      <li><strong>Intramural o intraduodenal</strong> — atraviesa la pared y termina en la ampolla de Vater.</li></ol>`,
   re:{q:"¿Cuál abres en una coledocotomía y por qué?",a:`La <strong>supraduodenal</strong>: es la única libre en el ligamento hepatoduodenal, accesible sin movilizar nada. Para llegar a la retroduodenal habría que hacer una <strong>maniobra de Kocher</strong>, y la intrapancreática e intramural no son abordables quirúrgicamente de forma segura.`}},

  {dom:"anat",niv:3,q:"¿Cómo se irriga el colédoco y qué consecuencia quirúrgica tiene?",
   a:`<p>Por <strong>arterias axiales longitudinales que corren a las 3 y a las 9 del reloj</strong>. Provienen de la arteria cística y la hepática derecha por arriba, y de la <strong>pancreatoduodenal superior posterior</strong> y la gastroduodenal por abajo.</p>
      <p><strong>El 60% del flujo asciende desde abajo.</strong></p>`,
   re:{q:"¿Por qué una lesión alta se estenosa meses después?",a:`Porque al disecar circunferencialmente o ligar alto se interrumpe el aporte axial ascendente, y el segmento proximal queda <strong>desvascularizado</strong>. La isquemia produce fibrosis progresiva: la <strong>estenosis isquémica tardía</strong> aparece semanas o meses después, con una anastomosis que técnicamente parecía perfecta.`}},

  {dom:"anat",niv:1,q:"¿Cuál es el diámetro normal del colédoco y cómo se ajusta?",
   a:`<p><strong>≤6 mm</strong> en el adulto. Se suma <strong>1 mm por cada década después de los 60 años</strong>. Tras colecistectomía se acepta hasta <strong>10 mm</strong>, porque el conducto asume la función de reservorio.</p>`,
   re:{q:"¿Un colédoco normal descarta coledocolitiasis?",a:`<strong>No.</strong> Hasta un tercio de los pacientes con cálculo tienen calibre normal, sobre todo en la obstrucción aguda, donde el conducto no ha tenido tiempo de dilatarse. Por eso la dilatación es un <em>predictor</em>, no un criterio de exclusión.`}},

  {dom:"anat",niv:3,q:"Nombra tres variantes anatómicas que aumentan el riesgo de lesión de vía biliar.",
   a:`<ul><li><strong>Conductos de Luschka</strong> (subvesicales): drenan al lecho hepático; causa de fuga biliar postoperatoria con colangiografía normal.</li>
      <li><strong>Conducto sectorial posterior derecho aberrante</strong> que desemboca en el cístico: se secciona creyendo que es el cístico.</li>
      <li><strong>Arteria hepática derecha en "joroba de oruga" de Moynihan</strong>: asa que se aproxima al cuello vesicular y se confunde con la cística.</li>
      <li>Cístico corto, paralelo o de inserción baja/medial.</li></ul>`,
   re:{q:"¿Qué haces si sospechas un conducto aberrante durante la cirugía?",a:`<strong>Detenerte y hacer una colangiografía intraoperatoria</strong> antes de cortar nada. Si persiste la duda: convertir a abierta o hacer una <strong>colecistectomía subtotal</strong>. La regla es no seccionar ninguna estructura tubular hasta tener la visión crítica.`}},

  {dom:"fisio",niv:2,q:"Explica la circulación enterohepática de las sales biliares.",
   a:`<p>Pool de <strong>2–4 g</strong> que recircula <strong>6–10 veces al día</strong>. Se reabsorbe el <strong>95%</strong>, principalmente en el <strong>íleon terminal</strong> por el transportador sodio-dependiente <span class="k">ASBT</span>; vuelve al hígado por la porta. Sólo se pierden 0.2–0.6 g/día en heces, que el hígado repone por síntesis <em>de novo</em>.</p>
      <p>El control es por <strong>FXR</strong> en el enterocito → <strong>FGF19</strong> → inhibe la <strong>7α-hidroxilasa (CYP7A1)</strong>, la enzima limitante.</p>`,
   re:{q:"¿Qué pasa tras una resección ileal extensa?",a:`Se pierde la reabsorción: los ácidos biliares llegan al colon y producen <strong>diarrea colerética</strong>; el pool cae y aparece <strong>malabsorción de grasa</strong> y de vitaminas liposolubles. Además aumenta la litogenicidad — más cálculos de colesterol y de pigmento — y el exceso de oxalato absorbido causa <strong>litiasis renal por oxalato</strong>.`}},

  {dom:"fisio",niv:1,q:"¿Qué estimula la contracción de la vesícula biliar?",
   a:`<p>La <strong>colecistocinina (CCK)</strong>, liberada por las <strong>células I del duodeno y yeyuno</strong> en respuesta a grasas y aminoácidos. Produce simultáneamente <strong>contracción vesicular y relajación del esfínter de Oddi</strong>.</p>
      <p>Contribuyen también el estímulo vagal y, en ayuno, la <strong>motilina</strong> durante la fase III del complejo motor migratorio.</p>`,
   re:{q:"¿Cuánto concentra la vesícula la bilis y cómo?",a:`<strong>5 a 10 veces</strong>, mediante absorción activa de <strong>sodio</strong> por el epitelio con arrastre osmótico de agua. Su capacidad es de 30–50 mL, pero almacena el equivalente a varias horas de producción hepática.`}},

  {dom:"fisio",niv:2,q:"Describe el metabolismo de la bilirrubina y explica el patrón de la ictericia obstructiva.",
   a:`<p>Hemo → <strong>biliverdina</strong> (hemo-oxigenasa) → <strong>bilirrubina no conjugada</strong> (biliverdina reductasa) → transporte unida a albúmina → captación hepática → <strong>conjugación con ácido glucurónico</strong> (UDP-glucuroniltransferasa) → <strong>excreción canalicular por MRP2</strong>, que es el <strong>paso limitante</strong>.</p>
      <p>En la obstrucción, la bilirrubina <strong>ya conjugada</strong> no puede salir y refluye a la sangre: predomina la <strong>directa</strong>. Al ser hidrosoluble se filtra en el riñón → <strong>coluria</strong>. Al no llegar al intestino no se forma estercobilina → <strong>acolia</strong>.</p>`,
   re:{q:"¿Por qué pica el paciente colestásico?",a:`Clásicamente se atribuye al depósito de <strong>ácidos biliares</strong> en la piel, pero la explicación actual apunta a la vía <strong>autotaxina–ácido lisofosfatídico</strong>, cuya actividad correlaciona con la intensidad del prurito mejor que los niveles de sales biliares. Por eso responde a <strong>rifampicina</strong> y a secuestradores como la colestiramina.`}},

  {dom:"fisiopat",niv:2,q:"Diferencia cálculos primarios de secundarios en la vía biliar.",
   a:`<p><strong>Secundarios (85–90% en Occidente):</strong> se formaron en la <strong>vesícula</strong> y migraron por el cístico. Son de colesterol o mixtos, duros y facetados. Se curan quitando la vesícula.</p>
      <p><strong>Primarios:</strong> se forman <em>de novo</em> en la vía biliar. Son de <strong>pigmento marrón</strong> (bilirrubinato cálcico), blandos y terrosos. Requieren <strong>estasis + infección</strong>: estenosis, divertículo periampular, colangitis piógena recurrente, parásitos.</p>`,
   re:{q:"¿Qué papel juega la β-glucuronidasa bacteriana?",a:`Las bacterias (<em>E. coli</em>, <em>Klebsiella</em>) producen <strong>β-glucuronidasa</strong>, que <strong>desconjuga la bilirrubina</strong>. La bilirrubina no conjugada es insoluble y <strong>precipita con calcio</strong> formando bilirrubinato cálcico. Ésa es la razón de que los cálculos primarios <strong>recidiven</strong> si no se corrige la estasis: sacarlos sin derivar el conducto no elimina el mecanismo.`}},

  {dom:"fisiopat",niv:2,q:"¿Cómo se forman los cálculos de colesterol?",
   a:`<p>Por <strong>sobresaturación de la bilis</strong> — se explica con el <strong>triángulo de Admirand-Small</strong>, que relaciona colesterol, sales biliares y lecitina: cuando la proporción sale de la zona de solubilidad micelar, el colesterol precipita.</p>
      <p>Se suman dos factores: <strong>nucleación acelerada</strong> (mucina y glucoproteínas pronucleantes) e <strong>hipomotilidad vesicular</strong>.</p>
      <p>Factores de riesgo clásicos — las cuatro F: <em>female, forty, fertile, fat</em>; además pérdida rápida de peso, nutrición parenteral, embarazo, ceftriaxona, octreótide.</p>`,
   re:{q:"¿Y los cálculos de pigmento negro?",a:`Bilirrubinato cálcico polimerizado, se forman <strong>en la vesícula</strong> por exceso de bilirrubina no conjugada. Contextos: <strong>hemólisis crónica</strong> (esferocitosis, drepanocitosis, prótesis valvulares), <strong>cirrosis</strong>, <strong>enfermedad de Crohn o resección ileal</strong> y nutrición parenteral prolongada.`}},

  {dom:"dx",niv:1,q:"¿Qué patrón de laboratorio esperas y cuál es la trampa?",
   a:`<p><strong>Patrón colestásico:</strong> ↑ fosfatasa alcalina, ↑ GGT, ↑ bilirrubina <strong>directa</strong>, ↑ 5'-nucleotidasa.</p>
      <p><strong>La trampa:</strong> durante el paso agudo del cálculo las <strong>transaminasas pueden superar 1000 U/L</strong> y simular una hepatitis viral. Caen en 24–48 h. La FA, en cambio, sube más tarde y desciende más lentamente.</p>`,
   re:{q:"¿Y si la bilirrubina está en 15 mg/dL?",a:`Cifras <strong>&gt;10 mg/dL son raras en la coledocolitiasis</strong> porque la obstrucción litiásica suele ser intermitente. Ante ese valor hay que pensar en <strong>obstrucción maligna</strong> — colangiocarcinoma, tumor periampular, cáncer de cabeza de páncreas — o en hepatopatía asociada.`}},

  {dom:"dx",niv:3,q:"Enumera los criterios de ALTO riesgo de coledocolitiasis según ASGE 2019.",
   a:`<ol><li><strong>Cálculo visible en el colédoco</strong> por ecografía, TC o RM.</li>
      <li><strong>Colangitis aguda</strong> clínica.</li>
      <li><strong>Bilirrubina total &gt;4 mg/dL</strong> <em>Y</em> <strong>colédoco dilatado</strong>.</li></ol>
      <p><strong>Conducta:</strong> CPRE directa, sin estudio de confirmación previo.</p>`,
   re:{q:"¿Qué cambió respecto a la versión anterior?",a:`Tres cosas: <strong>(1)</strong> la bilirrubina &gt;4 mg/dL <strong>dejó de ser criterio aislado</strong> — ahora exige colédoco dilatado; <strong>(2)</strong> se <strong>eliminó la pancreatitis biliar</strong> como predictor, porque generalmente indica que el cálculo <em>ya migró</em>; <strong>(3)</strong> desapareció la categoría de "muy alto riesgo".`}},

  {dom:"dx",niv:2,q:"Paciente con colelitiasis, PFH alteradas y colédoco de 8 mm, bilirrubina 2.5. ¿Qué haces?",
   a:`<p>Es <strong>riesgo intermedio</strong>. No se va directo a CPRE, porque la probabilidad no justifica un 3–10% de pancreatitis post-procedimiento.</p>
      <p><strong>Opciones válidas:</strong></p>
      <ul><li><strong>USE</strong> (mejor rendimiento en cálculos pequeños, permite pasar a CPRE en el mismo acto).</li>
      <li><strong>Colangio-RM.</strong></li>
      <li><strong>Colecistectomía con colangiografía intraoperatoria</strong> ± exploración laparoscópica de la vía biliar — resuelve todo en un solo tiempo.</li></ul>`,
   re:{q:"¿Cuál eliges si el paciente ya está programado para cirugía?",a:`La <strong>colangiografía intraoperatoria con exploración de la vía biliar</strong>: evita un procedimiento adicional, evita la esfinterotomía (que deja el esfínter incompetente de por vida) y los metaanálisis muestran <strong>eficacia equivalente con menor estancia hospitalaria</strong> frente a CPRE + colecistectomía.`}},

  {dom:"dx",niv:2,q:"¿Por qué la CPRE no es el estudio diagnóstico de elección?",
   a:`<p>Porque es un procedimiento <strong>terapéutico</strong> con morbilidad real: <strong>pancreatitis post-CPRE 3–10%</strong>, además de hemorragia, perforación y colangitis.</p>
      <p>Sólo se indica cuando la probabilidad pretest es lo bastante alta para que el beneficio terapéutico compense el riesgo — es decir, en el grupo de <strong>alto riesgo</strong> o cuando otro estudio ya confirmó el cálculo.</p>`,
   re:{q:"Compara sensibilidad de eco, colangio-RM y USE.",a:`<strong>Ecografía ~20–50%</strong> para ver el cálculo (limitada por el gas duodenal en el colédoco distal), aunque buena para dilatación y colelitiasis. <strong>Colangio-RM ~90%</strong>, con caída importante en cálculos <strong>&lt;5 mm</strong>. <strong>USE &gt;95%</strong>, el mejor para cálculos pequeños y microlitiasis.`}},

  {dom:"tx",niv:1,q:"¿Cuál es el tratamiento estándar de la coledocolitiasis?",
   a:`<p><strong>CPRE con esfinterotomía endoscópica y extracción con balón o canastilla de Dormia</strong>, con éxito del 90–95%.</p>
      <p>Y — la parte que se olvida — <strong>colecistectomía posterior</strong>, idealmente en el mismo ingreso. Despejar la vía sin quitar la vesícula deja la fuente del problema.</p>`,
   re:{q:"¿Y si el cálculo mide 2 cm y no sale?",a:`Escalada: <strong>(1)</strong> dilatación papilar con balón grande tras esfinterotomía (EPLBD); <strong>(2)</strong> litotricia mecánica; <strong>(3)</strong> <strong>colangioscopia</strong> con litotricia electrohidráulica o láser bajo visión directa; <strong>(4)</strong> prótesis biliar temporal para descomprimir y reintentar en semanas — el roce suele fragmentarlo; <strong>(5)</strong> cirugía.`}},

  {dom:"tx",niv:2,q:"Exploración laparoscópica de la vía biliar: ¿transcística o coledocotomía?",
   a:`<p><strong>Transcística</strong> — cálculos <strong>&lt;8–9 mm</strong>, distales, pocos, con cístico permeable y de calibre suficiente. Ventaja: no hay que abrir ni cerrar el colédoco, ni dejar tubo en T.</p>
      <p><strong>Coledocotomía</strong> — cálculos grandes, múltiples o proximales, y colédoco <strong>&gt;8 mm</strong>. Se cierra de forma primaria sobre prótesis, o sobre tubo en T (Kehr).</p>
      <p><strong>Nunca hagas coledocotomía en un colédoco fino:</strong> el cierre estenosa.</p>`,
   re:{q:"¿Un tiempo o dos tiempos?",a:`Los metaanálisis muestran <strong>eficacia equivalente</strong> entre el abordaje en un tiempo (colecistectomía + exploración) y el de dos tiempos (CPRE + colecistectomía), con <strong>menor estancia hospitalaria</strong> para el de un tiempo. La elección real depende de la disponibilidad de endoscopia experta y de la experiencia del cirujano con la vía biliar.`}},

  {dom:"tx",niv:3,q:"¿Cuándo indicas una derivación biliodigestiva?",
   a:`<ul><li><strong>Litiasis primaria recurrente</strong> (el conducto sigue generando cálculos).</li>
      <li><strong>Estenosis</strong> benigna o lesión de vía biliar.</li>
      <li><strong>Colédoco muy dilatado</strong> con vaciamiento deficiente.</li>
      <li>Imposibilidad de extraer todos los cálculos.</li></ul>
      <p><strong>Opciones:</strong> coledocoduodenostomía (requiere colédoco ≥1.5–2 cm) o <strong>hepaticoyeyunostomía en Y de Roux</strong>, que es la de elección a largo plazo.</p>`,
   re:{q:"¿Qué es el síndrome del sumidero?",a:`Complicación de la <strong>coledocoduodenostomía</strong>: el segmento de colédoco distal a la anastomosis queda como fondo de saco ciego donde se acumulan detritus, comida y cálculos, produciendo dolor, colangitis de repetición o pancreatitis. Es una de las razones por las que se prefiere la <strong>Y de Roux</strong>.`}},

  {dom:"tx",niv:2,q:"¿Cómo se diagnostica y gradúa una colangitis aguda según Tokyo 2018?",
   a:`<p><strong>Diagnóstico — tres bloques:</strong> <strong>A</strong> inflamación sistémica (fiebre/escalofríos, leucocitosis o leucopenia, PCR), <strong>B</strong> colestasis (ictericia, PFH alteradas), <strong>C</strong> imagen (dilatación o causa demostrada).</p>
      <p><strong>Sospecha</strong> = A + (B o C). &nbsp;<strong>Definitivo</strong> = A + B + C.</p>
      <p><strong>Grado III</strong> — disfunción de al menos un órgano. <strong>Grado II</strong> — dos de: leucocitos &gt;12 000 o &lt;4000, fiebre ≥39 °C, edad ≥75, bilirrubina ≥5, hipoalbuminemia. <strong>Grado I</strong> — el resto.</p>`,
   re:{q:"¿En cuánto tiempo hay que drenar cada grado?",a:`<strong>Grado III: drenaje urgente</strong>, en cuanto se estabilice mínimamente, junto con soporte en UCI. <strong>Grado II: drenaje temprano</strong>, idealmente en menos de 24 h y no más allá de 48 h. <strong>Grado I:</strong> antibiótico y drenaje electivo, o urgente si no responde en 24 h.`}},

  {dom:"tx",niv:2,q:"Colangitis grave que no mejora con antibiótico. ¿Por qué y qué haces?",
   a:`<p><strong>Porque el tratamiento definitivo de la colangitis es el drenaje, no el antibiótico.</strong> Mientras la presión intraductal siga elevada, el <strong>reflujo colangiovenoso y colangiolinfático</strong> sigue sembrando bacterias en la sangre, y el antibiótico no alcanza concentraciones útiles en una bilis estancada.</p>
      <p><strong>Conducta:</strong> drenaje biliar urgente. Orden de preferencia: <strong>CPRE</strong> → <strong>drenaje transhepático percutáneo</strong> si falla o la anatomía está alterada → drenaje guiado por USE → cirugía como último recurso.</p>`,
   re:{q:"Si hay que operar a un paciente séptico, ¿qué haces exactamente?",a:`<strong>Sólo coledocotomía con extracción y tubo en T.</strong> Es una operación de control de daños: descomprimir y salir. <strong>Nunca</strong> una reconstrucción definitiva —derivación biliodigestiva— en un paciente inestable; eso se difiere a un segundo tiempo cuando esté recuperado.`}},

  {dom:"tx",niv:2,q:"¿Qué antibióticos usas en colangitis y por cuánto tiempo?",
   a:`<p>Cubrir <strong>enterobacterias</strong> (<em>E. coli</em>, <em>Klebsiella</em>, <em>Enterobacter</em>), y según gravedad enterococo y anaerobios.</p>
      <ul><li><strong>Comunitaria leve-moderada:</strong> ceftriaxona + metronidazol, o piperacilina-tazobactam.</li>
      <li><strong>Grave, nosocomial, prótesis previa o riesgo de BLEE:</strong> carbapenémico.</li></ul>
      <p><strong>Duración: 4–7 días desde el control del foco.</strong> Si hay bacteriemia por grampositivos, <strong>2 semanas</strong>.</p>
      <p>Tomar hemocultivos y <strong>cultivo de bilis</strong> durante el drenaje.</p>`,
   re:{q:"¿Cuál es el germen más frecuente?",a:`<strong><em>Escherichia coli</em></strong>, seguido de <em>Klebsiella</em> y <em>Enterococcus</em>. En pacientes con prótesis biliares previas o manipulación repetida, aumentan <em>Pseudomonas</em>, enterococo y gérmenes multirresistentes — por eso ahí se escala a carbapenémico.`}},

  {dom:"tx",niv:3,q:"Pancreatitis biliar grave sin colangitis. ¿CPRE urgente?",
   a:`<p><strong>No.</strong> El ensayo <strong>APEC (2020)</strong> demostró que la CPRE urgente de rutina en pancreatitis biliar predicha grave <em>sin</em> colangitis <strong>no reduce mortalidad ni complicaciones mayores</strong>.</p>
      <p><strong>La CPRE urgente (&lt;24 h) sólo se indica si hay:</strong> colangitis concomitante, u obstrucción biliar persistente demostrada.</p>
      <p>Razón fisiopatológica: en la mayoría de los casos el cálculo <strong>ya migró al duodeno</strong> cuando el paciente llega.</p>`,
   re:{q:"¿Y cuándo le quitas la vesícula?",a:`En pancreatitis biliar <strong>leve</strong>, <strong>en el mismo ingreso</strong> — es lo que demostró el ensayo <strong>PONCHO</strong>: reduce significativamente recurrencias y reingresos frente a diferirla. En pancreatitis <strong>grave</strong> con colecciones se difiere hasta que se resuelvan o se organicen (unas 6 semanas).`}},

  {dom:"tx",niv:2,q:"¿Cómo previenes la pancreatitis post-CPRE?",
   a:`<ul><li><strong>AINE rectal:</strong> indometacina o diclofenaco <strong>100 mg</strong> peri-procedimiento. Es la medida con mejor evidencia.</li>
      <li><strong>Hidratación agresiva con Ringer lactato.</strong></li>
      <li><strong>Prótesis pancreática profiláctica</strong> si hubo canulación difícil o pancreatografía inadvertida.</li>
      <li>Canulación guiada por guía, minimizando inyecciones de contraste.</li></ul>`,
   re:{q:"¿Quién tiene más riesgo?",a:`<strong>Mujer joven</strong>, <strong>disfunción del esfínter de Oddi</strong>, <strong>bilirrubina normal</strong>, ausencia de pancreatitis crónica, antecedente de pancreatitis post-CPRE. Factores del procedimiento: <strong>canulación difícil</strong>, pancreatografía, esfinterotomía precortada, dilatación con balón del esfínter intacto. Paradoja útil: el paciente con vía biliar <em>normal</em> tiene más riesgo que el que tiene una obstrucción franca.`}},

  {dom:"trampa",niv:2,q:"¿Qué es el signo de Courvoisier y qué significa?",
   a:`<p><strong>Vesícula palpable y no dolorosa</strong> en un paciente con ictericia obstructiva → sugiere obstrucción <strong>maligna</strong> (tumor periampular, cáncer de cabeza de páncreas, colangiocarcinoma distal), <strong>no litiásica</strong>.</p>
      <p><strong>Razonamiento:</strong> en la coledocolitiasis la vesícula está <strong>fibrosada</strong> por la inflamación crónica de repetición y no puede distenderse.</p>`,
   re:{q:"¿Es una ley absoluta?",a:`<strong>No, es una regla con excepciones.</strong> Puede haber vesícula distendida con obstrucción litiásica cuando el cálculo se impacta en el colédoco de un paciente <em>sin</em> colecistitis crónica previa, o en el <strong>síndrome de Mirizzi</strong>. Y al revés: un tumor en un paciente con colelitiasis crónica puede no dar Courvoisier.`}},

  {dom:"trampa",niv:3,q:"¿Qué es el síndrome de Mirizzi y cómo se clasifica?",
   a:`<p><strong>Compresión extrínseca del conducto hepático común</strong> por un cálculo impactado en el bacinete o el cístico, con inflamación crónica que puede erosionar la pared y crear una <strong>fístula colecistobiliar</strong>.</p>
      <p><strong>Csendes:</strong> <strong>I</strong> compresión sin fístula · <strong>II</strong> fístula &lt;⅓ de la circunferencia · <strong>III</strong> hasta ⅔ · <strong>IV</strong> destrucción completa de la pared · <strong>V</strong> fístula colecistoentérica (Vb con íleo biliar).</p>`,
   re:{q:"¿Qué haces si lo encuentras en el quirófano?",a:`<strong>Bajar el umbral de conversión.</strong> Es la situación con mayor riesgo de lesión de vía biliar. Tipo I: colecistectomía, frecuentemente <strong>subtotal</strong>, dejando la placa posterior adherida. Tipos II–III: cierre con colgajo de vesícula o coledocoplastia sobre tubo en T. Tipo IV: <strong>hepaticoyeyunostomía en Y de Roux</strong>. Y siempre: <strong>hasta un 5–28% asocian cáncer de vesícula</strong>, así que hay que mandar la pieza a estudio.`}},

  {dom:"trampa",niv:2,q:"Embarazada de 22 semanas con coledocolitiasis y colangitis. ¿Qué haces?",
   a:`<p><strong>No se difiere por el embarazo.</strong> La sepsis materna es mucho más peligrosa para el feto que el procedimiento.</p>
      <ul><li><strong>Antibiótico</strong> seguro (ceftriaxona, piperacilina-tazobactam) + <strong>drenaje por CPRE</strong> con protección abdominal y <strong>mínima o nula fluoroscopia</strong> (canulación confirmada por aspiración de bilis o guiada por USE).</li>
      <li>Confirmación previa, si hace falta, con <strong>colangio-RM sin gadolinio</strong>.</li>
      <li><strong>Colecistectomía laparoscópica</strong> después, preferentemente en el <strong>segundo trimestre</strong>.</li></ul>`,
   re:{q:"¿Por qué no esperar al parto para la colecistectomía?",a:`Porque diferirla se asocia a <strong>recurrencias, reingresos, pancreatitis y mayor pérdida fetal</strong> que la propia cirugía. La colecistectomía laparoscópica es segura en cualquier trimestre; el segundo es el ideal porque ya pasó la organogénesis y el útero aún no dificulta el campo.`}},

  {dom:"trampa",niv:2,q:"¿Qué es el íleo biliar y cómo se trata?",
   a:`<p>Obstrucción intestinal por un <strong>cálculo grande</strong> que erosionó hacia el duodeno a través de una <strong>fístula colecistoentérica</strong> y se impactó, típicamente en el <strong>íleon terminal</strong> (el punto más estrecho).</p>
      <p><strong>Tríada de Rigler:</strong> neumobilia + obstrucción intestinal + cálculo ectópico visible.</p>
      <p><strong>Tratamiento: enterolitotomía</strong> — enterotomía proximal al cálculo, extracción, cierre transversal.</p>`,
   re:{q:"¿Le quitas la vesícula en el mismo acto?",a:`<strong>Normalmente no.</strong> Estos pacientes suelen ser mayores, con comorbilidad y en obstrucción; el procedimiento en un tiempo (enterolitotomía + colecistectomía + cierre de la fístula) tiene <strong>mayor morbimortalidad</strong>. Se hace la enterolitotomía sola y se reevalúa después. Sólo se considera el tiempo único en pacientes estables, de bajo riesgo y con campo favorable.`}}
  ]
},
colon:{
  eyebrow:"Tema 2 · Colon y recto",
  titulo:"Cáncer de colon",
  dek:"Aquí la doctora va a empujar en tres direcciones: <strong>qué vaso ligas y por qué</strong> (anatomía = oncología), <strong>qué vía molecular tiene el tumor</strong> (porque decide el fármaco), y <strong>a quién le das adyuvancia</strong>. Si dominas la lateralidad —derecho contra izquierdo— tienes la mitad del tema resuelta, porque explica embriología, clínica, biología y tratamiento a la vez.",
  secciones:[
  {titulo:"Guion de 60 segundos", kicker:"Si sólo te da un minuto", html:`
    <h3>El esqueleto de la respuesta</h3>
    <ul>
      <li><strong>Origen:</strong> más del 95% son adenocarcinomas que surgen de un pólipo adenomatoso, por la <strong>secuencia adenoma-carcinoma</strong>, en un proceso de unos <strong>10 años</strong> — lo que hace viable el tamizaje.</li>
      <li><strong>Tres vías:</strong> inestabilidad cromosómica (CIN, 65–70%), <strong>inestabilidad de microsatélites</strong> (MSI, ~15%) y vía <strong>serrada</strong>.</li>
      <li><strong>Tamizaje</strong> desde los <strong>45 años</strong> en riesgo promedio.</li>
      <li><strong>Estadificación:</strong> TNM quirúrgico-patológico, con un mínimo de <strong>12 ganglios</strong> examinados como estándar de calidad.</li>
      <li><strong>Cirugía:</strong> resección con <strong>ligadura vascular en el origen</strong> y escisión mesocólica completa — el territorio linfático sigue al vaso, así que el vaso define la resección.</li>
      <li><strong>Adyuvancia:</strong> estadio III siempre (FOLFOX/CAPOX); estadio II sólo si hay factores de alto riesgo, <strong>y nunca 5-FU en monoterapia si es MSI-H</strong>.</li>
      <li><strong>Metastásico:</strong> el tratamiento lo deciden <strong>RAS, BRAF, MMR/MSI, HER2 y la lateralidad</strong>. Las metástasis hepáticas resecables se operan: 40–50% de supervivencia a 5 años.</li>
    </ul>
    <div class="box acc"><span class="lbl">La idea que ordena todo el tema</span>
      <p><strong>El colon derecho y el izquierdo son dos enfermedades distintas.</strong> Derivan de esbozos embriológicos diferentes (intestino medio contra posterior), tienen irrigación distinta, se presentan distinto, tienen biología molecular distinta y responden distinto al tratamiento. Si empiezas cualquier respuesta por ahí, ya vas ganando.</p>
    </div>`},

    <p>El <strong>intestino medio</strong> (irrigado por la <strong>arteria mesentérica superior</strong>) da el ciego, colon ascendente y los <strong>dos tercios proximales del transverso</strong>. El <strong>intestino posterior</strong> (irrigado por la <strong>arteria mesentérica inferior</strong>) da el tercio distal del transverso, el descendente, el sigmoides y el recto proximal.</p>

        <text x="600" y="128" class="t-sm r-hi-t">Punto de Griffith</text>
        <text x="600" y="144" class="t-sm">ángulo esplénico</text>
        <text x="536" y="420" class="t-sm r-hi-t">Punto de Sudeck</text>
        <text x="536" y="436" class="t-sm">unión rectosigmoidea</text>
      </svg>
      </div>
      <figcaption><b>La arteria marginal es el seguro del colon, y tiene dos eslabones débiles.</b> Donde el territorio de la AMS entrega al de la AMI (<b>punto de Griffith</b>, ángulo esplénico) y donde la rectal superior entrega a las rectales medias (<b>punto de Sudeck</b>, unión rectosigmoidea), la anastomosis marginal es inconstante. Son las zonas de la colitis isquémica y las que hay que respetar al planear una anastomosis. El <b>arco de Riolano</b> es una conexión más central e inconstante entre la cólica media y la cólica izquierda.</figcaption>
    </figure>

    <h4 class="sub">Retroperitoneal contra intraperitoneal</h4>
    <p><strong>Retroperitoneales</strong> (sin mesenterio, fijos): colon <strong>ascendente</strong>, <strong>descendente</strong> y los dos tercios distales del recto. <strong>Intraperitoneales</strong> (con meso, móviles): ciego, transverso, sigmoides y tercio superior del recto.</p>
    <p><strong>Consecuencia:</strong> un tumor del colon ascendente que perfora hacia atrás produce un absceso <strong>retroperitoneal</strong> y puede invadir duodeno, uréter o riñón sin dar peritonitis; uno del sigmoides perfora libre a la cavidad y da peritonitis fecaloidea.</p>

    <h4 class="sub">Drenaje venoso y linfático</h4>
    <ul>
      <li><strong>Venoso:</strong> vena mesentérica superior e inferior → sistema <strong>porta</strong>. Por eso la primera estación metastásica es el <strong>hígado</strong>. Excepción: el recto inferior drena por las <strong>venas rectales medias e inferiores → ilíacas internas → cava</strong>, así que puede dar metástasis pulmonares sin pasar por el hígado.</li>
      <li><strong>Linfático:</strong> ganglios <strong>epicólicos</strong> (en la pared) → <strong>paracólicos</strong> (junto a la arteria marginal) → <strong>intermedios</strong> (a lo largo de los vasos) → <strong>principales o apicales</strong> (en el origen del vaso desde la aorta). <strong>El linfático sigue a la arteria: por eso la ligadura en el origen es una decisión oncológica, no técnica.</strong></li>
    </ul>

    <h4 class="sub">Las capas — y por qué el carcinoma intramucoso no metastatiza</h4>
    <p>Mucosa (epitelio, lámina propia, muscularis mucosae) · submucosa · muscular propia · subserosa/serosa.</p>
    <div class="box acc"><span class="lbl">Dato de alto rendimiento</span>
      <p><strong>La lámina propia del colon carece de linfáticos.</strong> Por eso el carcinoma <em>intramucoso</em> (que no ha pasado la muscularis mucosae) se clasifica como <span class="k">Tis</span> y <strong>no tiene potencial metastásico</strong>: la polipectomía completa es curativa. En cuanto invade la <strong>submucosa</strong> (<span class="k">T1</span>) aparece el riesgo ganglionar, del <strong>6 al 15%</strong>.</p>
      <p>Ojo: en el esófago y el estómago la lámina propia <em>sí</em> tiene linfáticos, así que ahí el intramucoso ya puede metastatizar. Es una diferencia que les gusta preguntar.</p>
    </div>`},

  {titulo:"Fisiología del colon", kicker:"Fisiología", html:`
    <h3>Qué hace realmente el colon</h3>
    <ul>
      <li><strong>Absorción de agua y electrolitos:</strong> recibe 1–2 L al día de contenido ileal y devuelve unos 100–200 mL en heces; su capacidad máxima es de unos <strong>5 L/día</strong>. El sodio se absorbe por canales <strong>ENaC</strong> bajo control de la <strong>aldosterona</strong>, con secreción de potasio y bicarbonato a cambio.</li>
      <li><strong>Fermentación bacteriana:</strong> la fibra no digerible se convierte en <strong>ácidos grasos de cadena corta</strong> — <strong>butirato</strong>, propionato y acetato.</li>
      <li><strong>Síntesis bacteriana</strong> de vitamina K y vitaminas del grupo B.</li>
      <li><strong>Motilidad:</strong> contracciones haustrales segmentarias (mezcla) y <strong>movimientos propulsores de masa</strong>, 1–3 veces al día, típicamente tras la comida (<strong>reflejo gastrocólico</strong>).</li>
    </ul>

    <div class="box acc"><span class="lbl">El butirato — la respuesta que te distingue</span>
      <p>El <strong>butirato es el combustible principal del colonocito</strong> (a diferencia del enterocito del intestino delgado, que usa glutamina). Además es <strong>inhibidor de histona-desacetilasas</strong>, lo que promueve diferenciación y apoptosis en las células con daño — es decir, tiene un papel <strong>antitumoral</strong>. Ésa es la base fisiológica del efecto protector de la fibra.</p>
      <p>Su déficit explica la <strong>colitis de derivación</strong>: un segmento de colon excluido del tránsito deja de recibir sustrato, el colonocito se queda sin butirato y la mucosa se inflama. Se trata reconstituyendo el tránsito o con enemas de ácidos grasos de cadena corta.</p>
    </div>

    <p><strong>Nota que evita un error frecuente:</strong> la reabsorción de sales biliares ocurre en el <strong>íleon terminal</strong>, no en el colon. Lo que hacen las bacterias colónicas es <em>transformarlas</em> en ácidos biliares secundarios.</p>`},

        <text x="380" y="346" class="t-sm">Misma pérdida de MMR, pero por mutación germinal</text>
        <text x="380" y="360" class="t-sm">(MLH1, MSH2, MSH6, PMS2, EPCAM) — y BRAF nativo.</text>
